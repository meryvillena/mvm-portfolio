<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de movimiento · Atlas</title>
<style>
:root{--paper:#f2eee5;--chalk:#e7dfd2;--ink:#34322d;--accent:#465f73;--mortar:#b7b0a5;
      --line:rgba(52,50,45,.24);--sans:"Avenir Next Condensed","Helvetica Neue",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,serif}
header{padding:28px clamp(20px,4vw,52px) 18px;max-width:900px}
h1{font-size:26px;font-weight:400;margin:0 0 6px}
p.sub{margin:0;color:var(--mortar);font-size:14px;line-height:1.5}
.modos{display:flex;gap:10px;padding:16px clamp(20px,4vw,52px);flex-wrap:wrap}
.modos button{font-family:var(--sans);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  padding:11px 18px;background:transparent;color:var(--ink);border:1px solid var(--accent);
  border-radius:49% 51% 47% 53%/56% 48% 52% 44%;cursor:pointer}
.modos button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.explica{padding:0 clamp(20px,4vw,52px) 16px;font-size:14px;line-height:1.6;max-width:70ch;min-height:3.2em}
.stage{--plate-w:1600px;--tx:0px;--ty:0px;position:relative;height:min(66vh,620px);overflow:hidden;
  background:var(--chalk);border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:none}
.canvas{position:absolute;top:0;left:0;width:var(--plate-w);aspect-ratio:736/824;
  transform:translate3d(var(--tx),var(--ty),0)}
.canvas img{display:block;width:100%;height:auto;mix-blend-mode:multiply;filter:saturate(.92);-webkit-user-drag:none}
.pt{position:absolute;left:var(--x);top:var(--y);width:44px;height:44px;margin:-22px 0 0 -22px;
  border:0;background:transparent;padding:0;cursor:none}
.pt::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
  border-radius:50%;background:var(--accent);transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.pt .halo{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;
  border:1px solid var(--accent);border-radius:50%;animation:lat 4.5s ease-in-out infinite}
.pt.on::after{transform:scale(1.8)}
@keyframes lat{0%,100%{transform:scale(.94);opacity:.5}50%{transform:scale(1.05);opacity:1}}
.cur{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;z-index:5;
  transform:translate3d(var(--cx,0px),var(--cy,0px),0);transition:opacity .2s}
.stage:hover .cur{opacity:1}
.cur .ring{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
  border:1px solid var(--accent);border-radius:50%;animation:resp 3.6s ease-in-out infinite}
.cur .dot{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
  border-radius:50%;background:var(--accent)}
@keyframes resp{0%,100%{transform:scale(.84)}50%{transform:scale(1.16)}}
.lente{position:absolute;left:0;right:0;top:50%;height:110px;margin-top:-55px;
  border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
  pointer-events:none;opacity:0;transition:opacity .3s;z-index:4}
.stage.modoB .lente{opacity:1}
.stage.modoB .lente.activa{border-color:var(--accent);border-top-style:solid;border-bottom-style:solid}
.ficha{position:absolute;width:300px;padding:22px;background:var(--paper);border:1px solid var(--line);
  box-shadow:0 18px 44px rgba(52,50,45,.055);opacity:0;visibility:hidden;z-index:6;pointer-events:none;
  transform:translate3d(var(--px,0px),var(--py,0px),0);transition:opacity .2s}
.ficha.on{opacity:1;visibility:visible}
.ficha .n{font-family:var(--sans);font-size:10px;letter-spacing:.14em;color:var(--accent)}
.ficha h3{margin:8px 0 10px;font-size:28px;font-weight:400}
.ficha h3 i{font-style:normal;color:var(--mortar);margin-left:8px}
.ficha p{margin:0 0 10px;font-size:14px;line-height:1.55}
.ficha .d{color:var(--accent)}
.freno{position:absolute;right:20px;bottom:18px;font-family:var(--sans);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mortar);z-index:4}
</style></head><body>

<header>
  <h1>Las dos maneras de recorrer la lámina</h1>
  <p class="sub">Las dos se mueven igual: mueve el ratón por dentro del recuadro, sin pulsar nada.
     Lo único que cambia es cómo se abre la ficha de cada punto.</p>
</header>

<div class="modos">
  <button id="bA" aria-pressed="true">A · Apuntar</button>
  <button id="bB" aria-pressed="false">B · Encuadrar</button>
  <button id="bC" aria-pressed="false">La mala · joystick</button>
</div>
<div class="explica" id="txt"></div>

<div class="stage modoA" id="stage">
  <div class="canvas" id="canvas">
    <img src="assets/atlas-puntos-limpio.webp" alt="" draggable="false">
  </div>
  <div class="lente" id="lente"></div>
  <div class="cur"><span class="ring"></span><span class="dot"></span></div>
  <p class="freno" id="freno"></p>
</div>

<script>
var DATOS=[
 {x:22.8,y:10.8,n:'01',t:'Indō',k:'印堂',d:'Entre las cejas, en la línea media de la frente.',p:'Calmar la mente, aflojar la frente, ayudar a dormir.'},
 {x:80.5,y:19.6,n:'02',t:'Kensei',k:'肩井',d:'En lo alto del hombro, entre la base del cuello y la punta del hombro.',p:'Hombros cargados, cuello rígido. «El pozo del hombro».'},
 {x:6.0, y:51.1,n:'03',t:'Gōkoku',k:'合谷',d:'Dorso de la mano, entre pulgar e índice.',p:'Dolor de cabeza y mandíbula. Aprietas la mano y responde la cabeza.'},
 {x:28.1,y:71.8,n:'04',t:'Ashi Sanri',k:'足三里',d:'Cuatro dedos bajo la rodilla, un dedo fuera de la espinilla.',p:'Digestión, energía de fondo. El punto de la vitalidad en Japón.'},
 {x:86.3,y:86.3,n:'05',t:'Yūsen',k:'湧泉',d:'Planta del pie, en el hueco al doblar los dedos.',p:'Bajar revoluciones, pies fríos, dormir. «El manantial que brota».'}
];
var stage=document.getElementById('stage'), canvas=document.getElementById('canvas'),
    cur=stage.querySelector('.cur'), lente=document.getElementById('lente'),
    freno=document.getElementById('freno'), txt=document.getElementById('txt');
var modo='A', mx=.5, my=.5, tx=0, ty=0, dx=0, dy=0, abierta=null, dentro=false;

var puntos=DATOS.map(function(o){
  var b=document.createElement('button'); b.className='pt';
  b.style.setProperty('--x',o.x+'%'); b.style.setProperty('--y',o.y+'%');
  b.innerHTML='<span class="halo"></span>'; b.dato=o; canvas.appendChild(b);
  var f=document.createElement('div'); f.className='ficha';
  f.innerHTML='<span class="n">'+o.n+'</span><h3>'+o.t+' <i>'+o.k+'</i></h3>'+
              '<p class="d">'+o.d+'</p><p>'+o.p+'</p>';
  stage.appendChild(f); b.ficha=f; return b;
});

var TEXTOS={
 A:'<b>A · Apuntar.</b> La lámina se coloca según dónde tengas el ratón: a la izquierda ves el extremo izquierdo, en el centro ves el centro. Paras el ratón y la lámina se para. La ficha se abre cuando llevas el punto de mira <b>encima</b> de un punto — y para que puedas acertarle, <b>la lámina se frena sola</b> al acercarte a uno.',
 B:'<b>B · Encuadrar.</b> Se mueve exactamente igual, pero no tienes que acertarle a nada: hay una <b>franja fija</b> a media altura y la ficha se abre sola cuando <b>un punto la cruza</b>. Subes y bajas por el cuerpo y cada punto se va presentando al pasar. La lámina lleva margen alrededor para que hasta el punto de la frente y el del pie puedan llegar a la franja. Como poner una muestra bajo el microscopio.',
 C:'<b>La mala.</b> Aquí la lámina no se coloca, se <b>desliza</b>: cuanto más lejos del centro está el ratón, más rápido corre, y no para hasta que vuelves al centro. Está para que veas por qué la descarté.'
};
function setModo(m){
  modo=m; stage.className='stage modo'+m;
  txt.innerHTML=TEXTOS[m];
  document.getElementById('bA').setAttribute('aria-pressed', m==='A');
  document.getElementById('bB').setAttribute('aria-pressed', m==='B');
  document.getElementById('bC').setAttribute('aria-pressed', m==='C');
  cerrar(); dx=0; dy=0;
}
document.getElementById('bA').onclick=function(){setModo('A')};
document.getElementById('bB').onclick=function(){setModo('B')};
document.getElementById('bC').onclick=function(){setModo('C')};

stage.addEventListener('pointerenter',function(){dentro=true});
stage.addEventListener('pointerleave',function(){dentro=false; cerrar(); freno.textContent=''});
stage.addEventListener('pointermove',function(e){
  var r=stage.getBoundingClientRect();
  mx=(e.clientX-r.left)/r.width; my=(e.clientY-r.top)/r.height;
  cur.style.setProperty('--cx',(e.clientX-r.left)+'px');
  cur.style.setProperty('--cy',(e.clientY-r.top)+'px');
});

function limites(){
  return {vw:stage.clientWidth, vh:stage.clientHeight,
          cw:canvas.offsetWidth, ch:canvas.offsetHeight};
}
function pantalla(p){   // dónde cae un punto en el recuadro, ahora mismo
  var L=limites();
  return {x:tx+parseFloat(p.style.getPropertyValue('--x'))/100*L.cw,
          y:ty+parseFloat(p.style.getPropertyValue('--y'))/100*L.ch};
}
function abrir(p){
  if(abierta===p) return;
  cerrar(); abierta=p; p.classList.add('on'); p.ficha.classList.add('on');
  var L=limites(), s=pantalla(p), f=p.ficha, fw=f.offsetWidth, fh=f.offsetHeight, g=28;
  var x=s.x+g; if(x+fw>L.vw-16) x=s.x-g-fw;
  x=Math.max(16,Math.min(x,L.vw-fw-16));
  var y=Math.max(16,Math.min(s.y-fh/2,L.vh-fh-16));
  f.style.setProperty('--px',x+'px'); f.style.setProperty('--py',y+'px');
}
function cerrar(){
  if(!abierta) return;
  abierta.classList.remove('on'); abierta.ficha.classList.remove('on'); abierta=null;
}

function bucle(){
  var L=limites();
  var minX,maxX,minY,maxY;
  if(modo==='B'){
    // margen alrededor de la lámina: sin él, los puntos pegados al borde
    // (Indō arriba, Yūsen abajo) no pueden llegar nunca a la franja
    minX=L.vw/2-L.cw; maxX=L.vw/2; minY=L.vh/2-L.ch; maxY=L.vh/2;
  }else{
    minX=Math.min(0,L.vw-L.cw); maxX=0; minY=Math.min(0,L.vh-L.ch); maxY=0;
  }
  var objX=tx, objY=ty, frenando=false;

  if(dentro){
    if(modo==='C'){                                   // joystick: velocidad
      dx += ((0.5-mx)*38 - dx)*0.12;
      dy += ((0.5-my)*38 - dy)*0.12;
      objX = tx+dx; objY = ty+dy;
    }else{                                            // A y B: posición
      var m=0.10, k=function(v){return Math.max(0,Math.min(1,(v-m)/(1-2*m)));};
      objX = maxX+k(mx)*(minX-maxX); objY = maxY+k(my)*(minY-maxY);
      if(modo==='A'){                                 // freno cerca de un punto
        var cx=mx*L.vw, cy=my*L.vh;
        for(var i=0;i<puntos.length;i++){
          var s=pantalla(puntos[i]);
          if(Math.hypot(s.x-cx,s.y-cy)<95){ objX=tx; objY=ty; frenando=true; break; }
        }
      }
    }
  }
  tx += (Math.max(minX,Math.min(maxX,objX))-tx)*0.09;
  ty += (Math.max(minY,Math.min(maxY,objY))-ty)*0.09;
  canvas.style.setProperty('--tx',tx.toFixed(1)+'px');
  canvas.style.setProperty('--ty',ty.toFixed(1)+'px');

  if(dentro){
    if(modo==='B'){                                   // ¿hay un punto en la lente?
      var ccy=L.vh/2, mejor=null, dmin=55;
      puntos.forEach(function(p){          // basta con que el punto cruce la franja
        var s=pantalla(p), d=Math.abs(s.y-ccy);
        if(d<dmin && s.x>-30 && s.x<L.vw+30){dmin=d; mejor=p;}
      });
      lente.classList.toggle('activa', !!mejor);
      mejor?abrir(mejor):cerrar();
      freno.textContent = mejor ? 'punto en la franja' : 'sube o baja hasta cruzar un punto';
    }else if(modo==='A'){
      var cx2=mx*L.vw, cy2=my*L.vh, sobre=null;
      puntos.forEach(function(p){
        var s=pantalla(p);
        if(Math.hypot(s.x-cx2,s.y-cy2)<26) sobre=p;
      });
      sobre?abrir(sobre):cerrar();
      freno.textContent = frenando ? 'lámina frenada · hay un punto cerca' : '';
    }else{ cerrar(); freno.textContent='se desliza sola · no para'; }
  }
  requestAnimationFrame(bucle);
}
setModo('A');
var img=canvas.querySelector('img');
if(img.complete) bucle(); else img.addEventListener('load',bucle,{once:true});
</script></body></html>
