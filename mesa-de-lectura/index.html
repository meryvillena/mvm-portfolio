  });

  // ---- build cards ----
  function buildCardEl(id) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card";
    var pad = String(id).padStart(2, "0");
    var arcano = ARCANOS[id];
    var nombreLargo = arcano.nombre.length > 23 ? " face-nombre-largo" : "";
    // Las cartas que ya tienen ilustración usan su dibujo; las demás siguen
    // con la cara tipográfica hasta que lleguen las suyas.
    var ILUSTRADAS = { 1: "carta-01", 2: "carta-02", 3: "carta-03", 4: "carta-04",
                       5: "carta-05", 6: "carta-06", 7: "carta-07", 8: "carta-08", 9: "carta-09", 10: "carta-10", 11: "carta-11", 12: "carta-12" };
    var front = ILUSTRADAS[id]
      // El dibujo deja libre el tercio de abajo y ahí escribe la pieza el
      // nombre y la microfrase, como texto de verdad: así se leen tanto en la
      // carta pequeña como cuando Madame la levanta.
      ? '<span class="card-side card-front card-front-ilustrada ' + ILUSTRADAS[id] + '">' +
          '<span class="face-numeral face-numeral-ilustrado">' + arcano.numeral + '</span>' +
          '<span class="face-pie">' +
            '<span class="face-nombre' + nombreLargo + '">' + arcano.nombre + '</span>' +
            '<span class="face-frase">' + arcano.microfrase + '</span>' +
          '</span>' +
        '</span>'
      : '<span class="card-side card-front card-front-arcano">' +
          '<span class="face-numeral">' + arcano.numeral + '</span>' +
          '<span class="face-simbolo">' + arcano.simbolo + '</span>' +
          '<span class="face-nombre' + nombreLargo + '">' + arcano.nombre + '</span>' +
          '<span class="face-frase">' + arcano.microfrase + '</span>' +
        '</span>';
    btn.innerHTML =
      '<span class="card-inner">' +
        '<span class="card-side card-back">' +
          '<span class="card-mark">✦</span>' +
          '<span class="card-number">' + pad + '</span>' +
        '</span>' +
        front +
      '</span>';
    return btn;
  }

  // Dónde acaban las casillas, contando desde el borde de la mesa
  function bajoLasCasillas() {
    var mesa = table.getBoundingClientRect();
    if (!slotEls.length || !mesa.height) return mesa.height * 0.55;
    return slotEls[0].getBoundingClientRect().bottom - mesa.top;
  }

  // En pantallas anchas el mazo vive a la izquierda de las casillas. En
  // pantallas estrechas no cabe al lado, así que se coloca centrado y debajo:
  // si no, tapa la casilla de Pasado y su etiqueta.
  function makeDeckData(width, height) {
    var estrecha = width < 620;
    var x = estrecha
      ? (width - CARD_WIDTH) / 2
      : Math.max(28, width * 0.14 - CARD_WIDTH / 2);
    var y = estrecha
      ? Math.min(bajoLasCasillas() + 44, Math.max(120, height - CARD_HEIGHT - 96))
      : Math.max(110, height * 0.5 - CARD_HEIGHT / 2);
    var arr = [];
    for (var i = 0; i < CARD_COUNT; i++) {
      arr.push({
        x: x + (i % 4) * 1.4,
        y: y - i * 0.8,
        rotation: ((i % 5) - 2) * 0.35,
        z: i + 1,
        slot: null,
        flipped: false,
      });
    }
    return arr;
  }

  for (var i = 0; i < CARD_COUNT; i++) {
    var el = buildCardEl(i + 1);
    var card = { id: i + 1, x: 0, y: 0, rotation: 0, z: i + 1, slot: null, flipped: false, el: el };
    cards.push(card);
    table.appendChild(el);
    bindCardEvents(card);
  }

  function applyCard(card) {
    card.el.style.transform = "translate3d(" + card.x + "px, " + card.y + "px, 0) rotate(" + card.rotation + "deg)";
    card.el.style.zIndex = card.z;
    card.el.classList.toggle("card-dragging", draggedId === card.id);
    card.el.classList.toggle("card-placed", card.slot !== null);
    card.el.classList.toggle("card-flipped", card.flipped);
    card.el.classList.toggle("card-arranging", arranging);
    var placed = card.slot !== null ? ", colocada" : "";
    var revealedName = card.flipped ? ", " + ARCANOS[card.id].nombre : "";
    card.el.setAttribute("aria-label",
      "Carta " + card.id + ", " + (card.flipped ? "revelada" : "boca abajo") + revealedName + placed +
      ". Haz clic o pulsa Enter para darle la vuelta.");
  }

  function applyAll() { cards.forEach(applyCard); }

  function setArranging(on) {
    arranging = on;
    cards.forEach(function (c) { c.el.classList.toggle("card-arranging", on); });
  }

  function renderStatus() {
    var selected = cards.filter(function (c) { return c.slot !== null; }).length;
    statusCount.textContent = selected + " / 3";
  }

  // ---- motion / physics ----
  function stopAllMotion() {
    if (frame !== null) { cancelAnimationFrame(frame); frame = null; }
    motion.clear();
    if (arrangementTimer !== null) { clearTimeout(arrangementTimer); arrangementTimer = null; }
  }

  function resetDeck() {
    var bounds = table.getBoundingClientRect();
    if (!bounds) return;
    stopAllMotion();
    zCounter = CARD_COUNT + 1;
    var deck = makeDeckData(bounds.width, bounds.height);
    cards.forEach(function (c, idx) {
      c.x = deck[idx].x; c.y = deck[idx].y; c.rotation = deck[idx].rotation;
      c.z = deck[idx].z; c.slot = null; c.flipped = false;
    });
    draggedId = null;
    activeSlot = null;
    drag = null;
    setActiveSlotHighlight(null);
    applyAll();
    renderStatus();
    updateSelection();
  }

  function slotGeometry() {
    var bounds = table.getBoundingClientRect();
    return slotEls.map(function (slot) {
      var b = slot.getBoundingClientRect();
      return {
        x: b.left - bounds.left,
        y: b.top - bounds.top,
        centerX: b.left - bounds.left + b.width / 2,
        centerY: b.top - bounds.top + b.height / 2,
      };
    });
  }

  function findClosestSlot(centerX, centerY) {
    var tableBounds = table.getBoundingClientRect();
    var closest = null;
    slotEls.forEach(function (slot, index) {
      var b = slot.getBoundingClientRect();
      var slotX = b.left - tableBounds.left + b.width / 2;
      var slotY = b.top - tableBounds.top + b.height / 2;
      var distance = Math.hypot(centerX - slotX, centerY - slotY);
      if (distance < 88 && (!closest || distance < closest.distance)) {
        closest = { index: index, distance: distance };
      }
    });
    return closest ? closest.index : null;
  }

  function setActiveSlotHighlight(index) {
    slotEls.forEach(function (slot, i) {
      slot.classList.toggle("slot-active", i === index);
    });
  }

  function runPhysics() {
    var bounds = table.getBoundingClientRect();
    if (!bounds || motion.size === 0) { frame = null; return; }

    var slots = slotGeometry();
    var occupied = new Set();
    cards.forEach(function (c) { if (c.slot !== null) occupied.add(c.slot); });
    var selectionChanged = false;

    cards.forEach(function (card) {
      var m = motion.get(card.id);
      if (!m || card.slot !== null) return;

      m.velocityX *= physics.friction;
      m.velocityY *= physics.friction;
      var x = card.x + m.velocityX * 16;
      var y = card.y + m.velocityY * 16;
      var maxX = bounds.width - CARD_WIDTH - 10;
      var maxY = bounds.height - CARD_HEIGHT - 14;

      if (x <= 10 || x >= maxX) { x = Math.max(10, Math.min(maxX, x)); rebote(m, Math.abs(m.velocityX)); m.velocityX *= -physics.bounce; }
      if (y <= 76 || y >= maxY) { y = Math.max(76, Math.min(maxY, y)); rebote(m, Math.abs(m.velocityY)); m.velocityY *= -physics.bounce; }

      var centerX = x + CARD_WIDTH / 2;
      var centerY = y + CARD_HEIGHT / 2;
      var captured = -1;
      if (m.canSnap) {
        for (var s = 0; s < slots.length; s++) {
          if (!slots[s] || occupied.has(s)) continue;
          if (Math.hypot(centerX - slots[s].centerX, centerY - slots[s].centerY) < physics.snap) { captured = s; break; }
        }
      }

      if (captured !== -1) {
        occupied.add(captured);
        motion.delete(card.id);
        card.x = slots[captured].x;
        card.y = slots[captured].y;
        card.rotation = 0;
        card.slot = captured;
        selectionChanged = true;
        applyCard(card);
        return;
      }

      if (Math.hypot(m.velocityX, m.velocityY) < 0.018) {
        motion.delete(card.id);
        card.x = x; card.y = y; card.rotation = card.rotation * 0.45;
        applyCard(card);
        return;
      }

      card.x = x; card.y = y;
      card.rotation = Math.max(-11, Math.min(11, m.velocityX * physics.rotation));
      applyCard(card);
    });

    if (selectionChanged) { renderStatus(); updateSelection(); }
    frame = requestAnimationFrame(runPhysics);
  }

  function throwCard(id, vx, vy) {
    if (reducedMotion() || Math.hypot(vx, vy) < 0.035) return;
    if (Math.hypot(vx, vy) > 0.9) gestos.fuerte += 1;
    sonar("lanzar");
    motion.set(id, {
      velocityX: Math.max(-3.8, Math.min(3.8, vx * physics.throwForce)),
      velocityY: Math.max(-3.8, Math.min(3.8, vy * physics.throwForce)),
      canSnap: true,
    });
    if (frame === null) frame = requestAnimationFrame(runPhysics);
  }

  function arrangeCards(getLayout) {
    cancelarEspera();
    stopAllMotion();
    if (arrangementTimer !== null) { clearTimeout(arrangementTimer); arrangementTimer = null; }
    setArranging(true);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        cards.forEach(function (card, index) {
          var layout = getLayout(card, index);
          for (var k in layout) { card[k] = layout[k]; }
          card.slot = null;
          applyCard(card);
        });
        renderStatus();
        updateSelection();
      });
    });
    arrangementTimer = setTimeout(function () {
      setArranging(false);
      arrangementTimer = null;
      applyAll();
    }, 940);
  }

  function gatherDeck() {
    sonarBarajado(6);
    var bounds = table.getBoundingClientRect();
    var deck = makeDeckData(bounds.width, bounds.height);
    arrangeCards(function (card, index) {
      return { x: deck[index].x, y: deck[index].y, rotation: deck[index].rotation, flipped: false, z: index + 1 };
    });
    zCounter = CARD_COUNT + 1;
  }

  // Mezcla un array en el sitio (Fisher-Yates)
  function barajarArray(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function fanDeck() {
    sonarBarajado(9);
    var bounds = table.getBoundingClientRect();
    // El abanico se reparte el ancho que hay de verdad: con un mínimo fijo se
    // salía de la mesa en pantallas estrechas
    var availableWidth = Math.max(120, bounds.width - CARD_WIDTH - 40);
    var spacing = Math.min(72, availableWidth / (CARD_COUNT - 1));
    var totalWidth = spacing * (CARD_COUNT - 1) + CARD_WIDTH;
    var startX = Math.max(24, (bounds.width - totalWidth) / 2);
    var baseY = Math.min(bounds.height - CARD_HEIGHT - 54, Math.max(250, bounds.height * 0.57));
    // Barajamos las posiciones del abanico: las cartas nunca salen en orden,
    // que aquí se viene a elegir a ciegas
    var order = barajarArray(cards.map(function (_, i) { return i; }));
    arrangeCards(function (card, index) {
      var pos = order[index];
      var normalized = pos / (CARD_COUNT - 1) - 0.5;
      return {
        x: startX + pos * spacing,
        y: baseY + Math.abs(normalized) * 34,
        rotation: normalized * 24,
        flipped: false,
        z: pos + 1,
      };
    });
    zCounter = CARD_COUNT + 1;
  }

  // Doce sitios repartidos por la mesa, desordenados pero sin amontonarse
  // ni pegarse a los bordes. El control "Barajar" del laboratorio regula
  // cuánto se dispersan.
  function repartoDesordenado(bounds) {
    var tableTop = table.getBoundingClientRect().top;
    var bajoLasCasillas = slotEls[0].getBoundingClientRect().bottom - tableTop + 26;
    // Las cartas no deben tapar ni las casillas ni la burbuja del oráculo
    var techoOraculo = document.querySelector(".oracle-dialogue").getBoundingClientRect().top - tableTop - 14;
    var margen = 18;
    var top = Math.max(90, bajoLasCasillas);
    var bottom = Math.min(bounds.height - CARD_HEIGHT - 20, techoOraculo - CARD_HEIGHT);
    // En ventanas bajas la banda se queda corta: las cartas se solapan más,
    // que para eso están revueltas
    if (bottom < top) bottom = top;
    var columnas = 4, filas = 3;
    var anchoUtil = Math.max(40, bounds.width - CARD_WIDTH - margen * 2);
    var altoUtil = bottom - top;
    var desorden = Math.max(0.4, physics.scatter);

    var sitios = [];
    for (var f = 0; f < filas; f++) {
      for (var c = 0; c < columnas; c++) {
        sitios.push({
          x: margen + (anchoUtil * c) / (columnas - 1) + (Math.random() - 0.5) * 30 * desorden,
          y: top + (altoUtil * f) / (filas - 1) + (Math.random() - 0.5) * 26 * desorden,
          rot: (Math.random() - 0.5) * 44 * desorden,
        });
      }
    }
    sitios.forEach(function (p) {
      // Una carta ladeada ocupa más sitio del que mide: el rectángulo que la
      // envuelve crece con el ángulo. Si no se cuenta ese sobrante, las cartas
      // más giradas se salen por el borde de la mesa.
      var a = Math.abs(p.rot) * Math.PI / 180;
      var sobraX = (CARD_WIDTH * Math.cos(a) + CARD_HEIGHT * Math.sin(a) - CARD_WIDTH) / 2;
      var sobraY = (CARD_HEIGHT * Math.cos(a) + CARD_WIDTH * Math.sin(a) - CARD_HEIGHT) / 2;
      p.x = Math.min(Math.max(margen + sobraX, p.x), bounds.width - CARD_WIDTH - margen - sobraX);
      p.y = Math.min(Math.max(top - 10 + sobraY, p.y), bottom - sobraY);
    });

    // Barajar de verdad: se mezclan los sitios y también el orden de apilado
    barajarArray(sitios);
    var zetas = barajarArray(cards.map(function (_, i) { return i + 1; }));
    sitios.forEach(function (p, i) { p.z = zetas[i]; });
    return sitios;
  }

  // Barajar: el mazo se recoge en el centro, se mezcla y las cartas quedan
  // repartidas y desordenadas por la mesa. Se puede repetir sin que se
  // acaben amontonando contra los bordes.
  function barajarMazo() {
    gestos.mezclas += 1;
    sonarBarajado(14);
    var bounds = table.getBoundingClientRect();
    var reparto = repartoDesordenado(bounds);

    if (reducedMotion()) {
      cancelarEspera();
      stopAllMotion();
      cards.forEach(function (card, index) {
        var sitio = reparto[index];
        card.x = sitio.x; card.y = sitio.y; card.rotation = sitio.rot; card.z = sitio.z;
        card.slot = null; card.flipped = false;
        applyCard(card);
      });
      renderStatus();
      updateSelection();
      zCounter = CARD_COUNT + 1;
      return;
    }

    // 1) las cartas se juntan en el centro, como quien recoge el mazo para barajar
    arrangeCards(function (card, index) {
      return {
        x: bounds.width / 2 - CARD_WIDTH / 2 + (Math.random() - 0.5) * 30,
        y: bounds.height * 0.5 - CARD_HEIGHT / 2 + (Math.random() - 0.5) * 30,
        rotation: (Math.random() - 0.5) * 26,
        flipped: false,
        z: index + 1,
      };
    });

    // 2) y vuelven a la mesa mezcladas, en sitios y orden nuevos
    setTimeout(function () {
      arrangeCards(function (card, index) {
        var sitio = reparto[index];
        return { x: sitio.x, y: sitio.y, rotation: sitio.rot, flipped: false, z: sitio.z };
      });
      zCounter = CARD_COUNT + 1;
    }, 360);
  }

  // ---- flipping ----
  function flipCard(id) {
    var card = cards.find(function (c) { return c.id === id; });
    if (!card) return;
    card.flipped = !card.flipped;
    sonar("girar");
    if (card.flipped) anotarArcano(card.id);
    // Girar una carta que aún no está en su casilla: mirar antes de decidir
    if (card.flipped && card.slot === null) gestos.giroSuelto += 1;
    if (card.flipped) dismissHint();
    applyCard(card);
    updateSelection();
  }

  // ---- aviso "haz clic" ----
  function showHint(card) {
    if (hintDismissed || card.flipped || drag || arranging) return;
    // Si la carta está muy arriba, el aviso sale por debajo para no chocar con la cabecera
    var nearTop = card.y < 130;
    // Sujeto el aviso dentro de la mesa para que no se corte en los bordes
    var half = cardHint.offsetWidth / 2;
    var tableWidth = table.getBoundingClientRect().width;
    var left = Math.min(Math.max(card.x + CARD_WIDTH / 2, half + 10), tableWidth - half - 10);
    cardHint.style.left = left + "px";
    cardHint.style.top = nearTop ? (card.y + CARD_HEIGHT + 12) + "px" : (card.y - 40) + "px";
    cardHint.classList.add("card-hint-visible");
  }

  function hideHint() {
    cardHint.classList.remove("card-hint-visible");
  }

  function dismissHint() {
    hintDismissed = true;
    hideHint();
  }

  // ---- pointer interactions ----
  function bindCardEvents(card) {
    var el = card.el;
    el.addEventListener("pointerdown", function (event) { onPointerDown(event, card); });
    el.addEventListener("pointermove", onPointerMove);
    el.addEventListener("pointerup", onPointerUp);
    el.addEventListener("pointercancel", onPointerUp);
    el.addEventListener("pointerenter", function (event) {
      if (event.pointerType === "mouse") showHint(card);
    });
    el.addEventListener("pointerleave", hideHint);
    el.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); flipCard(card.id); }
    });
  }

  function onPointerDown(event, card) {
    var tableBounds = table.getBoundingClientRect();
    if (!tableBounds) return;
    motion.delete(card.id);
    if (gestos.inicio === null) gestos.inicio = performance.now();
    sonar("coger");
    hideHint();
    manosDentro(true);
    try { event.currentTarget.setPointerCapture(event.pointerId); } catch (e) {}
    var pointerX = event.clientX - tableBounds.left;
    var pointerY = event.clientY - tableBounds.top;
    drag = {
      id: card.id,
      pointerId: event.pointerId,
      offsetX: pointerX - card.x,
      offsetY: pointerY - card.y,
      lastX: pointerX,
      lastY: pointerY,
      lastTime: performance.now(),
      velocityX: 0,
      velocityY: 0,
      moved: 0,
      attached: card.slot !== null,
      startX: pointerX,
      startY: pointerY,
    };
    draggedId = card.id;
    card.z = siguienteZ();
    applyCard(card);
  }

  function onPointerMove(event) {
    var tableBounds = table.getBoundingClientRect();
    if (!drag || drag.pointerId !== event.pointerId || !tableBounds) return;
    var card = cards.find(function (c) { return c.id === drag.id; });
    if (!card) return;

    var pointerX = event.clientX - tableBounds.left;
    var pointerY = event.clientY - tableBounds.top;
    var distanceFromStart = Math.hypot(pointerX - drag.startX, pointerY - drag.startY);

    if (drag.attached && distanceFromStart < 24) { drag.moved = distanceFromStart; return; }
    if (drag.attached) {
      drag.attached = false;
      gestos.cambios += 1; // saca una carta que ya había colocado: cambio de opinión
      card.slot = null;
      renderStatus();
      updateSelection();
    }

    var now = performance.now();
    var elapsed = Math.max(8, now - drag.lastTime);
    var instantX = (pointerX - drag.lastX) / elapsed;
    var instantY = (pointerY - drag.lastY) / elapsed;
    drag.velocityX = drag.velocityX * 0.58 + instantX * 0.42;
    drag.velocityY = drag.velocityY * 0.58 + instantY * 0.42;
    drag.moved += Math.hypot(pointerX - drag.lastX, pointerY - drag.lastY);
    drag.lastX = pointerX;
    drag.lastY = pointerY;
    drag.lastTime = now;

    var maxX = tableBounds.width - CARD_WIDTH;
    var maxY = tableBounds.height - CARD_HEIGHT;
    var targetX = pointerX - drag.offsetX;
    var targetY = pointerY - drag.offsetY;
    var lagX = Math.max(-38, Math.min(38, drag.velocityX * physics.dragLag));
    var lagY = Math.max(-38, Math.min(38, drag.velocityY * physics.dragLag));
    var x = Math.min(Math.max(10, targetX - lagX), maxX - 10);
    var y = Math.min(Math.max(76, targetY - lagY), maxY - 14);

    card.x = x;
    card.y = y;
    card.rotation = Math.max(-8, Math.min(8, drag.velocityX * 3.1));
    applyCard(card);

    activeSlot = findClosestSlot(x + CARD_WIDTH / 2, y + CARD_HEIGHT / 2);
    setActiveSlotHighlight(activeSlot);
  }

  function onPointerUp(event) {
    if (!drag || drag.pointerId !== event.pointerId) return;
    var card = cards.find(function (c) { return c.id === drag.id; });
    var slotIndex = activeSlot;
    var isTap = drag.moved < 8;

    // Un solo clic (o toque) sin apenas mover la carta = darle la vuelta
    if (isTap) flipCard(drag.id);

    if (slotIndex !== null && card) {
      sonar("imantar");
      var tableBounds = table.getBoundingClientRect();
      var slotBounds = slotEls[slotIndex].getBoundingClientRect();
      var x = slotBounds.left - tableBounds.left;
      var y = slotBounds.top - tableBounds.top;
      cards.forEach(function (c) {
        if (c.id === drag.id) { c.x = x; c.y = y; c.rotation = 0; c.slot = slotIndex; applyCard(c); }
        else if (c.slot === slotIndex) {
          // La carta que ya estaba en esa casilla se aparta hacia abajo, fuera de ella,
          // para que lo que se ve coincida con lo que cuenta el marcador.
          c.slot = null;
          c.y = Math.min(c.y + CARD_HEIGHT * 0.7 + 24, tableBounds.height - CARD_HEIGHT - 14);
          c.x = Math.min(Math.max(10, c.x + (Math.random() * 40 - 20)), tableBounds.width - CARD_WIDTH - 10);
          c.rotation = Math.random() * 10 - 5;
          applyCard(c);
        }
      });
      renderStatus();
      updateSelection();
    } else if (!isTap && card) {
      throwCard(drag.id, drag.velocityX, drag.velocityY);
    }

    drag = null;
    draggedId = null;
    activeSlot = null;
    setActiveSlotHighlight(null);
    if (card) applyCard(card);
  }

  // ---- dialogue engine ----
  function currentPhrase() {
    if (canal === CANAL_BUHO) return frasesBuho[buhoStep];
    return dialogueOverride !== null ? dialogueOverride : DIALOGUE[dialogueIndex];
  }

  // ¿Le queda algo por decir a quien está hablando ahora?
  function quedaFrase() {
    if (canal === CANAL_BUHO) return buhoStep < frasesBuho.length - 1;
    return readingStep !== null && readingStep < readingLines.length - 1;
  }

  function pasarDeFrase() {
    if (canal === CANAL_BUHO) { buhoStep += 1; marcarEsperaDeClic(false); startTyping(); return; }
    setReadingStep(readingStep + 1);
  }

  // ---- motor de lecturas ----
  function elegir(variantes) {
    return variantes[Math.floor(Math.random() * variantes.length)];
  }

  // El oráculo comenta cómo has jugado. Solo salta si has hecho algo llamativo,
  // así que no aparece en todas las tiradas: parte de la gracia es que sorprenda.
  // Textos aprobados en BARAJA-MAESTRA.md (sección «Observaciones de gesto»).
  // El oráculo solo comenta cuando haces algo de verdad llamativo (topes altos):
  // así es raro en el juego normal, pero SIEMPRE reacciona si insistes en el gesto.
  function observacionDeGestos() {
    var segundos = gestos.inicio === null ? 0 : (performance.now() - gestos.inicio) / 1000;
    if (gestos.fuerte >= 2) return "Has arrojado las cartas con cierta vehemencia. El destino suele preferir que lo invoquen sin amenazas.";
    if (gestos.mezclas >= 5) return "Has mezclado las cartas con insistencia. El destino tolera las dudas; las negociaciones, bastante menos.";
    if (gestos.cambios >= 2) return "Has cambiado de sitio una carta que ya habías elegido. El destino también conoce esa costumbre de llamar ajuste a cambiar de opinión.";
    if (gestos.giroSuelto >= 2) return "Has mirado una carta antes de entregársela a la mesa. El destino lo ha visto; por elegancia, fingirá que no.";
    if (segundos > 0 && segundos < 20) return "Has elegido sin apenas dudar. El destino rara vez presencia tanta decisión en horario laboral.";
    if (segundos > 150) return "Has tardado tanto en elegir que las cartas han empezado a deliberar sobre ti. Sus conclusiones no son unánimes.";
    return null;
  }

  // Presenta una carta por su nombre antes de leerla, con su microfrase.
  function presentar(casilla, card) {
    return elegir(PRESENTACIONES[casilla])
      .replace("{carta}", ARCANOS[card.id].nombre)
      .replace("{microfrase}", ARCANOS[card.id].microfrase);
  }

  var CASILLAS = ["pasado", "presente", "futuro"];

  function cartasEnMesa() {
    var porCasilla = [null, null, null];
    cards.forEach(function (c) { if (c.slot !== null) porCasilla[c.slot] = c; });
    return porCasilla;
  }

  // ¿Esta carta se niega a ser leída? Solo puede pasar una vez por lectura.
  function seNiegaALeerse(card) {
    if (card.id !== CARTA_ESQUIVA || yaSeNegoEstaLectura) return false;
    var salta = !esquivaDescubierta || Math.random() < PROBABILIDAD_ESQUIVA;
    if (salta) { yaSeNegoEstaLectura = true; esquivaDescubierta = true; }
    return salta;
  }

  // Despedidas: el oráculo cierra SIEMPRE con una (al azar) para que quede claro
  // que la tirada ha terminado. Aprobadas por Mery en BARAJA-MAESTRA.md.
  var DESPEDIDAS = [
    "Las cartas han hablado. A partir de aquí, negarán cualquier responsabilidad.",
    "La lectura termina aquí. Las consecuencias, como siempre, empiezan después.",
    "El porvenir queda en tus manos. Las cartas se limitan a señalarlo desde una distancia prudencial.",
    "El oráculo da por concluida la sesión. El destino se reserva el derecho a introducir cambios.",
    "Ya conoces el augurio. Fingir que no lo has oído también es una decisión.",
  ];

  // Cada cuánto aparece el remate final (guiño ocasional, no en cada tirada).
  var PROBABILIDAD_REMATE = 0.4;

  // Final de la lectura: afinidad, cierre de síntesis y remate
  // Cada frase de la lectura viaja con la carta de la que habla (o con null si
  // no habla de ninguna). Es lo que permite levantar esa carta mientras suena.
  function lineasDeCierre(mesa) {
    var lines = [], deQuien = [];
    function di(frase, carta) { lines.push(frase); deQuien.push(carta || null); }
    // Afinidades: como mucho una por lectura, para no romper el ritmo
    var ids = [mesa[0].id, mesa[1].id, mesa[2].id];
    var parejas = AFINIDADES.filter(function (a) {
      return ids.indexOf(a.pareja[0]) !== -1 && ids.indexOf(a.pareja[1]) !== -1;
    });
    // La afinidad habla de dos cartas a la vez, así que no levanta ninguna
    if (parejas.length) di(elegir(parejas).frase, null);
    // El oráculo concluye antes de permitirse el chiste
    var arco = ENERGIA[mesa[0].id] + "→" + ENERGIA[mesa[2].id];
    if (CIERRES[arco]) di(CIERRES[arco], null);
    // El remate es un guiño final que solo aparece de vez en cuando. Llega sin
    // anunciarse: un chiste que se avisa deja de serlo. Es de la carta de Futuro.
    if (Math.random() < PROBABILIDAD_REMATE) di(LECTURAS[mesa[2].id].remate, mesa[2].id);
    // Y siempre una despedida al final: así se sabe que la tirada ha terminado.
    di(elegir(DESPEDIDAS), null);
    return { lines: lines, deQuien: deQuien };
  }

  // Recorre las casillas desde `desde`. Si una carta se niega a ser leída,
  // la lectura se corta ahí y devuelve el hueco que hay que rellenar.
  function lineasDeCasillas(mesa, desde) {
    var lines = [], deQuien = [];
    function di(frase, carta) { lines.push(frase); deQuien.push(carta || null); }
    for (var i = desde; i < 3; i++) {
      if (seNiegaALeerse(mesa[i])) {
        // La negativa habla de la carta que se está yendo
        NEGATIVA.forEach(function (frase) { di(frase, mesa[i].id); });
        return { lines: lines, deQuien: deQuien, hueco: i };
      }
      di(presentar(CASILLAS[i], mesa[i]), mesa[i].id);
      di(LECTURAS[mesa[i].id][CASILLAS[i]], mesa[i].id);
      // Un aparte como mucho por lectura, y no siempre
      if (!yaHuboAparte && APARTES[mesa[i].id] && Math.random() < PROBABILIDAD_APARTE) {
        yaHuboAparte = true;
        di(APARTES[mesa[i].id], mesa[i].id);
      }
    }
    var cierre = lineasDeCierre(mesa);
    return { lines: lines.concat(cierre.lines), deQuien: deQuien.concat(cierre.deQuien), hueco: null };
  }

  // Monta la lectura de la tirada actual siguiendo la estructura aprobada en
  // BARAJA-MAESTRA.md: apertura + las tres cartas (presentadas y leídas) +
  // afinidad si la hay + cierre de síntesis + remate.
  function buildReading() {
    var mesa = cartasEnMesa();
    if (!mesa[0] || !mesa[1] || !mesa[2]) return { lines: [], hueco: null };

    yaSeNegoEstaLectura = false;
    yaHuboAparte = false;
    recuentoPendiente = false;
    if (!esperandoAMadame) callaElBuho(); // el recuento anterior deja sitio
    var lines = [elegir(SISTEMA.apertura)];
    var deQuien = [null];
    var observacion = observacionDeGestos();
    if (observacion) { lines.push(observacion); deQuien.push(null); }
    // Cada lectura consume los gestos: la siguiente empieza a contar de cero
    gestos = { fuerte: 0, mezclas: 0, cambios: 0, giroSuelto: 0, inicio: null };

    var resto = lineasDeCasillas(mesa, 0);
    return {
      lines: lines.concat(resto.lines),
      deQuien: deQuien.concat(resto.deQuien),
      hueco: resto.hueco,
    };
  }

  // ---- la carta que se niega a ser leída ----
  // La carta se va sola de la casilla y el oráculo espera a que saques otra.
  function apartarCarta(card) {
    card.slot = null;
    card.flipped = false;
    card.z = siguienteZ();
    applyCard(card);
    if (reducedMotion()) return;
    motion.set(card.id, {
      velocityX: -1.5 - Math.random() * 0.7,
      velocityY: 0.8 + Math.random() * 0.5,
      canSnap: false,
    });
    if (frame === null) frame = requestAnimationFrame(runPhysics);
  }

  function iniciarEspera(slot) {
    var card = cards.filter(function (c) { return c.slot === slot; })[0];
    espera = { slot: slot };
    huecoPendiente = null;
    if (card) apartarCarta(card);
    slotEls[slot].classList.add("slot-esperando");
    renderStatus();
  }

  function reanudarLectura() {
    var slot = espera.slot;
    slotEls[slot].classList.remove("slot-esperando");
    espera = null;
    var mesa = cartasEnMesa();
    if (!mesa[0] || !mesa[1] || !mesa[2]) return;
    var resto = lineasDeCasillas(mesa, slot);
    readingLines = readingLines.concat([elegir(SISTEMA.reanuda)]).concat(resto.lines);
    readingCards = readingCards.concat([null]).concat(resto.deQuien);
    huecoPendiente = resto.hueco;
    setReadingStep(readingStep + 1);
    renderStatus();
  }

  function cancelarEspera() {
    if (espera === null) return;
    slotEls[espera.slot].classList.remove("slot-esperando");
    espera = null;
    huecoPendiente = null;
  }

  // Ritmo del oráculo. Va despacio a propósito: es una lectura, no un aviso.
  // La lectura no avanza sola: cada frase espera a que hagas clic, así que
  // el ritmo lo marcas tú y el texto puede escribirse algo más rápido.
  var TYPING_SPEED = 42;      // milisegundos por letra

  // El texto aprobado marca con **negrita** el nombre de la carta y con
  // *cursiva* su microfrase. Como la frase se escribe letra a letra, se parte
  // en tramos con estilo y se van revelando en orden.
  function trozos(texto) {
    var out = [];
    var re = /\*\*([^*]+)\*\*|\*([^*]+)\*/g;
    var last = 0;
    var m;
    while ((m = re.exec(texto)) !== null) {
      if (m.index > last) out.push({ t: texto.slice(last, m.index), e: null });
      out.push({ t: m[1] !== undefined ? m[1] : m[2], e: m[1] !== undefined ? "strong" : "em" });
      last = re.lastIndex;
    }
    if (last < texto.length) out.push({ t: texto.slice(last), e: null });
    return out;
  }

  // Longitud de la frase tal como se ve, sin las marcas de estilo
  function textoVisible(texto) {
    return texto.replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\*([^*]+)\*/g, "$1");
  }

  function escapar(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function pintarFrase(tramos, hasta) {
    var html = "";
    var n = 0;
    for (var i = 0; i < tramos.length && n < hasta; i++) {
      var tramo = tramos[i];
      var cuantos = Math.min(tramo.t.length, hasta - n);
      var visible = escapar(tramo.t.slice(0, cuantos));
      html += tramo.e ? "<" + tramo.e + ">" + visible + "</" + tramo.e + ">" : visible;
      n += cuantos;
    }
    canal.texto.innerHTML = html;
  }

  function clearDialogueTimers() {
    if (autoAdvanceTimer !== null) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
    if (readingTimer !== null) { clearTimeout(readingTimer); readingTimer = null; }
  }

  function startTyping() {
    if (typingInterval !== null) { clearInterval(typingInterval); typingInterval = null; }
    clearDialogueTimers();
    var phrase = currentPhrase();
    var tramos = trozos(phrase);
    var visible = textoVisible(phrase);
    var largo = visible.length;
    dialogueComplete = false;
    // Si vuelve a hablar Madame, su burbuja reaparece: se esconde al cederle
    // el cierre al búho y no hay otro sitio donde volver a encenderla.
    if (canal === CANAL_MADAME) oracleDialogue.classList.remove("sin-madame");
    canal.texto.textContent = "";
    canal.cursor.classList.remove("typing-cursor-idle");

    if (reducedMotion()) {
      pintarFrase(tramos, largo);
      dialogueComplete = true;
      onDialogueComplete();
      return;
    }

    var ch = 0;
    typingInterval = setInterval(function () {
      ch += 1;
      pintarFrase(tramos, ch);
      sonarTecla(visible.charAt(ch - 1));
      if (ch >= largo) {
        clearInterval(typingInterval);
        typingInterval = null;
        dialogueComplete = true;
        canal.cursor.classList.add("typing-cursor-idle");
        onDialogueComplete();
      }
    }, TYPING_SPEED);
  }

  // Clic en la burbuja: si está escribiendo, muestra la frase entera;
  // si ya ha terminado, pasa a la siguiente. Para quien lee a otro ritmo.
  // Un clic: si está escribiendo, muestra la frase entera; si ya ha terminado,
  // pasa a la siguiente. Vale igual para Madame y para el búho.
  function advanceDialogue() {
    if (typingInterval !== null) {
      clearInterval(typingInterval);
      typingInterval = null;
      var entera = currentPhrase();
      pintarFrase(trozos(entera), textoVisible(entera).length);
      dialogueComplete = true;
      canal.cursor.classList.add("typing-cursor-idle");
      onDialogueComplete();
      return;
    }
    // Madame ya se ha despedido: el clic siguiente le cede la palabra al búho,
    // que es quien lleva la cuenta de los arcanos. Nunca hablan a la vez.
    if (recuentoPendiente && canal === CANAL_MADAME) {
      recuentoPendiente = false;
      marcarEsperaDeClic(false);
      oracleDialogue.classList.add("sin-madame");
      mostrarRecuentoDelBuho();
      return;
    }
    if (quedaFrase()) pasarDeFrase();
  }

  // La bola llama a Madame, esté el búho por donde esté
  function tocarLaBola() {
    if (llamarAMadame()) return;
    advanceDialogue();
  }

  function onDialogueComplete() {
    // El búho escribe igual que Madame: al acabar la frase espera un clic
    if (canal === CANAL_BUHO) {
      if (dialogueComplete && quedaFrase()) marcarEsperaDeClic(true);
      return;
    }
    // Effect A: intro auto-advance
    if (dialogueComplete && dialogueIndex === 0 && dialogueOverride === null) {
      autoAdvanceTimer = setTimeout(function () { setDialogueIndex(1); }, 2300);
    }
    // Effect B: reading progression
    if (readingStep === null || !dialogueComplete) return;

    // La carta esquiva: al terminar la negativa, la carta se va y el oráculo espera
    if (huecoPendiente !== null && readingStep === readingLines.length - 1) {
      var casilla = huecoPendiente;
      readingTimer = setTimeout(function () { iniciarEspera(casilla); }, 700);
      return;
    }

    // La lectura no corre sola: se queda esperando a que hagas clic
    if (readingStep < readingLines.length - 1) marcarEsperaDeClic(true);
    // Y cuando Madame se despide, el recuento del búho queda a la espera: no
    // se suelta encima de la despedida. Primero cierra ella, luego habla él.
    else { recuentoPendiente = true; marcarEsperaDeClic(true); }
  }

  // Mientras el oráculo espera clic, la burbuja se vuelve pulsable y enseña
  // una flecha, para que se entienda que la lectura sigue cuando tú quieras.
  function marcarEsperaDeClic(on) {
    canal.dialogo.classList.toggle("oracle-esperando", on);
  }

  function setDialogueIndex(i) {
    if (dialogueIndex === i && dialogueOverride === null) return;
    dialogueIndex = i;
    startTyping();
  }

  // ---- la sala de espera ----
  // Madame no habla hasta que la llaman: hasta entonces solo hay una nota del
  // búho y la mesa entera para trastear.
  var esperandoAMadame = true;

  // La nota del búho no se escribe letra a letra: los carteles no hablan,
  // simplemente están puestos.
  function hablaElBuho(frases) {
    frasesBuho = frases;
    buhoStep = 0;
    canal = CANAL_BUHO;
    buhoDialogo.hidden = false;
    startTyping();
  }

  function callaElBuho() {
    if (canal === CANAL_BUHO) {
      if (typingInterval !== null) { clearInterval(typingInterval); typingInterval = null; }
      marcarEsperaDeClic(false);
      canal = CANAL_MADAME;
    }
    buhoDialogo.hidden = true;
  }

  function mostrarNotaDelBuho() {
    oracleDialogue.classList.add("sin-madame");
    oracleAvatar.classList.add("bola-llamando");
    hablaElBuho(avisoDelBuho());
  }

  // Al terminar la lectura, el búho anota cuántos arcanos llevas conocidos
  function mostrarRecuentoDelBuho() {
    var frases = frasesDelRecuento();
    if (frases) hablaElBuho(frases);
  }

  function salirDeLaEspera() {
    if (!esperandoAMadame) return false;
    esperandoAMadame = false;
    callaElBuho();
    oracleDialogue.classList.remove("sin-madame");
    oracleAvatar.classList.remove("bola-llamando");
    return true;
  }

  // Pulsar la bola es lo que hace aparecer a Madame
  function llamarAMadame() {
    if (!salirDeLaEspera()) return false;
    dialogueOverride = null;
    dialogueIndex = 0;
    // Lo primero que hace al aparecer es dar por sabido a qué vienes
    presumirLaPregunta();
    startTyping();
    return true;
  }

  // En la burbuja habla siempre Madame Cesoir 🔮. El búho 🦉 no habla:
  // es señalética, y vive en las etiquetas pequeñas de la mesa.
  function setDialogueOverride(v) {
    if (dialogueOverride === v) return;
    dialogueOverride = v;
    startTyping();
  }

  // La carta de la que se está hablando se levanta de la mesa. Es lo que
  // vuelve legible su dibujo y, sobre todo, lo que deja claro a cuál de las
  // tres se refiere Madame.
  function levantarCarta(id) {
    cards.forEach(function (c) {
      c.el.classList.toggle("card-leyendo", c.id === id);
    });
  }

  function setReadingStep(step) {
    if (readingStep === step) return;
    marcarEsperaDeClic(false);
    readingStep = step;
    if (readingTimer !== null) { clearTimeout(readingTimer); readingTimer = null; }
    if (step !== null) {
      levantarCarta(readingCards[step]);
      setDialogueOverride(readingLines[step]);
    } else {
      levantarCarta(null);
    }
  }

  function updateSelection() {
    // Si el búho tenía la palabra (el recuento del final) y vuelves a tocar la
    // mesa, se calla y le devuelve el turno a Madame. Sin esto, la siguiente
    // frase de ella se escribía dentro del globo del búho.
    if (!esperandoAMadame && canal === CANAL_BUHO) callaElBuho();

    var placed = cards.filter(function (c) { return c.slot !== null; });
    var selected = placed.length;
    var revealed = selected === 3 && placed.every(function (c) { return c.flipped; });

    // Con una carta esquiva sobre la mesa, la lectura está congelada esperando
    // el relevo: no se toca el diálogo hasta que el hueco tenga carta y esté girada.
    if (espera !== null) {
      var relevo = cards.filter(function (c) { return c.slot === espera.slot; })[0];
      if (revealed && relevo && relevo.flipped) reanudarLectura();
      return;
    }

    // El enlace para compartir solo tiene sentido con la tirada completa
    botonCompartir.hidden = !revealed;

    // Si alguien va directo a tocar las cartas sin llamarla, Madame se
    // incorpora igualmente y saluda. Antes solo se cerraba la sala de espera
    // y se quedaba muda hasta completar la tirada.
    if (selected > 0) llamarAMadame();

    if (selected < 3) {
      setReadingStep(null);
      if (dialogueOverride !== null) {
        dialogueIndex = 1;
        dialogueOverride = null;
        startTyping();
      }
      return;
    }

    if (!revealed) {
      setReadingStep(null);
      setDialogueOverride("Dale la vuelta a tus cartas.");
    } else if (readingStep === null) {
      var lectura = buildReading();
      readingLines = lectura.lines;
      readingCards = lectura.deQuien;
      huecoPendiente = lectura.hueco;
      setReadingStep(0);
    }
  }

  // ---- physics lab ----
  function savePhysics() {
    try { window.localStorage.setItem("mesa-physics", JSON.stringify(physics)); } catch (e) {}
  }

  function loadPhysics() {
    try {
      var saved = window.localStorage.getItem("mesa-physics");
      if (saved) physics = Object.assign({}, PHYSICS_PRESETS.Expresiva, JSON.parse(saved));
    } catch (e) {
      try { window.localStorage.removeItem("mesa-physics"); } catch (e2) {}
    }
  }

  function buildLab() {
    Object.keys(PHYSICS_PRESETS).forEach(function (name) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = name;
      b.addEventListener("click", function () {
        physics = Object.assign({}, PHYSICS_PRESETS[name]);
        savePhysics();
        syncLabControls();
      });
      labPresets.appendChild(b);
    });

    LAB_CONTROLS.forEach(function (def) {
      var label = def[0], key = def[1], min = def[2], max = def[3], step = def[4];
      var wrap = document.createElement("label");
      wrap.className = "lab-control";
      var span = document.createElement("span");
      span.textContent = label;
      var input = document.createElement("input");
      input.type = "range";
      input.min = min; input.max = max; input.step = step;
      input.value = physics[key];
      input.dataset.key = key;
      input.dataset.step = step;
      var out = document.createElement("output");
      out.textContent = formatVal(physics[key], step);
      input.addEventListener("input", function () {
        var v = Number(input.value);
        physics[key] = v;
        out.textContent = formatVal(v, step);
        savePhysics();
      });
      wrap.appendChild(span);
      wrap.appendChild(input);
      wrap.appendChild(out);
      labControls.appendChild(wrap);
    });
  }

  function formatVal(value, step) {
    return Number(value).toFixed(step < 0.01 ? 3 : step < 1 ? 1 : 0);
  }

  function syncLabControls() {
    labControls.querySelectorAll("input").forEach(function (input) {
      var key = input.dataset.key;
      var step = Number(input.dataset.step);
      input.value = physics[key];
      input.parentElement.querySelector("output").textContent = formatVal(physics[key], step);
    });
  }

  function toggleLab(open) {
    var isOpen = typeof open === "boolean" ? open : physicsLab.hasAttribute("hidden");
    if (isOpen) {

    }
  }

  oracleAvatar.addEventListener("click", tocarLaBola);

  // El búho indica para qué sirve cada botón sin ocupar sitio en la mesa

  var resizeTimer = null;

  });

  // ---- init ----
  loadPhysics();
  buildLab();
  resetDeck();

  // El sonido arranca apagado salvo que ya lo hubieras encendido antes
  var sonidoGuardado = null;
  try { sonidoGuardado = window.localStorage.getItem("mesa-sonido"); } catch (e) {}
  aplicarSonido(sonidoGuardado === "1");

  cargarArcanosVistos();
  presumirLaPregunta();  // por si Madame habla sin que la llamen (tirada compartida)
  mostrarNotaDelBuho();  // el búho ya sabe aquí si es tu primera visita

  // Si la dirección trae una tirada compartida, se recrea sobre la mesa
  function abrirTiradaCompartida() {
    var compartida = tiradaDelEnlace();
    if (!compartida) return;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { restaurarTirada(compartida); });
    });
  }


  // ---- las piedras se mueven ----
  // Las cartas vuelan; las piedras pesan. La diferencia no es estética: las
  // piedras no se lanzan (al soltarlas se quedan donde están), siguen al dedo
  // con retraso, no giran nunca y aterrizan con un golpe seco.
  var piedras = [];
  var PASO = 2;                 // todo se mueve de dos en dos: es pixel art
  var entero = function (n) { return Math.round(n / PASO) * PASO; };

  (function prepararPiedras() {
    var mesa = table.getBoundingClientRect();
    document.querySelectorAll(".piedra").forEach(function (el) {
      var r = el.getBoundingClientRect();
      var piedra = {
        el: el,
        x: entero(r.left - mesa.left),
        y: entero(r.top - mesa.top),
        destinoX: 0, destinoY: 0,   // a dónde la lleva el dedo
        temblor: 0,                 // cuánto le queda de vibrar
        arrastrando: false,
      };
      piedra.destinoX = piedra.x; piedra.destinoY = piedra.y;
      // dejo de posicionarla con la hoja de estilos y paso a llevarla yo
      el.style.left = "0"; el.style.top = "0";
      el.style.right = "auto"; el.style.bottom = "auto";
      el.style.pointerEvents = "auto";
      el.style.cursor = "grab";
      piedras.push(piedra);
      pintarPiedra(piedra);
    });
  })();

  function pintarPiedra(p) {
    var tx = p.x, ty = p.y;
    if (p.temblor > 0) {
      // el temblor va en píxeles enteros y en direcciones alternas
      tx += (Math.random() < 0.5 ? -PASO : PASO);
      ty += (Math.random() < 0.5 ? -PASO : 0);
    }
    p.el.style.transform = "translate(" + tx + "px, " + ty + "px)";
  }

  // El cuarzo contra el tapete: tres capas. El filo es lo que de verdad se
  // oye; el cuerpo da el mineral; el peso casi no se oye pero se nota. Antes
  // esto era un golpe de 380 Hz, y en el altavoz de un portátil no llegaba
  // nada: por eso parecía que las piedras no sonaban.
  function sonarPiedra(fuerza) {
    if (!sonidoActivo || !audio()) return;
    var f = Math.max(0, Math.min(1, fuerza));
    chasquido({ dur: 0.012, techo: pizca(7400, 0.18), suelo: 2400, vol: 0.026 + f * 0.040 });
    chasquido({ dur: 0.055, techo: pizca(1250, 0.15), suelo: 340, vol: 0.030 + f * 0.055, retraso: 0.006 });
    chasquido({ dur: 0.090, techo: pizca(300, 0.20), suelo: 90,  vol: 0.020 + f * 0.040, retraso: 0.011 });
  }

  // Arrastrar una piedra sobre el tapete: un roce continuo, no un golpe. Va
  // racionado para que no se convierta en un siseo constante.
  var ultimoRoce = 0;
  function rozarPiedra() {
    if (!sonidoActivo || !audio()) return;
    var ahora = performance.now();
    if (ahora - ultimoRoce < 150) return;
    ultimoRoce = ahora;
    chasquido({ dur: 0.070, techo: pizca(2400, 0.3), suelo: 620, vol: 0.011 });
  }

  // ---- el bucle: arrastre pesado, temblor y viaje de intercambio ----
  var latidoPiedras = null;
  function moverPiedras() {
    var algoVivo = false;
    piedras.forEach(function (p) {
      if (p.viaje) {
        algoVivo = true;
        p.viaje.t += 16;
        var k = Math.min(1, p.viaje.t / p.viaje.dur);
        var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;  // arranque y frenada lentos
        p.x = entero(p.viaje.desdeX + (p.viaje.hastaX - p.viaje.desdeX) * e);
        p.y = entero(p.viaje.desdeY + (p.viaje.hastaY - p.viaje.desdeY) * e - Math.sin(e * Math.PI) * 6);
        if (k >= 1) { p.x = entero(p.viaje.hastaX); p.y = entero(p.viaje.hastaY); p.viaje = null; sonarPiedra(0.3); }
      } else if (p.arrastrando) {
        algoVivo = true;
        // no salta al dedo: se arrastra detrás. Eso es el peso.
        var antesX = p.x, antesY = p.y;
        p.x = entero(p.x + (p.destinoX - p.x) * 0.16);
        p.y = entero(p.y + (p.destinoY - p.y) * 0.16);
        // si de verdad se ha movido, roza contra el tapete
        if (Math.abs(p.x - antesX) + Math.abs(p.y - antesY) >= PASO) rozarPiedra();
      }
      if (p.temblor > 0) { p.temblor -= 16; algoVivo = true; }
      pintarPiedra(p);
    });
    latidoPiedras = algoVivo ? requestAnimationFrame(moverPiedras) : null;
  }
  function despertarPiedras() { if (latidoPiedras === null) latidoPiedras = requestAnimationFrame(moverPiedras); }

  // ---- arrastre ----
  piedras.forEach(function (p) {
    p.el.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      var mesa = table.getBoundingClientRect();
      p.arrastrando = true;
      p.agarreX = (ev.clientX - mesa.left) - p.x;
      p.agarreY = (ev.clientY - mesa.top) - p.y;
      p.el.style.cursor = "grabbing";
      try { p.el.setPointerCapture(ev.pointerId); } catch (e) {}
      sonarPiedra(0.15);
      despertarPiedras();
    });
    p.el.addEventListener("pointermove", function (ev) {
      if (!p.arrastrando) return;
      var mesa = table.getBoundingClientRect();
      var maxX = mesa.width - p.el.offsetWidth, maxY = mesa.height - p.el.offsetHeight;
      p.destinoX = Math.min(Math.max(0, (ev.clientX - mesa.left) - p.agarreX), maxX);
      p.destinoY = Math.min(Math.max(0, (ev.clientY - mesa.top) - p.agarreY), maxY);
      despertarPiedras();
    });
    function soltar() {
      if (!p.arrastrando) return;
      // Al soltar NO sale despedida: se queda donde está. Una piedra no vuela.
      p.arrastrando = false;
      p.destinoX = p.x; p.destinoY = p.y;
      p.el.style.cursor = "grab";
      sonarPiedra(0.5);
      p.temblor = 90;              // un temblorcito de asentarse
      despertarPiedras();
    }
    p.el.addEventListener("pointerup", soltar);
    p.el.addEventListener("pointercancel", soltar);
  });

  // ---- las dos cosas que hacen solas ----
  function vibrarPiedras(ms) {
    piedras.forEach(function (p, i) { p.temblor = (ms || 700) + i * 40; });
    if (sonidoActivo) piedras.forEach(function (p, i) { setTimeout(function () { sonarPiedra(0.12); }, i * 70); });
    despertarPiedras();
  }

  function intercambiarPiedras() {
    var libres = piedras.filter(function (p) { return !p.viaje && !p.arrastrando; });
    if (libres.length < 2) return;
    // dos al azar se cambian el sitio, despacio y sin prisa
    var a = libres[Math.floor(Math.random() * libres.length)];
    var b = libres[Math.floor(Math.random() * libres.length)];
    var vueltas = 0;
    while (b === a && vueltas++ < 20) b = libres[Math.floor(Math.random() * libres.length)];
    if (b === a) return;
    [[a, b], [b, a]].forEach(function (par) {
      par[0].viaje = { t: 0, dur: 1100, desdeX: par[0].x, desdeY: par[0].y, hastaX: par[1].x, hastaY: par[1].y };
    });
    despertarPiedras();
  }

  // ---- botones de prueba (temporales) ----
  var pruebas = document.querySelector(".pruebas-piedras");
  if (pruebas) {
    pruebas.querySelector('[data-piedras="vibrar"]').addEventListener("click", function () { vibrarPiedras(900); });
    pruebas.querySelector('[data-piedras="intercambiar"]').addEventListener("click", intercambiarPiedras);
    // botón de prueba: para ver las dos posturas sin tener que jugar una tirada
    pruebas.querySelector('[data-manos="alternar"]').addEventListener("click", function () {
      manosDentro(!manosEl.classList.contains("manos-dentro"));
    });
  }

  // al cambiar el tamaño de la mesa, las piedras se quedarían fuera de sitio
  window.addEventListener("resize", function () {
    var mesa = table.getBoundingClientRect();
    piedras.forEach(function (p) {
      p.x = Math.min(p.x, Math.max(0, mesa.width - p.el.offsetWidth));
      p.y = Math.min(p.y, Math.max(0, mesa.height - p.el.offsetHeight));
      p.destinoX = p.x; p.destinoY = p.y;
      pintarPiedra(p);
    });
  });


  // ---- las manos: fuera mientras habla, dentro mientras se juega ----
  // Al principio Madame apoya las manos enteras sobre la mesa. En cuanto se
  // toca el mazo las retira hacia su lado y solo deja los dedos asomando, para
  // que las cartas tengan sitio.
  var manosEl = document.querySelector(".manos");
  function manosDentro(dentro) {
    if (!manosEl) return;
    var quiero = dentro !== false;
    // Solo suena cuando de verdad se mueven: manosDentro(true) se llama cada
    // vez que coges una carta, y sin este freno sonaría en cada clic.
    if (manosEl.classList.contains("manos-dentro") === quiero) return;
    manosEl.classList.toggle("manos-dentro", quiero);
    sonar(quiero ? "manos-dentro" : "manos-fuera");
  }

  // ---- las manos de Madame ----
  // La animación es la que hizo Mery: recorte por dedos, sin una sola rotación
  // y con los desplazamientos en píxeles pares. Aquí solo cambia el destino:
  // se dibuja en un lienzo oculto y cada ventana copia su mitad.
  (function manosDeMadame() {
    var huecoIzq = document.querySelector(".mano-hueco-izq .mano-lienzo");
    var huecoDer = document.querySelector(".mano-hueco-der .mano-lienzo");
    if (!huecoIzq || !huecoDer) return;
    var ctxIzq = huecoIzq.getContext("2d");
    var ctxDer = huecoDer.getContext("2d");
    ctxIzq.imageSmoothingEnabled = false;
    ctxDer.imageSmoothingEnabled = false;

    var escena = document.createElement("canvas");
    escena.width = 670; escena.height = 588;
    var ctx = escena.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    var dedos = [
      { x: 71, y: 95, w: 58, h: 172 },
      { x: 122, y: 27, w: 53, h: 241 },
      { x: 165, y: 17, w: 61, h: 250 },
      { x: 220, y: 36, w: 56, h: 235 },
      { x: 388, y: 35, w: 60, h: 235, mask: [[390,35],[426,35],[435,65],[435,122],[448,145],[448,246],[390,246],[388,210],[388,148],[395,120]] },
      { x: 432, y: 17, w: 61, h: 250, mask: [[444,17],[489,17],[491,246],[444,246],[444,177],[440,160],[440,118],[446,104]] },
      { x: 481, y: 34, w: 58, h: 237 },
      { x: 535, y: 95, w: 61, h: 174 }
    ];
    var pulgar = { x: 257, y: 162, w: 61, h: 147, depth: .10, mask: [[269,162],[315,162],[318,300],[268,300],[265,265],[265,205]] };

    var limpio = null, sombra = null, arranque = performance.now();
    function par(n) { return Math.round(n / 2) * 2; }
    function suave(v) { return v * v * (3 - 2 * v); }
    // A diez imágenes por segundo, como los juegos de los ochenta
    function tiempo(ms) { return Math.floor(ms / 100) * 100; }

    function pulso(t, retraso, ciclo, sube, aguanta, baja) {
      var l = ((t - retraso) % ciclo + ciclo) % ciclo;
      if (l < sube) return suave(l / sube);
      if (l < sube + aguanta) return 1;

<script>
(() => {
  const root = document.getElementById('tarot-crystal-orb');
  const canvas = root.querySelector('.galaxy-canvas');
  const orb = root.querySelector('.orb');
  const edgeCanvas = root.querySelector('.edge-canvas');
  const edgeCtx = edgeCanvas.getContext('2d');
  const ctx = canvas.getContext('2d', { alpha: true });
  const size = canvas.width;
  const center = size / 2;
  const stars = [];
  const palette = ['#fff2ff', '#d6c2ff', '#93dcff', '#ff9fd7', '#b88cff'];

  let seed = 84921;
  function random() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  for (let i = 0; i < 230; i += 1) {
    const arm = i % 4;
    const radius = 7 + Math.pow(random(), .68) * 57;
    const spread = (random() - .5) * (.28 + radius * .03);
    stars.push({
      radius,
      angle: arm * Math.PI / 2 + radius * .105 + spread,
      speed: .000045 + (58 - radius) * .0000008,
      size: random() > .9 ? 2 : 1,
      color: palette[Math.floor(random() * palette.length)],
      pulse: random() * Math.PI * 2
    });
  }

  let lastNow = performance.now();
  let rotationTime = 0;
  let speedFactor = 1;
  let targetSpeed = 1;

  function drawPixelCircle(context, cx, cy, radius) {
    let x = radius;
    let y = 0;
    let error = 1 - x;
    let step = 0;
    const plot = (px, py) => {
      context.fillStyle = step++ % 5 === 0 ? '#8a6a9a' : '#70517f';
      context.fillRect(px, py, 1, 1);
    };
    while (x >= y) {
      plot(cx + x, cy + y); plot(cx + y, cy + x);
      plot(cx - y, cy + x); plot(cx - x, cy + y);
      plot(cx - x, cy - y); plot(cx - y, cy - x);
      plot(cx + y, cy - x); plot(cx + x, cy - y);
      y += 1;
      if (error < 0) error += 2 * y + 1;
      else { x -= 1; error += 2 * (y - x) + 1; }
    }
  }

  drawPixelCircle(edgeCtx, 72, 72, 70);

  orb.addEventListener('pointerenter', () => {
    targetSpeed = 3.4;
    orb.classList.add('is-hovered');
  });
  orb.addEventListener('pointerleave', () => {
    targetSpeed = 1;
    orb.classList.remove('is-hovered');
  });

  function draw(now) {
    const delta = Math.min(40, now - lastNow);
    lastNow = now;
    speedFactor += (targetSpeed - speedFactor) * .08;
    rotationTime += delta * speedFactor;
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = '#180f32';
    ctx.fillRect(0, 0, size, size);

    const core = ctx.createRadialGradient(center, center, 1, center, center, 24);
    core.addColorStop(0, '#fff6e5');
    core.addColorStop(.13, '#f3b6ff');
    core.addColorStop(.42, '#8154c7');
    core.addColorStop(1, 'rgba(31,14,67,0)');
    ctx.fillStyle = core;
    ctx.fillRect(34, 34, 76, 76);

    stars.forEach((star, index) => {
      const angle = star.angle + rotationTime * star.speed;
      const squash = .58 + .1 * Math.sin(star.radius * .12);
      const x = Math.round(center + Math.cos(angle) * star.radius);
      const y = Math.round(center + Math.sin(angle) * star.radius * squash);
      const twinkle = Math.sin(now * .003 + star.pulse) > .72;
      ctx.globalAlpha = .48 + (twinkle ? .5 : 0);
      ctx.fillStyle = star.color;
      const px = twinkle && index % 5 === 0 ? star.size + 1 : star.size;
      ctx.fillRect(x, y, px, px);
    });
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#0b0719';
    ctx.beginPath();
    ctx.arc(center, center, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#b895ff';
    ctx.fillRect(center - 1, center - 1, 2, 2);

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
