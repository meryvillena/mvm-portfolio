<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mesa de lectura — Prototipo</title>
<meta name="description" content="Prototipo de interacción para explorar el gesto físico de manipular una baraja." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AE%3C/text%3E%3C/svg%3E" />
<style>
  /* La mesa es de noche. Los colores salen de la paleta del propio tapete:
     lo que antes era tinta ahora es luz, y el papel es violeta oscuro. */
  :root {
    --ink: #3d2a5c;
    --ink-rgb: 61, 42, 92;
    --paper: #efe6f7;
    --paper-rgb: 239, 230, 247;
    --table: #c6b6de;
    /* La cara de la carta: morado claro, no blanco. Va un punto por encima del
       tapete para que la carta se despegue de la mesa sin encenderse. */
    --carta-cara: #ded1f0;
    --brillo-rgb: 255, 255, 255;
    --line: rgba(var(--ink-rgb), 0.26);
    /* La carta creció (era 112 × 174) para que su microfrase pudiera llegar a
       un cuerpo legible. La proporción, 0,64, es la de una carta de tarot y no
       se toca: si cambia, la carta deja de parecer una carta. */
    --card-w: 128px;
    --card-h: 199px;
    /* El cuerpo de letra de la cara va atado al tamaño de la carta: si la carta
       encoge, el texto encoge con ella y sigue cabiendo. */
    --carta-texto: 12px;
    --carta-simbolo: 46px;
    --font-mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    background: #cdbfe0;
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; }

  .prototype {
    width: 100vw;
    height: 100dvh;
    min-height: 620px;
    padding: 14px;
  }

  .table {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border: 1px solid rgba(var(--ink-rgb), 0.23);
    border-radius: 5px;
    /* Superficie lisa. El tapete dibujado entrará aquí cuando esté. */
    background:
      radial-gradient(circle at 50% 34%, rgba(var(--brillo-rgb), .28), transparent 46%),
      repeating-linear-gradient(105deg, rgba(var(--brillo-rgb), .05) 0, rgba(var(--brillo-rgb), .05) 1px, rgba(var(--ink-rgb), .022) 2px, rgba(var(--ink-rgb), .022) 4px),
      var(--table);
    box-shadow: inset 0 0 100px rgba(var(--ink-rgb), .12);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .topbar {
    position: absolute;
    z-index: 1000;
    top: 26px;
    right: 30px;
    left: 30px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    pointer-events: none;
  }

  .eyebrow {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  h1 {
    margin: 4px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(23px, 2.4vw, 37px);
    font-weight: 400;
    letter-spacing: -.04em;
  }

  .status {
    display: flex;
    gap: 12px;
    align-items: center;
    pointer-events: auto;
  }

  .table-actions { display: flex; gap: 7px; }

  .status .count {
    font-family: var(--font-mono);
    font-size: 12px;
  }

  .status button {
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--ink);
    border-radius: 100px;
    color: var(--ink);
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    transition: color 160ms ease, background 160ms ease;
  }

  .status button:hover, .status button:focus-visible {
    color: var(--paper);
    background: var(--ink);
    outline: none;
  }

  .oracle-dialogue {
    position: absolute;
    z-index: 1400;
    bottom: 28px;
    left: 30px;
    display: flex;
    max-width: min(520px, calc(100% - 260px));
    align-items: flex-end;
    gap: 12px;
    pointer-events: none;
    animation: oracle-enter 340ms steps(5, end) both;
  }

  /* El 🔮 es lo único clicable del oráculo: sirve para adelantar la frase.
     El resto sigue sin recibir clics para no estorbar al arrastrar cartas. */
  .oracle-avatar {
    display: grid;
    flex: 0 0 42px;
    width: 42px;
    height: 42px;
    place-items: center;
    border: 1px solid rgba(var(--ink-rgb), .74);
    background: rgba(var(--paper-rgb), .8);
    box-shadow: 3px 3px 0 rgba(var(--ink-rgb), .18);
    padding: 0;
    font-size: 23px;
    filter: grayscale(.18);
    cursor: pointer;
    pointer-events: auto;
    appearance: none;
    transition: filter 160ms ease, transform 160ms ease;
  }

  .oracle-avatar:hover,
  .oracle-avatar:focus-visible {
    filter: grayscale(0);
    transform: translateY(-1px);
  }

  .speech-bubble {
    position: relative;
    min-height: 42px;
    padding: 12px 26px 12px 15px;
    border: 1px solid rgba(var(--ink-rgb), .76);
    background: rgba(var(--paper-rgb), .92);
    box-shadow: 4px 4px 0 rgba(var(--ink-rgb), .16);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.55;
    letter-spacing: .035em;
  }

  .speech-bubble::before {
    position: absolute;
    bottom: 10px;
    left: -7px;
    width: 12px;
    height: 12px;
    border-bottom: 1px solid rgba(var(--ink-rgb), .76);
    border-left: 1px solid rgba(var(--ink-rgb), .76);
    background: rgba(var(--paper-rgb), .98);
    content: "";
    transform: rotate(45deg);
  }

  /* Cuando el oráculo ha terminado la frase y espera a que hagas clic:
     la burbuja se vuelve pulsable y aparece una flecha que late */
  .oracle-esperando .speech-bubble,
  .oracle-esperando .buho-dialogo-globo {
    cursor: pointer;
    pointer-events: auto;
  }

  .oracle-esperando .buho-cursor { display: none; }

  .oracle-esperando .buho-dialogo-globo::after {
    position: absolute;
    right: 10px;
    bottom: 6px;
    font-size: 12px;
    line-height: 1;
    content: "▸";
    animation: continuar-late 1300ms ease-in-out infinite;
  }

  /* El búho tiene su propio rincón, arriba a la derecha, con el mismo sistema
     que Madame pero en talla pequeña y mirando hacia el otro lado. */
  .buho-dialogo {
    position: absolute;
    z-index: 1300;
    top: 84px;
    right: 30px;
    display: flex;
    max-width: min(330px, calc(100% - 90px));
    align-items: flex-end;
    gap: 10px;
    animation: oracle-enter 340ms steps(5, end) both;
    pointer-events: none;
  }

  /* El aviso del búho es una frase larga: tiene que poder partirse en varias
     líneas o en móvil se corta a media palabra */
  .buho-dialogo-globo { white-space: normal; }

  /* El display:flex de arriba ganaría al atributo hidden si no se dice esto */
  .buho-dialogo[hidden] { display: none; }

  .buho-dialogo-avatar {
    display: grid;
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    place-items: center;
    border: 1px solid rgba(var(--ink-rgb), .74);
    background: rgba(var(--paper-rgb), .8);
    box-shadow: 3px 3px 0 rgba(var(--ink-rgb), .18);
    font-size: 16px;
    line-height: 1;
    filter: grayscale(.18);
  }

  .buho-dialogo-globo {
    position: relative;
    padding: 9px 12px;
    border: 1px solid rgba(var(--ink-rgb), .76);
    background: rgba(var(--paper-rgb), .92);
    box-shadow: 3px 3px 0 rgba(var(--ink-rgb), .14);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: .03em;
  }

  /* El pico apunta hacia el búho, que aquí está a la derecha */
  .buho-dialogo-globo::before {
    position: absolute;
    right: -6px;
    bottom: 8px;
    width: 10px;
    height: 10px;
    border-top: 1px solid rgba(var(--ink-rgb), .76);
    border-right: 1px solid rgba(var(--ink-rgb), .76);
    background: rgba(var(--paper-rgb), .96);
    content: "";
    transform: rotate(45deg);
  }

  /* Mientras Madame no ha llegado, solo se ve su bola */
  .sin-madame .speech-bubble { display: none; }

  /* La bola late despacio para que se entienda que se puede pulsar */
  .bola-llamando { animation: bola-late 2400ms ease-in-out infinite; }

  @keyframes bola-late {
    0%, 100% { transform: translateY(0); box-shadow: 3px 3px 0 rgba(var(--ink-rgb), .18); }
    50% { transform: translateY(-2px); box-shadow: 3px 5px 0 rgba(var(--ink-rgb), .14); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bola-llamando { animation: none; }
  }

  /* El búho no habla en la burbuja: es señalética. Aparece en las etiquetas
     pequeñas que indican qué hace cada cosa. */
  .buho-label {
    position: absolute;
    z-index: 1500;
    display: flex;
    align-items: flex-end;
    gap: 7px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 4px);
    transition: opacity 150ms ease, transform 150ms ease;
  }

  .buho-label-visible { opacity: 1; transform: translate(-50%, 0); }

  /* El búho en su recuadro, como el avatar de Madame pero a escala de cartel */
  .buho-icono {
    display: grid;
    flex: 0 0 22px;
    width: 22px;
    height: 22px;
    place-items: center;
    border: 1px solid rgba(var(--ink-rgb), .74);
    background: rgba(var(--paper-rgb), .88);
    box-shadow: 2px 2px 0 rgba(var(--ink-rgb), .18);
    font-size: 12px;
    line-height: 1;
    filter: grayscale(.18);
  }

  .buho-globo {
    position: relative;
    padding: 6px 9px;
    border: 1px solid rgba(var(--ink-rgb), .74);
    background: rgba(var(--paper-rgb), .96);
    box-shadow: 3px 3px 0 rgba(var(--ink-rgb), .16);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .09em;
    line-height: 1.3;
    text-transform: uppercase;
  }

  /* El pico del globo, igual que el de la burbuja grande */
  .buho-globo::before {
    position: absolute;
    bottom: 6px;
    left: -5px;
    width: 8px;
    height: 8px;
    border-bottom: 1px solid rgba(var(--ink-rgb), .74);
    border-left: 1px solid rgba(var(--ink-rgb), .74);
    background: rgba(var(--paper-rgb), .98);
    content: "";
    transform: rotate(45deg);
  }

  @media (prefers-reduced-motion: reduce) {
    .buho-label { transition: none; }
  }

  .oracle-esperando .typing-cursor { display: none; }

  .oracle-esperando .speech-bubble::after {
    position: absolute;
    right: 11px;
    bottom: 8px;
    font-size: 13px;
    line-height: 1;
    content: "▸";
    animation: continuar-late 1300ms ease-in-out infinite;
  }

  @keyframes continuar-late {
    0%, 100% { opacity: .3; transform: translateX(0); }
    50% { opacity: 1; transform: translateX(3px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .oracle-esperando .speech-bubble::after { animation: none; opacity: .8; }
  }

  /* El nombre de la carta y su microfrase, cuando el oráculo la presenta */
  .speech-bubble strong {
    font-weight: 700;
    letter-spacing: .07em;
  }

  .speech-bubble em {
    font-style: italic;
    opacity: .78;
  }

  .typing-cursor {
    display: inline-block;
    width: 7px;
    height: 12px;
    margin-left: 3px;
    background: currentColor;
    vertical-align: -2px;
    animation: cursor-blink 660ms steps(1, end) infinite;
  }

  .typing-cursor-idle { animation-duration: 980ms; }

  @keyframes cursor-blink {
    0%, 47% { opacity: 1; }
    48%, 100% { opacity: 0; }
  }

  @keyframes oracle-enter {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slots {
    position: absolute;
    z-index: 2;
    top: 48%;
    left: 57%;
    display: flex;
    gap: clamp(22px, 4vw, 66px);
    transform: translate(-50%, -50%);
  }

  .slot {
    position: relative;
    /* Nunca se encoge: la casilla tiene que medir lo mismo que la carta. Sin
       esto, cuando la fila no cabía, las tres casillas se estrechaban y la
       carta sobresalía de su hueco. */
    flex: 0 0 auto;
    width: var(--card-w);
    height: var(--card-h);
    border: 1px solid rgba(var(--ink-rgb), .32);
    border-radius: 7px;
    background: rgba(var(--brillo-rgb), .025);
    transition: background 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  }

  .slot::before, .slot::after {
    position: absolute;
    content: "";
    background: var(--line);
  }

  .slot::before { top: 50%; left: 20%; width: 60%; height: 1px; }
  .slot::after { top: 30%; left: 50%; width: 1px; height: 40%; }

  .slot span {
    position: absolute;
    right: 0;
    bottom: -24px;
    left: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .13em;
    text-align: center;
    text-transform: uppercase;
  }

  .slot-active {
    transform: scale(1.035);
    background: rgba(249,246,236,.42);
    box-shadow: 0 0 0 7px rgba(249,246,236,.17);
  }

  /* La casilla que se ha quedado vacía porque una carta se negó a ser leída:
     late despacio hasta que pones otra, para que se entienda que es a propósito */
  .slot-esperando {
    background: rgba(249,246,236,.46);
    animation: slot-espera 1800ms ease-in-out infinite;
  }

  @keyframes slot-espera {
    0%, 100% { box-shadow: 0 0 0 3px rgba(249,246,236,.14); }
    50% { box-shadow: 0 0 0 11px rgba(249,246,236,.32); }
  }

  @media (prefers-reduced-motion: reduce) {
    .slot-esperando { animation: none; box-shadow: 0 0 0 7px rgba(249,246,236,.24); }
  }

  .deck-label {
    position: absolute;
    z-index: 1;
    /* Colgada del mazo: media carta a la izquierda y media carta hacia abajo,
       calculado con las medidas de la carta para que siga al mazo si cambian. */
    top: calc(50% + var(--card-h) / 2 + 20px);
    left: calc(14% - var(--card-w) / 2);
    display: flex;
    width: var(--card-w);
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding-top: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .deck-label small { opacity: .55; font-size: inherit; }

  .card {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--card-w);
    height: var(--card-h);
    padding: 0;
    border: 0;
    border-radius: 7px;
    color: var(--ink);
    background: transparent;
    box-shadow: 0 3px 8px rgba(28,30,28,.22);
    cursor: grab;
    touch-action: none;
    perspective: 900px;
    will-change: transform;
    transition: box-shadow 140ms ease, filter 140ms ease;
  }

  .card:hover {
    filter: brightness(1.035);
    box-shadow: 0 9px 18px rgba(28,30,28,.22);
  }

  .card:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  .card-dragging {
    cursor: grabbing;
    box-shadow: 0 22px 42px rgba(28,30,28,.32);
    filter: brightness(1.05);
  }

  .card-arranging {
    transition:
      transform 820ms cubic-bezier(.18,.72,.2,1),
      box-shadow 140ms ease,
      filter 140ms ease;
  }

  .card-arranging.card-dragging { transition: none; }

  .card-inner {
    position: absolute;
    inset: 0;
    display: block;
    transform-style: preserve-3d;
    transition: transform 480ms cubic-bezier(.2,.76,.24,1);
  }

  .card-flipped .card-inner { transform: rotateY(180deg); }

  /* La carta de la que habla Madame se levanta de la mesa. El aumento es
     exactamente el doble, nunca un número roto: con pixel art, multiplicar por
     un entero convierte cada píxel en cuatro cuadrados limpios; con 1,8 los
     píxeles se parten y el dibujo tiembla. */
  .card-leyendo .card-inner { transform: scale(2); }
  .card-leyendo.card-flipped .card-inner { transform: rotateY(180deg) scale(2); }

  /* Mientras está en alto no la tapa nada salvo las manos de Madame (900) */
  .card-leyendo {
    z-index: 860 !important;
    filter: drop-shadow(0 18px 22px rgba(var(--ink-rgb), .28));
  }

  @media (prefers-reduced-motion: reduce) {
    .card-leyendo .card-inner,
    .card-leyendo.card-flipped .card-inner { transition: none; }
  }

  .card-side {
    position: absolute;
    inset: 0;
    display: grid;
    overflow: hidden;
    place-items: center;
    border: 1px solid rgba(var(--ink-rgb), .30);
    border-radius: 7px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .card-side::before {
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(37,39,37,.39);
    border-radius: 3px;
    content: "";
  }

  /* Las dos caras son opuestas a propósito: el reverso, el secreto, va en el
     morado oscuro; el anverso, la revelación, en morado claro con la línea y
     la letra en oscuro. Girar una carta pasa de oscuro a claro, y por eso se
     nota. */
  .card-back {
    color: #cbb8e6;
    border-color: rgba(var(--ink-rgb), .75);
    background:
      linear-gradient(rgba(var(--brillo-rgb), .07), rgba(0,0,0,.10)),
      repeating-linear-gradient(45deg, transparent 0, transparent 7px, rgba(var(--brillo-rgb),.05) 8px),
      var(--ink);
  }

  .card-front {
    transform: rotateY(180deg);
    color: var(--ink);
    border-color: rgba(var(--ink-rgb), .38);
    background:
      radial-gradient(circle at 50% 42%, rgba(var(--brillo-rgb), .22), transparent 34%),
      var(--carta-cara);
  }

  /* PRUEBA (12 ago): las dos primeras cartas ilustradas de verdad, en su
     rejilla de 128 × 200 píxeles. Las diez restantes siguen siendo
     tipográficas. Las imágenes van por ruta relativa mientras se decide; al
     cerrar el diseño se incrustan en base64 como el resto. */
  /* El dibujo trae la ilustración y el marco, pero NO el texto: el nombre y la
     microfrase los escribe la pieza encima. Dibujados dentro de la imagen se
     destruían al reducir la carta a su rejilla, y ampliarla después solo
     agrandaba el borrón. Como texto de verdad se leen a cualquier tamaño. */
  .card-front-ilustrada {
    display: block;
    transform: rotateY(180deg);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }
  .card-front-ilustrada::before { display: none; }

  /* El nombre y la microfrase viven en la banda que el dibujo deja libre
     abajo. Se reparten esa banda: el nombre arriba, la frase debajo. */
  .face-pie {
    position: absolute;
    right: 7%;
    bottom: 3%;
    left: 7%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    height: 36%;
    text-align: center;
  }
  /* El numeral también lo pone la pieza: dentro de la imagen cada carta lo
     traía a un tamaño distinto (medidos: de 13 a 21 px). Así las doce lo
     llevan idéntico y en el mismo sitio. */
  .face-numeral-ilustrado {
    position: absolute;
    top: 5%;
    right: 0;
    left: 0;
    text-align: center;
  }

  .face-pie .face-nombre { min-height: 0; line-height: 1.15; }
  /* La frase, un punto por debajo del nombre: es la voz baja de la carta */
  .face-pie .face-frase {
    min-height: 0;
    font-size: calc(var(--carta-texto) - 1px);
    line-height: 1.2;
  }
  .carta-01 { background-image: url("_ilustraciones/carta-01-deadline.png"); }
  .carta-03 { background-image: url("_ilustraciones/carta-03-cliente-que-ya-lo-tenia-claro.png"); }
  .carta-04 { background-image: url("_ilustraciones/carta-04-referencia-inalcanzable.png"); }
  .carta-05 { background-image: url("_ilustraciones/carta-05-cambio-pequenito.png"); }
  .carta-06 { background-image: url("_ilustraciones/carta-06-reunion-que-podia-ser-correo.png"); }
  .carta-08 { background-image: url("_ilustraciones/carta-08-idea-de-madrugada.png"); }
  .carta-09 { background-image: url("_ilustraciones/carta-09-version-final-final.png"); }
  .carta-10 { background-image: url("_ilustraciones/carta-10-archivo-perdido.png"); }
  .carta-11 { background-image: url("_ilustraciones/carta-11-opinion-de-ultima-hora.png"); }
  .carta-12 { background-image: url("_ilustraciones/carta-12-sindrome-de-la-impostora.png"); }
  .carta-07 { background-image: url("_ilustraciones/carta-07-presupuesto-fantasma.png"); }
  .carta-02 { background-image: url("_ilustraciones/carta-02-musa-en-huelga.png"); }

  /* El marco interior se tiñe con la tinta de su cara: claro sobre el reverso
     oscuro, oscuro sobre el anverso claro. */
  .card-back::before { border-color: rgba(203, 184, 230, .34); }
  .card-front::before { border-color: rgba(var(--ink-rgb), .34); }

  /* Cara tipográfica de las cartas piloto (maqueta sin ilustración):
     numeral arriba, símbolo protagonista, nombre en mayúsculas, microfrase discreta */
  .card-front-arcano {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 15px 11px 12px;
    text-align: center;
  }

  .face-numeral {
    font-family: Georgia, serif;
    font-size: 12px;
    letter-spacing: .2em;
  }

  /* El símbolo mengua con la carta: en el móvil, a su tamaño de escritorio se
     comía la línea que necesita la microfrase más larga. */
  .face-simbolo {
    display: grid;
    flex: 0 0 var(--carta-simbolo);
    width: var(--carta-simbolo);
    height: var(--carta-simbolo);
    place-items: center;
    line-height: 1;
    opacity: .82;
  }

  .face-simbolo svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.35;
    vector-effect: non-scaling-stroke;
  }

  .face-nombre {
    display: grid;
    min-height: 29px;
    place-items: center;
    font-family: var(--font-mono);
    font-size: var(--carta-texto);
    letter-spacing: .09em;
    line-height: 1.3;
    text-wrap: balance;
    text-transform: uppercase;
  }

  .face-nombre-largo {
    font-size: calc(var(--carta-texto) - 2px);
    letter-spacing: .055em;
    line-height: 1.25;
  }

  .face-frase {
    display: grid;
    min-height: 27px;
    place-items: center;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: var(--carta-texto);
    line-height: 1.35;
    opacity: .72;
    text-wrap: balance;
  }

  .card-placed {
    animation: card-confirm 360ms cubic-bezier(.2,.7,.2,1);
    box-shadow: 0 5px 12px rgba(28,30,28,.18);
  }

  @keyframes card-confirm {
    0% { box-shadow: 0 5px 12px rgba(28,30,28,.18); }
    48% { box-shadow: 0 0 0 7px rgba(249,246,236,.38), 0 9px 18px rgba(28,30,28,.2); }
    100% { box-shadow: 0 5px 12px rgba(28,30,28,.18); }
  }

  /* Aviso "haz clic" — aparece al pasar el ratón por una carta boca abajo
     y desaparece para siempre en cuanto giras tu primera carta */
  /* Los carteles del búho tienen la misma hechura que la burbuja de Madame,
     pero en pequeño: el bicho en su recuadro y el globo al lado, con su sombra */
  .card-hint {
    position: absolute;
    z-index: 1200;
    display: flex;
    align-items: flex-end;
    gap: 7px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, 4px);
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .card-hint-visible { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .card-hint { transition: none; }
  }

  .card-mark { font-family: Georgia, serif; font-size: 26px; opacity: .65; }

  .card-number, .face-index {
    position: absolute;
    right: 13px;
    bottom: 11px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
  }

  .face-index { top: 12px; right: auto; bottom: auto; left: 13px; }

  .face-orbit {
    position: relative;
    display: grid;
    width: 58px;
    height: 58px;
    place-items: center;
    border: 1px solid rgba(var(--ink-rgb), .48);
    border-radius: 50%;
  }

  .face-orbit::before, .face-orbit::after {
    position: absolute;
    content: "";
    border: 1px solid rgba(var(--ink-rgb), .24);
    border-radius: 50%;
  }

  .face-orbit::before { inset: -11px 8px; }
  .face-orbit::after { inset: 8px -11px; }
  .face-sun { font-size: 18px; }

  .face-name {
    position: absolute;
    right: 0;
    bottom: 11px;
    left: 0;
    font-family: Georgia, serif;
    font-size: 12px;
    font-style: italic;
    letter-spacing: .08em;
    text-align: center;
  }

  .phase-note {
    position: absolute;
    z-index: 1000;
    right: 30px;
    bottom: 25px;
    display: flex;
    gap: 13px;
    align-items: center;
    /* Si la fila no cabe (pantalla estrecha, o con los botones de prueba
       puestos), baja de línea en vez de salirse de la mesa. */
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  /* «Fase 0» y «Validando el gesto antes que la imagen» eran andamio de taller:
     fuera. El sitio que dejaron lo ocupan los botones de prueba. */

  /* El enlace para compartir la tirada */
  .compartir {
    padding: 5px 11px;
    border: 1px solid rgba(var(--ink-rgb), .5);
    border-radius: 999px;
    color: var(--ink);
    background: transparent;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    transition: background 160ms ease, border-color 160ms ease;
  }

  .compartir:hover { border-color: var(--ink); background: rgba(249,246,236,.5); }

  .sound-trigger svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.9;
  }

  .boton-redondo {
    display: grid;
    width: 29px;
    height: 29px;
    place-items: center;
    border: 1px solid rgba(var(--ink-rgb), .72);
    border-radius: 50%;
    color: var(--ink);
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    transition: color 160ms ease, background 160ms ease, transform 240ms ease;
  }

  .boton-redondo:hover,
  .boton-redondo:focus-visible,
  .lab-trigger-active {
    color: var(--paper);
    background: var(--ink);
    outline: none;
    transform: rotate(38deg);
  }

  .physics-lab {
    position: absolute;
    z-index: 3000;
    top: 78px;
    right: 28px;
    width: min(390px, calc(100% - 32px));
    padding: 18px;
    border: 1px solid rgba(var(--ink-rgb), .82);
    background: rgba(226,223,213,.97);
    box-shadow: 8px 8px 0 rgba(var(--ink-rgb), .18);
    animation: lab-enter 180ms steps(4, end) both;
  }

  .physics-lab[hidden] { display: none; }

  .physics-lab .lab-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    border-bottom: 1px solid rgba(var(--ink-rgb), .25);
    padding-bottom: 13px;
  }

  .physics-lab small,
  .physics-lab h2,
  .lab-hint,
  .lab-control {
    font-family: var(--font-mono);
  }

  .physics-lab small {
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .physics-lab h2 {
    margin: 4px 0 0;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -.02em;
  }

  .physics-lab .lab-close {
    display: grid;
    width: 28px;
    height: 28px;
    place-items: center;
    border: 1px solid rgba(var(--ink-rgb), .7);
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
  }

  .lab-presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    margin: 14px 0 18px;
  }

  .lab-presets button {
    padding: 7px 3px;
    border: 1px solid rgba(var(--ink-rgb), .48);
    background: transparent;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
  }

  .lab-presets button:hover,
  .lab-presets button:focus-visible,
  .physics-lab .lab-close:hover,
  .physics-lab .lab-close:focus-visible {
    color: var(--paper);
    background: var(--ink);
    outline: none;
  }

  .lab-controls { display: grid; gap: 12px; }

  .lab-control {
    display: grid;
    grid-template-columns: 93px 1fr 42px;
    gap: 9px;
    align-items: center;
    font-size: 11px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .lab-control input {
    width: 100%;
    accent-color: var(--ink);
  }

  .lab-control output {
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .lab-hint {
    margin: 16px 0 0;
    border-top: 1px solid rgba(var(--ink-rgb), .25);
    padding-top: 11px;
    opacity: .55;
    font-size: 10px;
    letter-spacing: .04em;
  }

  @keyframes lab-enter {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 760px) {
    /* En el móvil tres cartas de 128 no caben en fila: suman más que el ancho
       de la pantalla. La carta baja a 104 conservando la proporción. */
    :root { --card-w: 104px; --card-h: 162px; --carta-texto: 10px; --carta-simbolo: 38px; }
    .card-front-arcano { padding: 11px 8px 9px; }
    .prototype { min-height: 560px; padding: 7px; }
    .topbar { top: 20px; right: 18px; left: 18px; }
    .eyebrow, .status .count, .deck-label { display: none; }
    .table-actions { gap: 4px; }
    .status button { height: 31px; padding: 0 9px; font-size: 11px; }
    .oracle-dialogue { right: 14px; bottom: 64px; left: 14px; max-width: none; }
    .buho-dialogo { top: 72px; right: 14px; max-width: calc(100% - 28px); }
    .buho-dialogo-avatar { flex-basis: 26px; width: 26px; height: 26px; font-size: 14px; }
    .buho-dialogo-globo { padding: 8px 10px; font-size: 12px; }
    .oracle-avatar { flex-basis: 36px; width: 36px; height: 36px; font-size: 19px; }
    .speech-bubble { padding: 9px 11px; font-size: 13px; }
    .slots { top: 34%; left: 50%; width: auto; justify-content: center; gap: 12px; }
    .phase-note { right: 18px; bottom: 16px; left: 18px; gap: 8px; }
    .physics-lab { top: 66px; right: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }

  #tarot-crystal-orb {
    display: grid;
    place-items: center;
    min-height: 520px;
    overflow: hidden;
    background: transparent;
  }

  #tarot-crystal-orb .orb {
    position: relative;
    width: min(390px, 78vw);
    aspect-ratio: 1;
    overflow: hidden;
    isolation: isolate;
    border: 1px solid #604170;
    border-radius: 50%;
    background: #180f32;
    box-shadow:
      inset 22px 14px 0 rgba(255,255,255,.09),
      inset -28px -30px 0 rgba(22,7,49,.42),
      0 20px 0 rgba(41,22,61,.18);
    image-rendering: pixelated;
    cursor: crosshair;
    transition: filter 180ms steps(3, end);
  }

  #tarot-crystal-orb .orb:hover { filter: brightness(1.12) saturate(1.12); }

  #tarot-crystal-orb canvas,
  #tarot-crystal-orb .nebula,
  #tarot-crystal-orb .glass {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
  }

  #tarot-crystal-orb .edge-canvas {
    z-index: 5;
    pointer-events: none;
    image-rendering: pixelated;
  }

  #tarot-crystal-orb canvas {
    z-index: 1;
    image-rendering: pixelated;
  }

  #tarot-crystal-orb .nebula {
    z-index: 2;
    opacity: .72;
    mix-blend-mode: screen;
    background:
      radial-gradient(ellipse at 48% 48%, rgba(255,215,255,.36) 0 4%, transparent 15%),
      conic-gradient(from 20deg at 50% 50%, transparent, rgba(192,118,255,.25), transparent 24%, rgba(106,207,255,.2), transparent 58%, rgba(255,142,220,.25), transparent);
    animation: orb-nebula-turn 16s steps(64, end) infinite;
  }

  #tarot-crystal-orb .orb.is-hovered .nebula { animation-duration: 4.8s; }

  #tarot-crystal-orb .glass {
    z-index: 3;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 31% 23%, rgba(255,255,255,.64) 0 2%, rgba(222,236,255,.3) 3% 8%, transparent 12%),
      radial-gradient(ellipse at 35% 29%, rgba(255,255,255,.13) 0 8%, transparent 23%),
      radial-gradient(circle at 57% 63%, transparent 0 44%, rgba(198,161,255,.1) 62%, rgba(19,7,43,.38) 82%),
      linear-gradient(135deg, rgba(255,255,255,.18), transparent 28% 68%, rgba(177,110,255,.18));
    box-shadow:
      inset 12px 10px 0 rgba(255,255,255,.08),
      inset -15px -17px 0 rgba(44,15,80,.25);
  }

  @keyframes orb-nebula-turn { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    #tarot-crystal-orb .nebula { animation: none; }
  }

  /* ---- la bola, tal cual la diseñó Mery ----
     Solo se ajusta su sitio: centrada, del tamaño que pide la mesa y subida
     hasta que asoma algo más de la mitad. Cuando entren las manos, quedará
     entre ellas. */
  #tarot-crystal-orb {
    position: absolute;
    z-index: 2;
    top: 0;
    left: 50%;
    min-height: 0;
    width: min(300px, 30%);
    pointer-events: none;
    transform: translate(-50%, -47%);
  }
  /* La bola grande es un botón: cuando el búho dice «pulsa la bola», nadie
     mira el iconito de abajo, mira esta. Manda cursor de mano, no la cruz de
     inspeccionar que traía el componente. */
  #tarot-crystal-orb .orb { width: 100%; pointer-events: auto; cursor: pointer; }
  #tarot-crystal-orb .orb:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 6px;
  }


  /* ---- las piedras ----
     Pixel art generado a partir de los dibujos de Mery: silueta y color suyos,
     reconstruidos con cuatro tonos y borde duro. Viven en el perímetro para no
     estorbar a las cartas. */
  /* Las piedras van por encima de las cartas (que como mucho llegan a 800) y
     por debajo de las manos (900): están sobre el tapete, no dentro del juego.
     El contenedor no recibe el ratón; cada piedra sí, para poder arrastrarla. */
  .piedras { position: absolute; z-index: 850; inset: 0; pointer-events: none; }

  .piedra {
    position: absolute;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    image-rendering: pixelated;
    /* Dos sombras: una dura y desplazada, que es la del pixel art, y otra
       blanda y pegada al pie, que es la que apoya la piedra en el tapete.
       Al ser el PNG traslúcido, la sombra hereda esa transparencia sola. */
    filter:
      drop-shadow(4px 6px 0 rgba(var(--ink-rgb), .14))
      drop-shadow(0 4px 7px rgba(var(--ink-rgb), .30));
  }

     una a cada lado de la bola. El dibujo es uno solo: cada ventana enseña su
     mitad. */
  /* Las manos van por encima de las cartas y de las piedras: son las de Madame,
     que está al otro lado de la mesa, y las cosas de la mesa pasan por debajo
     de ellas. Por debajo del título y del pie (1000), que no son mesa sino
     rótulos. Como no reciben el ratón, tapar una carta no impide arrastrarla. */
  .manos { position: absolute; inset: 0; pointer-events: none; z-index: 900; }

  /* Las ventanas no llevan alto ni recorte propios: si se los pones, las yemas
     se quedan cortadas por abajo. Quien recorta es la mesa, que ya esconde todo
     lo que se sale por arriba. */
  .mano-hueco {
    position: absolute;
    top: 0;
  }
  .mano-hueco-izq { right: 56%; width: 24%; }
  .mano-hueco-der { left: 56%; width: 24%; }

  /* El dibujo se sube: las muñecas quedan fuera de pantalla y solo entran las
     manos, como si Madame las apoyara desde el otro lado de la mesa. El margen
     va en porcentaje del ancho, que es la misma medida con la que crece el
     dibujo: así asoma siempre lo mismo, mida lo que mida la pantalla.

     Hay dos posturas y una sola cifra las separa:
       --asomo: -26%  manos enteras, mientras Madame presenta la tirada
       --asomo: -100% solo los dedos, cuando la mesa tiene que quedar libre
     El viaje va a saltos (steps) en vez de deslizarse: el pixel art de los
     ochenta se movía por bloques, no con un travelling suave. */
  .manos { --asomo: -26%; }
  .manos.manos-dentro { --asomo: -100%; }

  .mano-lienzo {
    display: block;
    width: 100%;
    height: auto;
    margin-top: var(--asomo);
    image-rendering: pixelated;
    transition: margin-top 760ms steps(11, end);
  }

  @media (max-width: 760px) {
    .manos { --asomo: -30%; }
    .manos.manos-dentro { --asomo: -104%; }
    .mano-hueco-izq { right: 54%; width: 28%; }
    .mano-hueco-der { left: 54%; width: 28%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mano-lienzo { transition: none; }
  }

  /* ---- dedos gordos ----
     En pantalla táctil no hay puntero fino: un botón de 29 px se falla. Aquí
     no se agranda el botón —eso descolocaba la fila del título en móvil— sino
     una zona invisible por encima de él. El dibujo queda igual y el dedo
     acierta: el mínimo cómodo son 44 px. */
  @media (pointer: coarse) {
    .status button,
    .compartir,

    .status button::after,
    .compartir::after,
    .boton-redondo::after {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 44px;
      min-height: 44px;
      width: 100%;
      height: 100%;
      content: "";
      transform: translate(-50%, -50%);
    }
  }

    techo.frequency.value = o.techo;

    techo.connect(suelo);
    suelo.connect(volumen);
    volumen.connect(salidaSeca);

    fuente.stop(t + (o.retraso || 0) + o.dur + 0.02);

    ids.forEach(function (id, indice) {
      var card = cards.filter(function (c) { return c.id === id; })[0];
      if (card) colocarEnCasilla(card, indice);
    });
    // Quien abre una tirada compartida no ha tocado nada: sería absurdo que
    // Madame le reprochara cómo ha barajado o cuánto ha tardado en decidir.
    gestos = { fuerte: 0, mezclas: 0, cambios: 0, giroSuelto: 0, inicio: null };
    renderStatus();
    updateSelection();
  }

  // ---- la carta esquiva ----
  // A veces una carta se niega a ser leída y el oráculo pide otra en su lugar.
  // La primera vez que aparece salta siempre (si no, casi nadie lo descubriría);
  // a partir de ahí, solo una de cada tres veces, para que siga siendo un hallazgo.
  var CARTA_ESQUIVA = 2; // La Musa en Huelga
  var PROBABILIDAD_ESQUIVA = 0.34;

  // Textos aprobados: la Musa como amante esquiva que confirma la cita y no acude.
  var NEGATIVA = [
    "**La Musa** debía acudir a esta cita.",
    "Confirmó lo justo para que la esperaras. Después hizo lo que mejor sabe: no dar explicaciones.",
    "No va a venir. La carta se retira; elige otra y colócala en esta casilla.",
  ];

  var PHYSICS_PRESETS = {
    Controlada: { throwForce: 1.05, friction: 0.958, bounce: 0.28, rotation: 3.2, snap: 76, dragLag: 12, scatter: 0.82 },
    Expresiva:  { throwForce: 1.55, friction: 0.972, bounce: 0.4,  rotation: 4.2, snap: 70, dragLag: 18, scatter: 1 },
    Ritual:     { throwForce: 0.88, friction: 0.966, bounce: 0.18, rotation: 2.3, snap: 98, dragLag: 25, scatter: 0.66 },
    Caótica:    { throwForce: 2.05, friction: 0.982, bounce: 0.56, rotation: 5.4, snap: 58, dragLag: 10, scatter: 1.38 },
  };

  var LAB_CONTROLS = [
    ["Impulso", "throwForce", 0.6, 2.4, 0.05],
    ["Deslizamiento", "friction", 0.94, 0.989, 0.001],
    ["Rebote", "bounce", 0.08, 0.7, 0.02],
    ["Rotación", "rotation", 1, 6.5, 0.1],
    ["Magnetismo", "snap", 40, 120, 1],
    ["Peso en mano", "dragLag", 0, 34, 1],
    ["Barajar", "scatter", 0.45, 1.7, 0.05],
  ];

  var SLOT_LABELS = ["Pasado", "Presente", "Futuro"];

  // ---- DOM refs ----
  var table = document.querySelector(".table");
  var slotsWrap = document.querySelector(".slots");
  var statusCount = document.querySelector(".status .count");
  var bubbleText = document.querySelector(".bubble-text");
  var oracleAvatar = document.querySelector(".oracle-avatar");
  var oracleDialogue = document.querySelector(".oracle-dialogue");
  var speechBubble = document.querySelector(".speech-bubble");
  var soundTrigger = document.querySelector(".sound-trigger");
  var botonCompartir = document.querySelector(".compartir");
  var buhoLabel = document.querySelector(".buho-label");
  var buhoDialogo = document.querySelector(".buho-dialogo");
  var buhoDialogoGlobo = document.querySelector(".buho-dialogo-globo");
  var buhoTexto = document.querySelector(".buho-texto");
  var buhoCursor = document.querySelector(".buho-cursor");
  var typingCursor = document.querySelector(".oracle-dialogue .typing-cursor");

  // Los dos personajes escriben igual, cada uno en su bocadillo. El motor de

  var CANAL_MADAME = { dialogo: oracleDialogue, texto: bubbleText, cursor: typingCursor };
  var CANAL_BUHO = { dialogo: buhoDialogo, texto: buhoTexto, cursor: buhoCursor };
  var canal = CANAL_MADAME;
  var frasesBuho = [];   // lo que el búho tenga que decir en cada momento

  var labTrigger = document.querySelector(".lab-trigger");
  var physicsLab = document.querySelector(".physics-lab");
  var labClose = document.querySelector(".lab-close");
  var labPresets = document.querySelector(".lab-presets");
  var labControls = document.querySelector(".lab-controls");

  var slotEls = [];

  // acercarse, se renumeran las cartas respetando el orden que tienen ahora.
  function siguienteZ() {
    if (zCounter >= 800) {
      cards.slice().sort(function (a, b) { return a.z - b.z; })
        .forEach(function (c, i) { c.z = i + 1; c.el.style.zIndex = c.z; });
      zCounter = CARD_COUNT + 1;
    }
    zCounter += 1;
    return zCounter;
  }
  var frame = null;
  var arrangementTimer = null;
  var motion = new Map();
  var hintDismissed = false; // el aviso "haz clic" muere con el primer giro
  var draggedId = null;
  var activeSlot = null;
  var arranging = false;

  // Gestos de quien juega: el oráculo se fija en CÓMO juegas, no solo en qué sale.

  var gestos = { fuerte: 0, mezclas: 0, cambios: 0, giroSuelto: 0, inicio: null };

  // Estado de la carta esquiva
  var espera = null;              // { slot } mientras el oráculo espera otra carta
  var huecoPendiente = null;      // casilla que quedará vacía al acabar la negativa
  var esquivaDescubierta = false; // ¿ya ha saltado alguna vez en esta visita?
  var yaSeNegoEstaLectura = false;
  var yaHuboAparte = false;       // como mucho un aparte por lectura

  var dialogueIndex = 0;
  var dialogueOverride = null;
  var recuentoPendiente = false; // el búho espera turno tras la despedida
  var dialogueComplete = false;
  var readingStep = null;
  var readingLines = []; // la lectura montada para la tirada actual
  var readingCards = []; // de qué carta habla cada frase (null si de ninguna)
  var typingInterval = null;
  var autoAdvanceTimer = null;
  var readingTimer = null;

  var physics = Object.assign({}, PHYSICS_PRESETS.Expresiva);

  function reducedMotion() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  // ---- build slots ----
  SLOT_LABELS.forEach(function (label) {
    var slot = document.createElement("div");
    slot.className = "slot";
    var span = document.createElement("span");
    span.textContent = label;
    slot.appendChild(span);
    slotsWrap.appendChild(slot);
