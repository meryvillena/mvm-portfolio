document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f10950a4-9314-49f2-9e65-1899c666be47\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: #0D0A08; }\n  a { color: #B83B2E; }\n  a:hover { color: #C9A227; }\n  ::selection { background: #B83B2E; color: #EFE7D8; }\n<\u002Fstyle>\n\n\n<div style=\"font-family: 'Archivo', sans-serif; background: #0D0A08; color: #EFE7D8; min-height: 100vh;\">\n\n  <!-- ============ CABECERA ============ -->\n  <div style=\"padding: 64px 6vw 40px; border-bottom: 1px solid rgba(239,231,216,0.12);\">\n    <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A227; margin-bottom: 14px;\">Documentación técnica · para IA programadora<\u002Fdiv>\n    <h1 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: -0.02em; font-size: clamp(40px, 5.5vw, 84px); line-height: 0.95; margin: 0 0 18px;\">Sistema de diseño<br><span style=\"color: #B83B2E;\">Evolución del depredador<\u002Fspan><\u002Fh1>\n    <p style=\"font-family: 'Newsreader', serif; font-style: italic; font-size: clamp(17px, 1.6vw, 21px); max-width: 640px; color: #cabfae; line-height: 1.5; margin: 0;\">\n      Valores extraídos y unificados del build vigente (Portada · Bundy · Edad de oro). Este documento fija UNA sola escala tipográfica, UN solo efecto de titular y los patrones de scroll reutilizables — para aplicar de forma consistente en las 3 secciones que faltan (Folklore, Forense, Digital/IA).\n    <\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ============ 1. PALETA POR ACTO ============ -->\n  <div style=\"padding: 56px 6vw 24px; border-top: 3px solid #B83B2E;\">\n    <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A227; margin-bottom: 6px;\">01 · Color<\u002Fdiv>\n    <h2 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: clamp(28px, 3.2vw, 46px); margin: 0 0 8px; color: #EFE7D8;\">Paleta por acto<\u002Fh2>\n    <p style=\"max-width: 640px; color: #a89a83; font-size: 15px; line-height: 1.6; margin: 0;\">Cada acto cambia de paleta por completo — fondo incluido. Cada bloque abajo está pintado con su paleta real, no solo un swatch pequeño.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"padding: 64px 6vw; background: #16110F; color: #EFE7D8; border-bottom: 4px solid #0D0A08;\">\n    <div style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: #C9A227; margin-bottom: 16px;\">Acto 1 — Archivo / prensa · Bundy y la edad de oro<\u002Fdiv>\n    <h1 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: -0.01em; font-size: clamp(36px, 5.2vw, 68px); line-height: 0.95; margin: 0 0 16px;\">Carreteras largas.<br>Archivos <span style=\"color:#B83B2E;\">cortos<\u002Fspan>.<\u002Fh1>\n    <div style=\"font-family: 'Newsreader', serif; font-style: italic; font-size: clamp(17px, 1.9vw, 22px); max-width: 520px; margin-bottom: 24px;\">No era magia. Era infraestructura defectuosa.<\u002Fdiv>\n    <div style=\"display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;\">\n      <div><div style=\"width: 96px; height: 56px; background:#16110F; border: 1px solid rgba(239,231,216,0.25); margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#16110F fondo<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"width: 96px; height: 56px; background:#EFE7D8; margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#EFE7D8 texto<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"width: 96px; height: 56px; background:#B83B2E; margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#B83B2E acento<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"width: 96px; height: 56px; background:#C9A227; margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#C9A227 label<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 14px; max-width: 640px; line-height: 1.6; color: #cabfae;\">Negro carbón cálido (no negro puro) + rojo terracota controlado — nunca rojo sangre saturado — para titulares clave. Amarillo envejecido para labels, fechas, numeración tipo archivo policial. Sensación: tabloide, mugshot, prensa 70–90.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding: 64px 6vw; background: #D9CBA3; color: #2B2419; border-bottom: 4px solid #0D0A08;\">\n    <div style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: #6B4226; margin-bottom: 16px;\">Acto 2 — Folklore · antes del expediente<\u002Fdiv>\n    <h1 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: -0.01em; font-size: clamp(36px, 5.2vw, 68px); line-height: 0.95; margin: 0 0 16px;\">Antes del expediente<br>estaba la <span style=\"color:#6B4226;\">leyenda<\u002Fspan>.<\u002Fh1>\n    <div style=\"font-family: 'Newsreader', serif; font-style: italic; font-size: clamp(17px, 1.9vw, 22px); max-width: 520px; margin-bottom: 24px;\">El folklore fue el archivo emocional del miedo.<\u002Fdiv>\n    <div style=\"display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;\">\n      <div><div style=\"width: 96px; height: 56px; background:#D9CBA3; border: 1px solid rgba(43,36,25,0.3); margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#D9CBA3 fondo<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"width: 96px; height: 56px; background:#2B2419; margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#2B2419 texto<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"width: 96px; height: 56px; background:#6B4226; margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#6B4226 acento<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 14px; max-width: 640px; line-height: 1.6; opacity: 0.8;\">Giro deliberado: fondo claro tipo papel/pergamino envejecido — único acto que rompe el patrón oscuro del resto, como abrir un libro viejo en medio del recorrido digital. Marrón tierra como único acento, sin rojo ni negro, para no confundirse con el acto de archivo/prensa.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding: 64px 6vw; background: #100A14; color: #F2E9EE; border-bottom: 4px solid #0D0A08;\">\n    <div style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: #E63E9C; margin-bottom: 16px;\">Acto 3 — Forense · ADN, cámaras, patrón<\u002Fdiv>\n    <h1 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: -0.01em; font-size: clamp(36px, 5.2vw, 68px); line-height: 0.95; margin: 0 0 16px;\">El cuerpo empezó<br>a hablar más <span style=\"color:#E63E9C;\">alto<\u002Fspan>.<\u002Fh1>\n    <div style=\"font-family: 'Newsreader', serif; font-style: italic; font-size: clamp(17px, 1.9vw, 22px); max-width: 520px; margin-bottom: 24px;\">La impunidad perdió espacio cuando la evidencia ganó memoria.<\u002Fdiv>\n    <div style=\"display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;\">\n      <div><div style=\"width: 96px; height: 56px; background:#100A14; border: 1px solid rgba(242,233,238,0.25); margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#100A14 fondo<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"width: 96px; height: 56px; background:#F2E9EE; margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#F2E9EE texto<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"width: 96px; height: 56px; background:#E63E9C; margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#E63E9C acento<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 14px; max-width: 640px; line-height: 1.6; opacity: 0.75;\">Referencia real: luz forense alternativa (ALS/UV) en sala oscura — fluidos y huellas fluorescen en magenta. Mismo principio que la ninhidrina, en variante \"sala oscura\" en vez de \"mesa blanca de laboratorio\" — encaja mejor con un recorrido mayormente oscuro.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding: 64px 6vw; background: #060B08; color: #D6F5DE; border-bottom: 1px solid rgba(239,231,216,0.12);\">\n    <div style=\"font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: #33D17A; margin-bottom: 16px;\">Acto 4 — Digital / IA · pantalla y escala<\u002Fdiv>\n    <h1 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: -0.01em; font-size: clamp(36px, 5.2vw, 68px); line-height: 0.95; margin: 0 0 16px;\">La pantalla no elimina<br>la <span style=\"color:#33D17A;\">violencia<\u002Fspan>.<\u002Fh1>\n    <div style=\"font-family: 'Newsreader', serif; font-style: italic; font-size: clamp(17px, 1.9vw, 22px); max-width: 520px; margin-bottom: 24px;\">La rediseña.<\u002Fdiv>\n    <div style=\"display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;\">\n      <div><div style=\"width: 96px; height: 56px; background:#060B08; border: 1px solid rgba(214,245,222,0.25); margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#060B08 fondo<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"width: 96px; height: 56px; background:#D6F5DE; margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#D6F5DE texto<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"width: 96px; height: 56px; background:#33D17A; margin-bottom: 6px;\"><\u002Fdiv><div style=\"font-size: 11px;\">#33D17A acento<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 14px; max-width: 640px; line-height: 1.6; opacity: 0.75;\">Negro casi puro con verde fósforo tipo terminal, dosificado: texto de cuerpo en verde muy pálido, verde fuerte reservado a titulares/números de impacto — nunca como fondo de bloques de lectura larga, para no caer en cliché de hacker con capucha.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding: 32px 6vw 56px; background: #0D0A08; border-bottom: 1px solid rgba(239,231,216,0.12);\">\n    <div style=\"padding: 16px 20px; background: rgba(239,231,216,0.04); border-left: 2px solid #B83B2E; font-size: 13.5px; color: #cabfae; line-height: 1.6; margin-bottom: 12px;\">\n      Preview interactivo — tweak <code>actoPreview<\u002Fcode> para cambiar el acto:\n    <\u002Fdiv>\n    <div style=\"padding: 40px 6vw; background: {{ actoBg }}; color: {{ actoText }}; transition: background 0.3s ease, color 0.3s ease;\">\n      <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: {{ actoAccent }}; margin-bottom: 10px;\">{{ actoLabel }}<\u002Fdiv>\n      <div style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: -0.02em; font-size: clamp(32px, 4vw, 64px); line-height: 0.95;\">Titular de muestra<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 2. TIPOGRAFÍA ============ -->\n  <div style=\"padding: 56px 6vw; border-bottom: 1px solid rgba(239,231,216,0.12); border-top: 3px solid #6B4226;\">\n    <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A227; margin-bottom: 6px;\">02 · Tipografía<\u002Fdiv>\n    <h2 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: clamp(28px, 3.2vw, 46px); margin: 0 0 8px;\">Escala unificada<\u002Fh2>\n    <p style=\"max-width: 680px; color: #a89a83; font-size: 15px; line-height: 1.6; margin: 0 0 8px;\">\n      El build actual usa tamaños de H1 distintos en cada bloque (portada 118px, edad de oro 78–100px, títulos de tablón 170px, método 146px). A partir de aquí hay UNA sola escala con roles fijos — cada bloque nuevo elige un rol, no un tamaño suelto.\n    <\u002Fp>\n    <p style=\"max-width: 680px; color: #6f6152; font-size: 12.5px; line-height: 1.6; margin: 0 0 32px;\">Familias: <b style=\"color:#a89a83;\">Anton<\u002Fb> (titulares, un solo peso, siempre mayúsculas) · <b style=\"color:#a89a83;\">Newsreader cursiva<\u002Fb> (subtítulos) · <b style=\"color:#a89a83;\">Archivo<\u002Fb> (cuerpo, labels, microcopy).<\u002Fp>\n\n    <div style=\"display: flex; flex-direction: column; gap: 0;\">\n\n      <div style=\"display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid rgba(239,231,216,0.1); align-items: center;\">\n        <div><div style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #C9A227;\">Kicker / Label<\u002Fdiv><div style=\"font-size: 10px; color: #6f6152; font-family: 'Courier Prime', monospace;\">11px · Archivo 600<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A227;\">Archivo · Sección · Coordenada narrativa<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid rgba(239,231,216,0.1); align-items: center;\">\n        <div><div style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #C9A227;\">H1 · Hero<\u002Fdiv><div style=\"font-size: 10px; color: #6f6152; font-family: 'Courier Prime', monospace;\">clamp(64px,9vw,160px)<br>line-height .9 · -0.02em<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: -0.02em; font-size: clamp(38px, 6vw, 100px); line-height: 0.9;\">Titular ancla<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid rgba(239,231,216,0.1); align-items: center;\">\n        <div><div style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #C9A227;\">H2 · Título de bloque<\u002Fdiv><div style=\"font-size: 10px; color: #6f6152; font-family: 'Courier Prime', monospace;\">clamp(44px,6vw,96px)<br>line-height .95 · -0.015em<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: -0.015em; font-size: clamp(30px, 4.2vw, 68px); line-height: 0.95;\">Título de spread<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid rgba(239,231,216,0.1); align-items: center;\">\n        <div><div style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #C9A227;\">Número de impacto<\u002Fdiv><div style=\"font-size: 10px; color: #6f6152; font-family: 'Courier Prime', monospace;\">clamp(110px,13vw,220px)<br>escala aparte — solo para datos \"wow\"<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: 'Anton', sans-serif; font-size: clamp(56px, 8vw, 110px); line-height: 0.85; color: #B83B2E; -webkit-text-stroke: 1.5px #B83B2E;\">72%<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid rgba(239,231,216,0.1); align-items: center;\">\n        <div><div style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #C9A227;\">Subtítulo<\u002Fdiv><div style=\"font-size: 10px; color: #6f6152; font-family: 'Courier Prime', monospace;\">clamp(18px,1.8vw,24px)<br>line-height 1.45 · Newsreader italic<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: 'Newsreader', serif; font-style: italic; font-size: clamp(16px, 1.8vw, 22px); line-height: 1.45; color: #cabfae; max-width: 520px;\">No era el último. Solo era el último que sabíamos reconocer.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid rgba(239,231,216,0.1); align-items: center;\">\n        <div><div style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #C9A227;\">Cuerpo<\u002Fdiv><div style=\"font-size: 10px; color: #6f6152; font-family: 'Courier Prime', monospace;\">15.5px · line-height 1.6<br>máx 90 palabras/bloque<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size: 15.5px; line-height: 1.6; color: #a89a83; max-width: 480px;\">Carreteras largas, archivos cortos y una cultura mediática fascinada por el monstruo masculino. El contexto también mata.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 140px 1fr; gap: 24px; padding: 22px 0; border-top: 1px solid rgba(239,231,216,0.1); border-bottom: 1px solid rgba(239,231,216,0.1); align-items: center;\">\n        <div><div style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #C9A227;\">Caption / museo<\u002Fdiv><div style=\"font-size: 10px; color: #6f6152; font-family: 'Courier Prime', monospace;\">11px · tracking .08em<br>fondo scrim 72% opac.<\u002Fdiv><\u002Fdiv>\n        <div style=\"display: inline-block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(22,17,15,0.72); padding: 6px 10px;\">Seattle, WA · <b style=\"color:#B83B2E;\">1974<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 3. EFECTO DE TITULAR CANÓNICO ============ -->\n  <div style=\"padding: 56px 6vw; border-bottom: 1px solid rgba(239,231,216,0.12); border-top: 3px solid #E63E9C;\">\n    <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A227; margin-bottom: 6px;\">03 · Efecto de titular<\u002Fdiv>\n    <h2 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: clamp(28px, 3.2vw, 46px); margin: 0 0 8px;\">Un solo efecto, siempre<\u002Fh2>\n    <p style=\"max-width: 680px; color: #a89a83; font-size: 15px; line-height: 1.6; margin: 0 0 32px;\">\n      Hoy conviven un H1 estático (portada) con titulares que se revelan línea a línea (tablón, método). Regla a partir de ahora: <b style=\"color:#EFE7D8;\">todo H1/H2 usa \"Revelado de línea\"<\u002Fb> — solo kickers, captions y microcopy quedan estáticos.\n    <\u002Fp>\n\n    <div id=\"reveal-demo-box\" style=\"border: 1px solid rgba(239,231,216,0.15); padding: 48px 5vw; background: #0c0908; position: relative; overflow: hidden;\">\n      <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A227; margin-bottom: 18px;\">Demo — hace scroll hasta aquí para verlo<\u002Fdiv>\n      <div style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.9;\">\n        <div style=\"font-size: clamp(30px, 4.5vw, 72px); opacity: {{ line1Opacity }}; transform: translateY({{ line1Y }}px); transition: opacity 0.7s cubic-bezier(.16,1,.3,1) 0s, transform 0.7s cubic-bezier(.16,1,.3,1) 0s;\">EL DEPREDADOR<\u002Fdiv>\n        <div style=\"font-size: clamp(30px, 4.5vw, 72px); color: #B83B2E; opacity: {{ line2Opacity }}; transform: translateY({{ line2Y }}px); transition: opacity 0.7s cubic-bezier(.16,1,.3,1) 0.09s, transform 0.7s cubic-bezier(.16,1,.3,1) 0.09s;\">NO DESAPARECE<\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"{{ replay }}\" style=\"margin-top: 24px; background: none; border: 1px solid rgba(239,231,216,0.3); color: #a89a83; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 14px; cursor: pointer; font-family: 'Archivo', sans-serif;\">↻ Repetir<\u002Fbutton>\n    <\u002Fdiv>\n\n    <pre style=\"margin-top: 20px; background: #0c0908; border: 1px solid rgba(239,231,216,0.12); padding: 20px 24px; font-family: 'Courier Prime', monospace; font-size: 12px; line-height: 1.7; color: #cabfae; overflow-x: auto;\">/* Patrón: Revelado de línea — aplicar a TODO H1/H2 */\n.reveal-line {\n  opacity: var(--reveal, 0);\n  transform: translateY(calc((1 - var(--reveal, 0)) * 40px));\n  transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1);\n}\n/* stagger: 90ms entre línea y línea (transition-delay) */\n/* --reveal se fija con IntersectionObserver: 0 fuera de vista, 1 dentro */\n/* threshold recomendado: 0.35 · rootMargin: \"0px 0px -10% 0px\" */\n/* en móvil (&lt;900px): --reveal fijo a 1, sin transform (evitar layout shift en scroll táctil) */<\u002Fpre>\n  <\u002Fdiv>\n\n  <!-- ============ 4. PATRONES DE SCROLL ============ -->\n  <div style=\"padding: 56px 6vw; border-bottom: 1px solid rgba(239,231,216,0.12); border-top: 3px solid #33D17A;\">\n    <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A227; margin-bottom: 6px;\">04 · Scroll<\u002Fdiv>\n    <h2 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: clamp(28px, 3.2vw, 46px); margin: 0 0 8px;\">Transiciones reutilizables<\u002Fh2>\n    <p style=\"max-width: 680px; color: #a89a83; font-size: 15px; line-height: 1.6; margin: 0 0 32px;\">Catalogadas del build vigente + una nueva propuesta (G) para el salto de paleta entre actos.<\u002Fp>\n\n    <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n\n      <div style=\"background: rgba(239,231,216,0.03); padding: 22px 24px;\">\n        <div style=\"display:flex; gap:12px; align-items:baseline; margin-bottom:8px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:20px;\">A<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px;\">Motor central<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px; color: #a89a83; line-height: 1.6; max-width: 720px;\">Scroll vertical nativo traducido a <code style=\"color:#cabfae;\">translateX<\u002Fcode> en <code style=\"color:#cabfae;\">#track<\u002Fcode>. <code style=\"color:#cabfae;\">#pin<\u002Fcode> sticky, cada spread <code style=\"color:#cabfae;\">flex: 0 0 100vw<\u002Fcode> (o <code style=\"color:#cabfae;\">300vw<\u002Fcode> para bloques anchos tipo tablón). Sin <code style=\"color:#cabfae;\">preventDefault<\u002Fcode>. En móvil (&lt;900px) se desactiva y vuelve a scroll vertical normal.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: rgba(239,231,216,0.03); padding: 22px 24px;\">\n        <div style=\"display:flex; gap:12px; align-items:baseline; margin-bottom:8px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:20px;\">B<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px;\">Capa de fondo fija<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px; color: #a89a83; line-height: 1.6; max-width: 720px;\"><code style=\"color:#cabfae;\">position:fixed<\u002Fcode>, crossfade de opacidad (0.4–0.55s) según qué tramo del track está visible; la imagen hace zoom con <code style=\"color:#cabfae;\">transform: scale()<\u002Fcode> en transición de 1.1s. El contenido de <code style=\"color:#cabfae;\">#track<\u002Fcode> se desliza por encima. Reutilizado hoy en mapa Bundy, tablón edad de oro y fondo de método.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: rgba(239,231,216,0.03); padding: 22px 24px;\">\n        <div style=\"display:flex; gap:12px; align-items:baseline; margin-bottom:8px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:20px;\">C<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px;\">Parallax por velocidad<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px; color: #a89a83; line-height: 1.6; max-width: 720px;\"><code style=\"color:#cabfae;\">data-speed<\u002Fcode> por capa (fondo 0.08, tarjetas más rápido) → <code style=\"color:#cabfae;\">translateX(delta * speed)<\u002Fcode>. Deja ver la imagen de fondo en los huecos entre tarjetas opacas.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: rgba(239,231,216,0.03); padding: 22px 24px;\">\n        <div style=\"display:flex; gap:12px; align-items:baseline; margin-bottom:8px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:20px;\">D<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px;\">Revelado de línea<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px; color: #a89a83; line-height: 1.6; max-width: 720px;\">Ver sección 03 — ahora obligatorio para todo H1/H2, no opcional.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: rgba(239,231,216,0.03); padding: 22px 24px;\">\n        <div style=\"display:flex; gap:12px; align-items:baseline; margin-bottom:8px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:20px;\">E<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px;\">Progreso<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px; color: #a89a83; line-height: 1.6; max-width: 720px;\">Barra fija inferior (<code style=\"color:#cabfae;\">.prog<\u002Fcode>, 3px, acento sobre 12% opacidad) + puntos <code style=\"color:#cabfae;\">.stop-progress<\u002Fcode> por parada dentro de un mismo bloque (ej. recorrido Bundy).<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: rgba(239,231,216,0.03); padding: 22px 24px;\">\n        <div style=\"display:flex; gap:12px; align-items:baseline; margin-bottom:8px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:20px;\">F<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px;\">Grano global<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px; color: #a89a83; line-height: 1.6; max-width: 720px;\">Una sola capa <code style=\"color:#cabfae;\">.page-grain<\u002Fcode> fija (SVG feTurbulence, opacity .2, mix-blend overlay) para todo el sitio — nunca una por pantalla (coste de render).<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: rgba(184,59,46,0.08); padding: 22px 24px; border-left: 2px solid #B83B2E;\">\n        <div style=\"display:flex; gap:12px; align-items:baseline; margin-bottom:8px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:20px;\">G<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px;\">Transición de acto — NUEVA, propuesta<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px; color: #cabfae; line-height: 1.6; max-width: 720px;\">Aún no existe en el build. Al cruzar el límite entre actos (ej. edad de oro → folklore, único acto con fondo claro), el fondo del <code style=\"color:#EFE7D8;\">body<\u002Fcode> hace crossfade de color (0.6–0.8s) en vez de corte seco — el grano y la barra de progreso se mantienen constantes para dar continuidad. El texto/imagen del acto saliente se desvanece 15% antes de que entre el color nuevo, para que no compitan brillos.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: rgba(239,231,216,0.03); padding: 22px 24px;\">\n        <div style=\"display:flex; gap:12px; align-items:baseline; margin-bottom:8px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:20px;\">H<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:18px;\">Cortina editorial / doble página<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 14px; color: #a89a83; line-height: 1.6; max-width: 720px;\">Panel de 200vw (<code style=\"color:#cabfae;\">.dahmer-panel<\u002Fcode> → <code style=\"color:#cabfae;\">.dahmer-track<\u002Fcode>) con una imagen full-screen debajo (<code style=\"color:#cabfae;\">.dahmer-photo-stage<\u002Fcode>) y una pantalla opaca de texto encima (<code style=\"color:#cabfae;\">.dahmer-cover<\u002Fcode>). La imagen vive dentro del panel, no en una capa <code style=\"color:#cabfae;\">position:fixed<\u002Fcode> global como el patrón B — se percibe fija por compensación JS (<code style=\"color:#cabfae;\">--dahmer-pin-x<\u002Fcode>). La cortina de texto no tiene animación propia: sale hacia la izquierda por el movimiento normal del <code style=\"color:#cabfae;\">#track<\u002Fcode>. Sin crossfade, sin zoom, sin texto sobre la foto. El siguiente spread (<code style=\"color:#cabfae;\">#eo-cierre<\u002Fcode>) cubre con fondo opaco sólido y corte seco — no usa el patrón G.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 5. TRATAMIENTO DE IMAGEN ============ -->\n  <div style=\"padding: 56px 6vw; border-top: 3px solid #C9A227;\">\n    <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A227; margin-bottom: 6px;\">05 · Imagen<\u002Fdiv>\n    <h2 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: clamp(28px, 3.2vw, 46px); margin: 0 0 8px;\">Recetas + zona de corte segura<\u002Fh2>\n    <p style=\"max-width: 680px; color: #a89a83; font-size: 15px; line-height: 1.6; margin: 0 0 8px;\">\n      Feedback de la usuaria: varias fotos definitivas se cortan por la cabeza. Causa habitual: <code style=\"color:#cabfae;\">object-position: center<\u002Fcode> en retratos verticales dentro de un contenedor panorámico.\n    <\u002Fp>\n    <div style=\"margin: 0 0 32px; padding: 16px 20px; background: rgba(239,231,216,0.04); border-left: 2px solid #C9A227; font-size: 13.5px; color: #cabfae; line-height: 1.6; max-width: 720px;\">\n      Regla: en cualquier <code style=\"color:#EFE7D8;\">.col-image, .split-image, .kcard-lg-frame<\u002Fcode> con foto de retrato, usar <code style=\"color:#EFE7D8;\">object-position: center 15–25%<\u002Fcode> (no <code style=\"color:#EFE7D8;\">center 50%<\u002Fcode>) y comprobar en el breakpoint más estrecho (900px) y en pantallas ultra anchas — son los dos extremos donde más se recorta la cabeza.\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 2px;\">\n      <div style=\"background: rgba(239,231,216,0.03); padding: 18px 20px;\">\n        <div style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:14px; margin-bottom:8px; color:#EFE7D8;\">Archivo B/N (dossier)<\u002Fdiv>\n        <div style=\"font-family:'Courier Prime',monospace; font-size: 11px; color:#a89a83; line-height:1.7;\">grayscale(.85)<br>contrast(1.2)<br>brightness(.9)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: rgba(239,231,216,0.03); padding: 18px 20px;\">\n        <div style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:14px; margin-bottom:8px; color:#EFE7D8;\">Collage color (edad de oro)<\u002Fdiv>\n        <div style=\"font-family:'Courier Prime',monospace; font-size: 11px; color:#a89a83; line-height:1.7;\">grayscale(.3)<br>contrast(1.15)<br>brightness(.5)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: rgba(239,231,216,0.03); padding: 18px 20px;\">\n        <div style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:14px; margin-bottom:8px; color:#EFE7D8;\">Duotono acento<\u002Fdiv>\n        <div style=\"font-family:'Courier Prime',monospace; font-size: 11px; color:#a89a83; line-height:1.7;\">mix-blend-mode: color<br>color del acto · opacity .15<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: rgba(239,231,216,0.03); padding: 18px 20px;\">\n        <div style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:14px; margin-bottom:8px; color:#EFE7D8;\">Viñeta<\u002Fdiv>\n        <div style=\"font-family:'Courier Prime',monospace; font-size: 11px; color:#a89a83; line-height:1.7;\">radial-gradient ellipse<br>.05 → .45 (55%) → .85 (100%)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: rgba(239,231,216,0.03); padding: 18px 20px;\">\n        <div style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:14px; margin-bottom:8px; color:#EFE7D8;\">Grano (foto puntual)<\u002Fdiv>\n        <div style=\"font-family:'Courier Prime',monospace; font-size: 11px; color:#a89a83; line-height:1.7;\">feTurbulence .85–.9<br>saturate 0 · overlay .25<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ 6. CÓDIGO REAL POR PATRÓN (A–G) ============ -->\n  <div style=\"padding: 56px 6vw; border-top: 3px solid #B83B2E; border-bottom: 1px solid rgba(239,231,216,0.12);\">\n    <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9A227; margin-bottom: 6px;\">06 · Código<\u002Fdiv>\n    <h2 style=\"font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: clamp(28px, 3.2vw, 46px); margin: 0 0 8px;\">Snippets reales por patrón<\u002Fh2>\n    <p style=\"max-width: 680px; color: #a89a83; font-size: 15px; line-height: 1.6; margin: 0 0 32px;\">CSS/JS tal cual está en <code style=\"color:#cabfae;\">index.html<\u002Fcode>, con nombres de clase reales — para que una IA programadora los reutilice sin adivinar selectores.<\u002Fp>\n\n    <div style=\"display:flex; gap:10px; align-items:baseline; margin-bottom:10px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:18px;\">A<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:16px;\">Motor central<\u002Fspan><\u002Fdiv>\n    <pre style=\"background: #0c0908; border: 1px solid rgba(239,231,216,0.12); padding: 18px 22px; font-family: 'Courier Prime', monospace; font-size: 11.5px; line-height: 1.65; color: #cabfae; overflow-x: auto; margin-bottom: 28px;\">#scroller { position: relative; }\n#pin { position: sticky; top: 0; height: 100vh; overflow: hidden; }\n#track { display: flex; height: 100vh; will-change: transform; position: relative; z-index: 2; }\n.spread { flex: 0 0 100vw; width: 100vw; height: 100vh; position: relative; overflow: hidden; }\n/* bloque ancho tipo tablón: */\n.board-panel--wide { width: 300vw; flex: 0 0 300vw; }\n\n@media (max-width: 900px) {\n  #pin { position: static; height: auto; overflow: visible; }\n  #scroller { height: auto !important; }\n  #track { display: block; height: auto; transform: none !important; }\n  .spread { width: 100%; height: auto; min-height: 100vh; }\n}\n/* JS: leer deltaY del wheel / scroll vertical acumulado y aplicarlo como\n   #track.style.transform = translateX(-acumulado) — sin preventDefault,\n   dejando que el scroll vertical nativo siga disparando el evento. */<\u002Fpre>\n\n    <div style=\"display:flex; gap:10px; align-items:baseline; margin-bottom:10px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:18px;\">B<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:16px;\">Capa de fondo fija (mapa/tablón/método)<\u002Fspan><\u002Fdiv>\n    <pre style=\"background: #0c0908; border: 1px solid rgba(239,231,216,0.12); padding: 18px 22px; font-family: 'Courier Prime', monospace; font-size: 11.5px; line-height: 1.65; color: #cabfae; overflow-x: auto; margin-bottom: 28px;\">#bundy-map-layer {\n  position: fixed; inset: 0; z-index: 1; opacity: 0;\n  transition: opacity 0.4s ease; pointer-events: none;\n}\n#bundy-map-layer.is-visible { opacity: 1; }\n#bundy-map-layer .map-img {\n  width: 100%; height: 100%; object-fit: cover;\n  transform: var(--map-transform, scale(1) translate(0, 0));\n  transition: transform 1.1s cubic-bezier(.4, 0, .2, 1);\n  transform-origin: 50% 50%;\n}\n/* mismo patrón reutilizado en #caras-bg-layer (tablón edad de oro)\n   y #method-bg-layer (fondo de método), solo cambia el contenido:\n   #method-bg-layer img.active { opacity: 1; transform: scale(1); }\n   #method-bg-layer img { opacity: 0; transform: scale(1.04);\n     filter: grayscale(0.85) contrast(1.15) brightness(0.42); } */\n/* JS: IntersectionObserver por spread → toggle .is-visible en la capa\n   fija correspondiente + set --map-transform / .active según el spread activo */\n@media (max-width: 900px) {\n  #bundy-map-layer, #caras-bg-layer, #method-bg-layer { display: none; }\n}<\u002Fpre>\n\n    <div style=\"display:flex; gap:10px; align-items:baseline; margin-bottom:10px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:18px;\">C<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:16px;\">Parallax por velocidad<\u002Fspan><\u002Fdiv>\n    <pre style=\"background: #0c0908; border: 1px solid rgba(239,231,216,0.12); padding: 18px 22px; font-family: 'Courier Prime', monospace; font-size: 11.5px; line-height: 1.65; color: #cabfae; overflow-x: auto; margin-bottom: 28px;\">.eo .duo-bg { position: absolute; inset: 0; z-index: 0; transform: translateX(var(--px-x, 0px)); }\n.eo .duo-bg img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.12);\n  filter: grayscale(0.3) contrast(1.15) brightness(0.5); }\n.eo .duo-card { position: absolute; top: 50%; z-index: 1; padding: 4vh 2.6vw;\n  transform: translateY(-50%) translateX(var(--px-x, 0px)); }\n.eo .duo-card--num  { left: 6vw; width: 36vw; max-width: 480px; }\n.eo .duo-card--text { right: 6vw; width: 40vw; max-width: 560px; }\n/* markup: &lt;div class=\"duo-bg px-layer\" data-speed=\"0.08\"&gt;&lt;img ...&gt;&lt;/div&gt; */\n/* JS: --px-x = scrollDeltaDesdeEntrada * parseFloat(data-speed) por capa,\n   capas con menor data-speed se mueven menos → sensación de profundidad */<\u002Fpre>\n\n    <div style=\"display:flex; gap:10px; align-items:baseline; margin-bottom:10px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:18px;\">D<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:16px;\">Revelado de línea<\u002Fspan><\u002Fdiv>\n    <pre style=\"background: #0c0908; border: 1px solid rgba(239,231,216,0.12); padding: 18px 22px; font-family: 'Courier Prime', monospace; font-size: 11.5px; line-height: 1.65; color: #cabfae; overflow-x: auto; margin-bottom: 28px;\">.eo .board-hero .ln, .eo .method-intro-title .ln {\n  display: block; white-space: nowrap;\n  opacity: var(--reveal, 0);\n  transform: translateY(calc((1 - var(--reveal, 0)) * 40px));\n}\n/* JS: */\nconst io = new IntersectionObserver((entries) =&gt; {\n  entries.forEach((e) =&gt; {\n    const ratio = Math.max(0, Math.min(1, e.intersectionRatio));\n    e.target.style.setProperty('--reveal', ratio);\n  });\n}, { threshold: Array.from({length: 21}, (_, i) =&gt; i / 20) });\ndocument.querySelectorAll('.ln').forEach((el, i) =&gt; {\n  el.style.transitionDelay = (i * 90) + 'ms';\n  io.observe(el);\n});\n@media (max-width: 900px) {\n  .eo .board-hero .ln { opacity: 1; transform: none; white-space: normal; }\n}<\u002Fpre>\n\n    <div style=\"display:flex; gap:10px; align-items:baseline; margin-bottom:10px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:18px;\">E<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:16px;\">Progreso<\u002Fspan><\u002Fdiv>\n    <pre style=\"background: #0c0908; border: 1px solid rgba(239,231,216,0.12); padding: 18px 22px; font-family: 'Courier Prime', monospace; font-size: 11.5px; line-height: 1.65; color: #cabfae; overflow-x: auto; margin-bottom: 28px;\">.prog { position: fixed; left: 0; right: 0; bottom: 0; height: 3px;\n  background: rgba(239,231,216,0.12); z-index: 100; }\n.prog &gt; span { display: block; height: 100%; width: 0%; background: #B83B2E; }\n/* JS: span.style.width = (scrollActual / scrollTotal * 100) + '%' */\n\n.stop-progress { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 7px; }\n.stop-progress span { width: 6px; height: 6px; border: 1px solid #B83B2E; }\n.stop-progress span.active { background: #B83B2E; }<\u002Fpre>\n\n    <div style=\"display:flex; gap:10px; align-items:baseline; margin-bottom:10px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:18px;\">F<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:16px;\">Grano global<\u002Fspan><\u002Fdiv>\n    <pre style=\"background: #0c0908; border: 1px solid rgba(239,231,216,0.12); padding: 18px 22px; font-family: 'Courier Prime', monospace; font-size: 11.5px; line-height: 1.65; color: #cabfae; overflow-x: auto; margin-bottom: 28px;\">.page-grain {\n  position: fixed; inset: 0; z-index: 90; pointer-events: none;\n  mix-blend-mode: overlay; opacity: 0.2;\n  background-image: url(\"data:image/svg+xml,... SVG feTurbulence, frecuencia base 0.85, 2 octavas ...\");\n}\n/* una sola instancia en el &lt;body&gt;, nunca una por spread */<\u002Fpre>\n\n    <div style=\"display:flex; gap:10px; align-items:baseline; margin-bottom:10px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:18px;\">G<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:16px;\">Transición de acto — a implementar<\u002Fspan><\u002Fdiv>\n    <pre style=\"background: #0c0908; border: 1px solid rgba(239,231,216,0.12); padding: 18px 22px; font-family: 'Courier Prime', monospace; font-size: 11.5px; line-height: 1.65; color: #cabfae; overflow-x: auto;\">/* Aún no existe. Propuesta de implementación: */\nbody { transition: background-color 0.7s ease, color 0.7s ease; }\n/* JS: al detectar (IntersectionObserver) que el spread visible pertenece\n   a un acto distinto del anterior, hacer:\n   document.body.style.backgroundColor = actoColors[actoActual].bg;\n   document.body.style.color = actoColors[actoActual].text;\n   — 150ms antes de terminar la transición del spread saliente,\n   para que el contenido ya esté desvanecido cuando cambia el fondo.\n   .page-grain y .prog NO cambian de estilo en el cruce (dan continuidad). */<\u002Fpre>\n\n    <div style=\"display:flex; gap:10px; align-items:baseline; margin-bottom:10px; margin-top: 28px;\"><span style=\"font-family:'Anton',sans-serif; color:#B83B2E; font-size:18px;\">H<\u002Fspan><span style=\"font-family:'Anton',sans-serif; text-transform:uppercase; font-size:16px;\">Cortina editorial / doble página<\u002Fspan><\u002Fdiv>\n    <pre style=\"background: #0c0908; border: 1px solid rgba(239,231,216,0.12); padding: 18px 22px; font-family: 'Courier Prime', monospace; font-size: 11.5px; line-height: 1.65; color: #cabfae; overflow-x: auto;\">.eo.dahmer-panel { padding: 0 !important; background: #16110F; width: 200vw; flex: 0 0 200vw; }\n.eo .dahmer-track { position: relative; width: 200vw; height: 100%; overflow: hidden; }\n.eo .dahmer-photo-stage { position: absolute; inset: 0; z-index: 0; }\n.eo .dahmer-photo-stage img { width: 100%; height: 100%; object-fit: cover; opacity: 0.58; transform: scale(1.05); }\n.eo .dahmer-cover { position: absolute; top: 0; left: 0; width: 100vw; height: 100%; z-index: 1; background: #B83B2E; color: #16110F; }\n\n/* markup real: */\n/* &lt;section id=\"eo-dahmer\" class=\"spread eo panel dahmer-panel\"&gt;\n     &lt;div class=\"dahmer-track\"&gt;\n       &lt;div class=\"dahmer-photo-stage\"&gt;&lt;img ...&gt;&lt;/div&gt;\n       &lt;div class=\"dahmer-cover\"&gt;...pantalla opaca de texto...&lt;/div&gt;\n     &lt;/div&gt;\n   &lt;/section&gt;\n   &lt;section id=\"eo-cierre\"&gt;...siguiente spread, fondo opaco, corte seco...&lt;/section&gt; */\n\n/* JS: --dahmer-pin-x compensa el desplazamiento del panel de 200vw sobre\n   .dahmer-photo-stage para que la imagen se perciba fija bajo la cortina,\n   aunque vive DENTRO del panel — no es position:fixed global como el\n   patrón B. .dahmer-cover no tiene animación propia: sale hacia la\n   izquierda por el movimiento normal del #track. Sin crossfade ni zoom;\n   #eo-cierre cubre con fondo opaco sólido, corte seco (el patrón G\n   queda para cambios de acto/paleta, no para este cierre interno). */<\u002Fpre>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;actoPreview&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;archivo&quot;, &quot;options&quot;: [&quot;archivo&quot;, &quot;folklore&quot;, &quot;forense&quot;, &quot;digital&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Preview&quot;}}\">\nclass Component extends DCLogic {\n  state = { line1: false, line2: false, acto: 'archivo' };\n\n  componentDidMount() {\n    setTimeout(() => this._setupObserver(), 0);\n  }\n\n  _setupObserver() {\n    if (this._io || typeof IntersectionObserver === 'undefined') return;\n    const el = document.getElementById('reveal-demo-box');\n    if (!el) return;\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (entry.isIntersecting && !this.state.line1) {\n          this.setState({ line1: true });\n          setTimeout(() => { this.setState({ line2: true }); }, 90);\n        }\n      });\n    }, { threshold: 0.35 });\n    this._io.observe(el);\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n  }\n\n  renderVals() {\n    const actos = {\n      archivo: { label: 'Acto 1 · Archivo/prensa', bg: '#16110F', text: '#EFE7D8', accent: '#B83B2E' },\n      folklore: { label: 'Acto 2 · Folklore', bg: '#D9CBA3', text: '#2B2419', accent: '#6B4226' },\n      forense: { label: 'Acto 3 · Forense', bg: '#100A14', text: '#F2E9EE', accent: '#E63E9C' },\n      digital: { label: 'Acto 4 · Digital/IA', bg: '#060B08', text: '#D6F5DE', accent: '#33D17A' },\n    };\n    const a = actos[this.props.actoPreview || this.state.acto] || actos.archivo;\n\n    return {\n      line1Opacity: this.state.line1 ? 1 : 0,\n      line1Y: this.state.line1 ? 0 : 40,\n      line2Opacity: this.state.line2 ? 1 : 0,\n      line2Y: this.state.line2 ? 0 : 40,\n      replay: () => {\n        this.setState({ line1: false, line2: false });\n        setTimeout(() => { this.setState({ line1: true }); }, 50);\n        setTimeout(() => { this.setState({ line2: true }); }, 140);\n      },\n      actoLabel: a.label,\n      actoBg: a.bg,\n      actoText: a.text,\n      actoAccent: a.accent,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
