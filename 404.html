  :root { --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #b8b8b8; color: #000; display: flex; flex-direction: column;
    font: 13px/1.5 "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .menubar {
    height: 22px; flex: none; background: repeating-linear-gradient(0deg, #fff 0px, #fff 1px, #ddd 2px);
    border-bottom: 1px solid #000; display: flex; align-items: center; padding: 0 8px; font-size: 13px; font-weight: bold;
  }
  .menubar .cat-ico { display: block; margin-right: 10px; }
  .menubar .m-owner { margin-left: auto; font-weight: normal; color: rgba(0,0,0,.6); }
  @media (max-width: 520px) { .menubar .m-owner { display: none; } }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .win { width: min(560px, 100%); background: #ececec; border: 1px solid #000; box-shadow: 3px 3px 0 rgba(0,0,0,.45); }
  .title {
    height: 20px; border-bottom: 1px solid #000; display: flex; align-items: center; padding: 0 4px; gap: 6px;
    background: repeating-linear-gradient(0deg, #fff 0px, #fff 1px, #99b8e8 2px);
  }
  .title .box { width: 13px; height: 13px; border: 1px solid #000; background: #fff; flex: none; }
  .title .t { flex: 1; text-align: center; font-size: 12px; font-weight: bold; background: #ECECEC; padding: 0 6px; margin-right: 19px; }
  .body { padding: 28px 24px 30px; text-align: center; }
  .cat { width: min(340px, 78%); height: auto; display: block; margin: 0 auto 8px; overflow: visible; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .cat .in { transform-box: fill-box; transform-origin: 50% 100%; animation: enter .9s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes enter { 0% { transform: translateY(-40px) scale(.6,1.3); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; opacity: 1; } }
  .cat.shake .in { animation: shake .5s steps(2) 1; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-.4px) rotate(-2deg); } 75% { transform: translateX(.4px) rotate(2deg); } }
  .cat .head { transform-box: fill-box; transform-origin: 50% 100%; animation: sob 2.4s ease-in-out 1s infinite; }
  @keyframes sob { 0%,70%,100% { transform: none; } 78% { transform: translateY(.35px) scaleY(.97); } 86% { transform: translateY(0); } 92% { transform: translateY(.3px) scaleY(.98); } }
  .blink { fill: #111; transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: blink 3.6s steps(1) 1.2s infinite; }
  @keyframes blink { 0%,92% { transform: scaleY(0); } 94%,97% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
  .tear { fill: #8fb4ec; animation: drop 1.8s steps(5) 0.9s infinite both; }
  .tear.b { animation-delay: 1.8s; }
  @keyframes drop { 0% { transform: translateY(0); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(5px); opacity: 0; } }
  .burst { fill: #8fb4ec; animation: burst .9s ease-in forwards; }
  @keyframes burst { 0% { transform: translate(0,0); opacity: 1; } 100% { transform: translate(var(--dx), 12px); opacity: 0; } }
  .puddle { fill: #8fb4ec; opacity: .55; transform-box: fill-box; transform-origin: 50% 50%; transform: scaleX(var(--p, .7)); transition: transform .6s cubic-bezier(.2,1.4,.4,1); animation: pud 20s linear 1.2s both; }
  @keyframes pud { from { scale: 1; } to { scale: 1.25 1; } }
  .num { font-family: "MonacoCS", var(--mono); font-size: clamp(44px, 12vw, 64px); font-weight: bold; letter-spacing: .08em; margin: 6px 0 0; line-height: 1; display: flex; justify-content: center; }
  .num span { display: inline-block; animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  .num span:nth-child(1) { animation-delay: .5s; } .num span:nth-child(2) { animation-delay: .65s; } .num span:nth-child(3) { animation-delay: .8s; }
  .num span:hover { transform: translateY(-4px) rotate(-6deg); transition: transform .15s; }
  @keyframes pop { 0% { transform: translateY(24px) scale(.3); opacity: 0; } 100% { transform: none; opacity: 1; } }
  h1, p, .btn { animation: fade .6s ease-out 1.1s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hint { font-family: var(--mono); font-size: 10px; margin: -10px 0 16px !important; animation-delay: 1.5s; }
  h1 { font-family: "ChicagoCS", Geneva, sans-serif; font-size: 16px; font-weight: normal; margin: 10px 0 4px; }
  p { margin: 0 0 18px; color: rgba(0,0,0,.7); }
  .btn {
    font: inherit; font-size: 12px; font-weight: bold; padding: 5px 12px; border: 1px solid #000; background: #ddd; color: #111;
    text-decoration: none; display: inline-block; cursor: pointer;
  }
  .btn:hover { background: #cfcfcf; } .btn:active { background: #bbb; }
  .btn:focus-visible { outline: 2px solid #2b5fd6; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .blink { transform: scaleY(0); } }
</style>

<main>
  <div class="win" role="main">
    <div class="title"><span class="box"></span><span class="t">404.html</span></div>
    <div class="body">
      <svg class="cat" id="cat" viewBox="0 0 15 17" shape-rendering="crispEdges" role="img" aria-label="Gato pixelado llorando. Acaríciale, está triste.">
        <g class="in"><g class="head">
        <path d="M0 0h1v1h-1zM14 0h1v1h-1zM0 1h2v1h-2zM13 1h2v1h-2zM0 2h3v1h-3zM12 2h3v1h-3zM0 3h15v1h-15zM0 4h3v1h-3zM5 4h5v1h-5zM12 4h3v1h-3zM0 5h3v1h-3zM5 5h5v1h-5zM12 5h3v1h-3zM0 6h15v1h-15zM0 7h15v1h-15zM0 8h3v1h-3zM12 8h3v1h-3zM0 9h4v1h-4zM5 9h5v1h-5zM11 9h4v1h-4zM1 10h13v1h-13zM2 11h11v1h-11z" fill="#111"/>
        <rect id="pl" x="3" y="4" width="1" height="1" fill="#111"/><rect id="pr" x="10" y="4" width="1" height="1" fill="#111"/>
        <rect class="blink" x="3" y="4" width="2" height="2"/><rect class="blink" x="10" y="4" width="2" height="2"/>
        <path class="tear" d="M3 6h1v2h-1z"/><path class="tear b" d="M11 6h1v2h-1z"/>
        <path class="tear b" d="M4 6h1v1h-1z"/><path class="tear" d="M10 6h1v1h-1z"/>
        </g>
        <path class="tear" d="M3 12h1v1h-1zM11 12h1v1h-1z"/>
        <g class="puddle" id="pud"><path d="M2 14h4v1h-4zM9 14h4v1h-4zM1 15h6v1h-6zM8 15h6v1h-6z"/></g>
        <g id="fx"></g></g>
      </svg>

      <p class="hint">// acaríciame, estoy triste</p>
      <a class="btn" href="/">Volver al escritorio</a>
    </div>
  </div>
</main>
<script>
(function () {
  var cat = document.getElementById("cat"), pl = document.getElementById("pl"), pr = document.getElementById("pr");
  var fx = document.getElementById("fx"), pud = document.getElementById("pud"), NS = "http://www.w3.org/2000/svg", clicks = 0;
  // Los ojos siguen al cursor (o al dedo), a saltos de píxel
  function look(e) {
    var r = cat.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * 0.3;
    var dx = e.clientX - cx, dy = e.clientY - cy;
    var x = Math.abs(dx) < r.width * 0.08 ? 0.5 : dx > 0 ? 1 : 0, y = dy > r.height * 0.1 ? 1 : 0;
    pl.setAttribute("x", 3 + (x > 0.5 ? 1 : 0)); pr.setAttribute("x", 10 + (x > 0.5 ? 1 : 0));
    pl.setAttribute("y", 4 + y); pr.setAttribute("y", 4 + y);
  }
  window.addEventListener("pointermove", look);
  // Al tocarlo: se estremece, llora a chorros y el charco crece
  cat.addEventListener("click", function () {
    cat.classList.remove("shake"); void cat.getBoundingClientRect(); cat.classList.add("shake");
    for (var i = 0; i < 8; i++) {
      var d = document.createElementNS(NS, "rect"), left = i % 2 === 0;
      d.setAttribute("class", "burst");
      d.setAttribute("x", left ? 3 : 11); d.setAttribute("y", 6); d.setAttribute("width", 1); d.setAttribute("height", 1);
      d.style.setProperty("--dx", (left ? -1 : 1) * (1 + Math.floor(Math.random() * 4)) + "px");
      d.style.animationDelay = (i * 0.06) + "s";
      fx.appendChild(d);
      setTimeout(function (n) { n.remove(); }.bind(null, d), 1400);
    }
    clicks++; pud.style.setProperty("--p", Math.min(0.7 + clicks * 0.08, 1.3));
  });
})();
</script>
