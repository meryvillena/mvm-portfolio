  /* ---------- GLOBO ---------- */
  .balloon {

/* ============================================================
   MOTOR DEL ESCRITORIO
   ============================================================ */
const desktop = document.getElementById("desktop");
let zTop = 100;
let trashEl = null;
const originalPos = {};
let trashedIds = [];

function clockTick() {
  const d = new Date();
  const days = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  let h = d.getHours(), ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  const m = String(d.getMinutes()).padStart(2, "0");
  document.getElementById("clock").textContent = days[d.getDay()] + " " + h + ":" + m + " " + ampm;
}
clockTick(); setInterval(clockTick, 1000);

function makeIcon(id, label, iconSrc, x, y) {
  originalPos[id] = { x, y };
  const el = document.createElement("button");
  el.className = "icon";
  el.style.left = x + "px"; el.style.top = y + "px";
  el.dataset.id = id;
  el.setAttribute("aria-label", label + " — abrir");
  el.innerHTML = '<img src="' + iconSrc + '" alt=""><span>' + label + "</span>";
  desktop.appendChild(el);

  let dragging = false, moved = false, offX = 0, offY = 0, downX = 0, downY = 0;
  el.addEventListener("mousedown", (e) => {
    e.stopPropagation();
    dragging = true; moved = false; downX = e.clientX; downY = e.clientY;
    const r = el.getBoundingClientRect();
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    el.classList.add("selected");
    document.querySelectorAll(".icon").forEach((i) => { if (i !== el) i.classList.remove("selected"); });
  });
  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    // Un temblor de ratón de pocos píxeles sigue siendo un clic, no un arrastre
    if (!moved && Math.abs(e.clientX - downX) < 5 && Math.abs(e.clientY - downY) < 5) return;
    moved = true; el.classList.add("dragging");
    el.style.left = (e.clientX - offX) + "px";
    el.style.top = (e.clientY - offY - 22) + "px";
  });
  document.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false; el.classList.remove("dragging");
    if (id !== "trash" && moved && trashEl) {
      const r = el.getBoundingClientRect();
      const tr = trashEl.getBoundingClientRect();
      const overlap = !(r.right < tr.left || r.left > tr.right || r.bottom < tr.top || r.top > tr.bottom);
      if (overlap) {
        el.style.display = "none";
        el.classList.remove("selected");
        if (!trashedIds.includes(id)) trashedIds.push(id);
        updateTrashIcon();
        // Micro-acción: la Papelera hace un meneíto al recibir algo.
        trashEl.classList.remove("wobble");
        void trashEl.offsetWidth;
        trashEl.classList.add("wobble");
        setTimeout(function () { trashEl.classList.remove("wobble"); }, 460);
      }
    }
  });
  // Un clic abre (y el doble clic también, porque abrir es idempotente).
  // Enter y Espacio disparan "click" en un <button>. Si el clic viene de soltar
  // un arrastre, no abre nada.
  el.addEventListener("click", (e) => {
    e.stopPropagation();
    if (moved) { moved = false; return; }
    openWindow(id, el);
  });

  // ---- Soporte táctil (móvil): tocar abre; arrastrar rebota (comeback);
  //      soltar sobre la Papelera lo tira. La Papelera no se arrastra.
  let tStartX = 0, tStartY = 0, tMoved = false, tDragging = false;
  el.addEventListener("touchstart", (e) => {
    if (id === "trash") return;
    const t = e.touches[0];
    tStartX = t.clientX; tStartY = t.clientY; tMoved = false; tDragging = true;
    el.style.transition = "none"; el.style.zIndex = ++zTop;
  }, { passive: true });
  el.addEventListener("touchmove", (e) => {
    if (!tDragging) return;
    const t = e.touches[0];
    const dx = t.clientX - tStartX, dy = t.clientY - tStartY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) { tMoved = true; el.classList.add("dragging"); }
    el.style.transform = "translate(" + dx + "px," + dy + "px)";
    if (tMoved) e.preventDefault();
  }, { passive: false });
  el.addEventListener("touchend", (e) => {
    if (!tDragging) return;
    tDragging = false; el.classList.remove("dragging");
    if (!tMoved) { el.style.transform = ""; el.style.transition = ""; openWindow(id, el); return; }
    const t = e.changedTouches[0];
    const trIcon = document.querySelector('.icon[data-id="trash"]');
    let thrown = false;
    if (trIcon) {
      const tr = trIcon.getBoundingClientRect();
      thrown = t.clientX >= tr.left && t.clientX <= tr.right && t.clientY >= tr.top && t.clientY <= tr.bottom;
    }
    if (thrown) {
      el.style.transition = "transform .18s ease, opacity .18s ease";
      el.style.transform = "scale(0.25)"; el.style.opacity = "0";
      setTimeout(() => {
        el.style.display = "none"; el.style.transform = ""; el.style.opacity = ""; el.style.transition = "";
        if (!trashedIds.includes(id)) trashedIds.push(id);
        updateTrashIcon();
      }, 180);
      trIcon.classList.remove("wobble"); void trIcon.offsetWidth; trIcon.classList.add("wobble");
      setTimeout(() => trIcon.classList.remove("wobble"), 460);
    } else {
      // COMEBACK: rebote elástico a su sitio
      el.style.transition = "transform .3s cubic-bezier(.34,1.56,.64,1)";
      el.style.transform = "translate(0,0)";
      setTimeout(() => { el.style.transition = ""; el.style.transform = ""; }, 320);
    }
  }, { passive: false });

  return el;
}

// Cambia el icono de la Papelera entre vacía y llena según lo que contenga.
function updateTrashIcon() {
  const img = document.querySelector('.icon[data-id="trash"] img');
  if (img) img.src = trashedIds.length ? ICONS.trashFull : ICONS.trashEmpty;
}

function restoreAll() {
  trashedIds.forEach((id) => {
    const el = document.querySelector('.icon[data-id="' + id + '"]');
    const pos = originalPos[id];
    if (el && pos) { el.style.display = "flex"; el.style.left = pos.x + "px"; el.style.top = pos.y + "px"; }
  });
  trashedIds = [];
  updateTrashIcon();
}

function showTrashBalloon(tx, ty) {
  // En móvil el popup de bienvenida ya explica la Papelera → no mostramos el globo.
  if (window.innerWidth <= 760) return;
  const b = document.createElement("div");
  b.className = "balloon";
  b.style.left = Math.max(8, tx - 190) + "px";
  b.style.top = (ty - 92) + "px";
  b.innerHTML = '<span class="balloon-close" role="button" tabindex="0">✕</span>Si un proyecto no te gusta, arrástralo aquí. Clic en la Papelera y todo vuelve a su lugar.';
  desktop.appendChild(b);
  requestAnimationFrame(() => b.classList.add("show"));
  const remove = () => { b.classList.remove("show"); setTimeout(() => b.remove(), 300); };
  b.querySelector(".balloon-close").addEventListener("click", (e) => { e.stopPropagation(); remove(); });
  setTimeout(remove, 9000);
}

function makeWindow(id, title, iconSrc, contentHtml, x, y, w) {
  const el = document.createElement("div");
  el.className = "window"; el.id = "win-" + id;
  el.style.left = x + "px"; el.style.top = y + "px"; el.style.width = (w || 380) + "px";
  el.setAttribute("role", "dialog"); el.setAttribute("aria-labelledby", "wt-" + id);
  el.innerHTML =
    '<div class="titlebar">' +
      '<div class="box close" role="button" tabindex="0" aria-label="Cerrar ' + title.replace(/"/g, "&quot;") + '">×</div>' +
      '<div class="title" id="wt-' + id + '">' + (iconSrc ? '<img src="' + iconSrc + '" style="height:12px;vertical-align:-2px;margin-right:4px;" alt="">' : "") + title + "</div>" +
      '<div class="box zoom" aria-hidden="true"></div>' +
    "</div>" +
    '<div class="content">' + contentHtml + "</div>";
  desktop.appendChild(el);

  const closeBtn = el.querySelector(".close");
  const doClose = (e) => {
    if (e) e.stopPropagation();
    el.classList.add("closing");
    setTimeout(() => { if (el.classList.contains("closing")) el.classList.remove("open", "closing"); }, 150);
    // Devolver el foco a quien abrió la ventana (si sigue ahí y se ve)
    const op = openers[id];
    if (op && document.body.contains(op) && op.offsetParent !== null) op.focus();
    delete openers[id];
  };
  el._close = doClose;
  el.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); doClose(e); } });
  closeBtn.addEventListener("click", doClose);
  closeBtn.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); doClose(e); } });

  el.addEventListener("mousedown", () => focusWindow(id));

  const titlebar = el.querySelector(".titlebar");
  let dragging = false, offX = 0, offY = 0;
  titlebar.addEventListener("mousedown", (e) => {
    if (e.target.classList.contains("box")) return;
    dragging = true;
    const r = el.getBoundingClientRect();
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    focusWindow(id);
  });
  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    el.style.left = (e.clientX - offX) + "px";
    el.style.top = Math.max(24, e.clientY - offY) + "px";
  });
  document.addEventListener("mouseup", () => { dragging = false; });
  return el;
}

// Escape cierra la ventana que está al frente (salvo que haya un menú o la bienvenida abiertos: ellos cierran lo suyo primero)
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.defaultPrevented) return;
  if (document.querySelector("#welcome.show") || document.querySelector('#menubar [aria-expanded="true"]')) return;
  const w = document.querySelector(".window.open.focused:not(.closing)");
  if (w && w._close) w._close(e);
});

function focusWindow(id) {
  const el = document.getElementById("win-" + id); if (!el) return;
  document.querySelectorAll(".window").forEach((w) => w.classList.remove("focused"));
  el.classList.add("focused"); el.style.zIndex = ++zTop;
}

const openers = {};
// ¿La última interacción fue con el teclado? Solo entonces movemos el foco dentro de la ventana
// (con ratón o dedo no hace falta y se vería un aro azul de foco sin motivo).
let usandoTeclado = false;
document.addEventListener("keydown", () => { usandoTeclado = true; }, true);
["mousedown", "touchstart", "pointerdown"].forEach((ev) => document.addEventListener(ev, () => { usandoTeclado = false; }, true));
function openWindow(id, opener) {
  const el = document.getElementById("win-" + id);
  if (!el) return;
  const yaAbierta = el.classList.contains("open") && !el.classList.contains("closing");
  el.classList.remove("closing");
  el.classList.add("open"); focusWindow(id);
  if (!yaAbierta) {
    const from = opener || document.activeElement;
    if (from && from !== document.body) openers[id] = from;
  }
  // Llevar el foco al botón de cerrar de la ventana (solo si el teclado está en juego)
  const cb = el.querySelector(".close");
  if (cb && usandoTeclado) cb.focus({ preventScroll: true });
}

/* ============================================================
   CONSTRUCCIÓN DEL ESCRITORIO
   ============================================================ */
let iy = 40;
const colX = () => Math.max(120, window.innerWidth - 120);

DESKTOP.forEach((item) => {
  makeIcon(item.id, item.title, item.icon, colX(), iy);
  if (item.kind === "folder") {

    makeWindow(item.id, item.title, item.icon, html, 120 + Math.random() * 80, 80 + Math.random() * 70, 430);

function caseSpotifyHtml() {
  return `<div class="cs-toolbar">
      <div class="cs-tfont">Chicago&nbsp;▾</div>
      <div class="cs-sep"></div>
      <img class="cs-tibtn" src="${CS_ICONS.bold}" alt="Negrita">
      <img class="cs-tibtn" src="${CS_ICONS.italic}" alt="Cursiva">

      <div class="cs-sep"></div>
      <img class="cs-tibtn" src="${CS_ICONS.alignL}" alt="Alinear izquierda">
      <img class="cs-tibtn" src="${CS_ICONS.alignC}" alt="Centrar">
      <img class="cs-tibtn" src="${CS_ICONS.alignR}" alt="Alinear derecha">
    </div>
    <div class="cs-ruler"><span class="cs-mk l"></span><span class="cs-mk r"></span></div>
    <div class="cs-paper">
      <div class="cs-cta-row"><a class="btn" href="spotify/index.html" target="_blank" rel="noopener">Ver la maqueta en vivo →</a></div>
      <h2 class="cs-title">Spotify Now Playing</h2>
      <p class="cs-sub">Descubre clubs por su música en tiempo real</p>
      <div class="cs-meta">Exploración de producto · concepto&nbsp;&nbsp;·&nbsp;&nbsp;Julio 2026&nbsp;&nbsp;·&nbsp;&nbsp;Figma · Spotify API · Prototipo interactivo</div>
      <figure class="cs-fig"><img src="spotify/capturas/00-portada.jpg" width="1600" height="1000" alt="Tres pantallas de la demo: clubs cerca de ti, ficha de Sala Bardot y cola compartida" loading="lazy"><figcaption>Clubs cerca de ti con su % Match, la ficha del club y la cola compartida dentro de la sala.</figcaption></figure>

      <h3>El insight</h3>
      <p>Cuando entras a un bar nuevo, lo primero que percibes —antes que la carta, la decoración o la gente— es la música. En tres segundos decides si ese sitio va contigo. Ninguna plataforma de descubrimiento captura eso: Google Maps, Instagram y Foursquare muestran datos fríos. <strong>La música es el indicador más honesto del ambiente de un local, y nadie lo está aprovechando digitalmente.</strong></p>
      <p>Este insight no viene de una tendencia de diseño. Viene de años trabajando en hostelería y gestión de operaciones, donde aprendí algo más: un hostelero no compra tecnología porque sea bonita — la compra si entiende en cinco minutos cómo le hace ganar o retener clientes.</p>

      <h3>De jukebox a mapa: el pivot</h3>
      <p>La idea original era una jukebox social: un tótem en el bar donde los clientes ponen música de forma colectiva pagando una microtarifa. El valor era la retención — nadie se va del bar si su canción suena en 10 minutos.</p>
      <p>Antes de seguir diseñando, analicé la viabilidad y encontré tres barreras estructurales: el hardware exige una red de <em>field service</em> que Spotify no tiene ni quiere (descontinuó el Car Thing en 2022), las licencias de streaming personal no cubren la reproducción pública en locales, y una transacción de 0,10 € no soporta las comisiones de pasarela.</p>
      <p>Pero el problema de fondo era otro: <strong>la jukebox resuelve el problema del bar, no el del usuario. El usuario no quiere poner una canción — quiere encontrar un sitio donde quiera estar.</strong> Ese insight fue el pivot.</p>

      <h3>La solución</h3>
      <p>Una pestaña nativa en Spotify con un mapa en tiempo real de los locales cercanos y lo que suena en cada uno. Dos modos del mismo producto:</p>
      <div class="cs-pair"><figure class="cs-fig"><img src="spotify/capturas/01-inicio.jpg" width="600" height="1298" alt="Pantalla de inicio de Spotify con la entrada a Clubs" loading="lazy"><figcaption>Entrada desde Inicio: «Clubs» es una pestaña más, no una app aparte.</figcaption></figure><figure class="cs-fig"><img src="spotify/capturas/04-unirse-jam.jpg" width="600" height="1298" alt="Pantalla para unirse a la Jam del club" loading="lazy"><figcaption>Dentro del local: escaneas el QR y te unes a la Jam.</figcaption></figure></div>
      <p><strong>Descubrimiento (antes de entrar).</strong> Cada local muestra la canción exacta que suena ahora, el historial de las últimas 2 horas y un <strong>% Match</strong> calculado cruzando tu historial de escucha con el hilo musical del bar. Eliges el club por su ambiente antes de cruzar la puerta.</p>
      <p><strong>Participación (ya dentro).</strong> Escaneas el QR del local y entras en la cola compartida: ves qué suena, qué viene después y quién lo pincha, y puedes añadir hasta 5 canciones tuyas — siempre dentro del ADN musical que el local permite.</p>
      <p><strong>Panel B2B (el local).</strong> El hostelero mantiene el control editorial: define los géneros permitidos, elimina o veta canciones de la cola y configura cada cuánto puede repetirse un tema. A cambio ve el ROI en directo: personas viendo su ficha, pulsaciones de «cómo llegar», match medio de quien está dentro y los temas que más han conectado esa noche.</p>
      <figure class="cs-fig"><img src="spotify/capturas/06-panel-local.jpg" width="1300" height="1460" alt="Panel del local: género permitido, cola de la sala y repetición de temas" loading="lazy"><figcaption>El panel del local: ADN musical permitido, cola moderable, temas que más conectan y control de repetición.</figcaption></figure>

      <h3>Decisiones de diseño clave</h3>
      <p><strong>Historial de 2 horas, no más.</strong> Suficiente para validar la línea editorial del local sin contaminar con el contexto de la tarde. Además demuestra consistencia: valida que el Match es estructural, no casual.</p>
      <p><strong>El pin del mapa codifica género, no distancia.</strong> El género es la variable de decisión; la distancia se infiere del propio mapa. Y el % Match va en el pin, no solo en la ficha: el usuario decide sin tener que abrir 14 locales.</p>
      <p><strong>El CTA principal es «guardar canción», no «comprar entrada».</strong> La conversión nocturna de tickets de 50 € es baja; el guardado es instantáneo, emocional y sin fricción. La entrada existe, pero como paso secundario.</p>
      <p><strong>No inventar infraestructura que ya existe.</strong> Spotify Connect para la reproducción, la cuenta de Spotify como autenticación, Apple Pay para pagos. No diseñé un producto nuevo: diseñé el tejido conectivo entre ecosistemas que ya tienen masa crítica.</p>

      <h3>Modelo de negocio</h3>
      <p>Tres fases: gratuito para locales con cuenta comercial (construir el efecto red), suscripción SaaS con perfil verificado y panel de analítica (el ROI visible justifica la cuota), y promoción premium segmentada por % Match (una sala puede destacar su sesión de house en el feed de usuarios cercanos que escuchan house). El activo real del modelo son <strong>los datos</strong>: qué se escucha en qué barrios, a qué hora y con qué correlación con asistencia a eventos — un <em>data layer</em> entre el ocio nocturno y la industria musical.</p>

      <div class="cs-cta-row bottom"><a class="btn" href="spotify/index.html" target="_blank" rel="noopener">Ver la maqueta en vivo →</a></div>
    </div>`;
}

      <h2 class="cs-title">Respira</h2>

      <div class="cs-meta">Exploración de producto · concepto&nbsp;&nbsp;·&nbsp;&nbsp;Octubre 2026&nbsp;&nbsp;·&nbsp;&nbsp;Diseño y desarrollo · HTML/JS · todo en el navegador</div>

      ${fig("01-portada", "Pantalla de inicio de Respira: una luna de color lavanda y tres accesos", "La pantalla de inicio: una luna y tres caminos.")}

      <h3>Por qué la hice</h3>
      <p>Todo va un poco más rápido, y la IA también ha acelerado mi forma de trabajar. Quería hacer algo que fuera lo contrario: abrir, respirar cinco minutos y cerrar.</p>
      <p>Respira no pide cuenta, ni suscripción, ni lleva anuncios. Es además la forma más directa que tengo de enseñar cómo trabajo: un producto pequeño, terminado, que cualquiera puede abrir desde el móvil.</p>

      <h3>Qué hace</h3>
      <p>Tiene tres caminos desde el inicio:</p>
      <ul class="cs-list">
        <li><strong>¿Qué te pide el cuerpo?</strong> Dos preguntas y la app propone una respiración.</li>
        <li><strong>Técnicas.</strong> Diez formas de respirar, cada una explicada paso a paso, con la duración que tú elijas.</li>
        <li><strong>Tu cielo.</strong> Cada sesión enciende una estrella.</li>
      </ul>
      ${fig("02-test-ficha-sesion", "Tres pantallas: el test, la ficha de la técnica Suspiro y la sesión en marcha", "Del test a la sesión: elegir lo que necesitas, ajustar la duración y empezar.")}

      <h3>Una luna en lugar de un cronómetro</h3>
      <p>Durante la sesión casi no hay texto que leer. Una luna crece al inhalar y se encoge al soltar el aire, y debajo aparece una frase corta, como «Suelta por la boca».</p>
      <p>En las técnicas que alternan fosas nasales, la pantalla muestra dos lunas. Al final, la luna vuelve a su sitio y la app dice «Vuelve despacio».</p>
      ${fig("03-pausa-lunas-final", "Tres momentos de una sesión: pausa, dos lunas y cierre", "Pausa, dos lunas para alternar fosas nasales y el cierre.")}

      <h3>Cómo se decidió</h3>
      <p><strong>Quité los «viajes».</strong> La primera versión tenía recorridos temáticos. No les encontraba sentido y les faltaba trabajo de UX. La app se quedó con el test y las técnicas, y mejoró.</p>
      <p><strong>Un solo color.</strong> Lavanda por defecto. Se cambia únicamente en Ajustes, para que la pantalla de respirar no compita con nada. No hay botón de play: se empieza tocando la luna.</p>
      <p><strong>Las técnicas avanzadas están bloqueadas.</strong> El Viaje del Chamán y El Despertar de la Kundalini se abren con 3 y 6 horas de práctica acumulada. Al desbloquearlas, la app explica qué hacen y por qué pueden marear, y pide marcar una casilla antes de empezar.</p>
      ${fig("04-avanzadas", "Lista de técnicas con las avanzadas bloqueadas, y la ficha de El Viaje del Chamán con su aviso", "Las avanzadas, con su progreso y su aviso de seguridad.")}
      <p><strong>Tu cielo es mi respuesta al scroll.</strong> Quería competir con Instagram con una gamificación suave. Cada respiración añade una estrella y las estrellas acaban formando constelaciones. Todo se guarda solo en el dispositivo.</p>
      ${fig("05-tu-cielo", "Pantalla de cierre de sesión, pantalla de Tu cielo y pantalla de inicio con constelaciones", "Cada sesión enciende una estrella nueva.")}

      <h3>Cómo está hecha</h3>
      <p>Es una sola página HTML, CSS y JavaScript, sin servidor ni base de datos. La luna se dibuja en el navegador y los datos de Tu cielo se quedan en el móvil de quien la usa. Se puede compartir con un enlace y, en los móviles que lo permiten, instalar.</p>

      <h3>Pruébala</h3>
      <p>Ábrela desde el móvil si puedes. Con tres minutos te da tiempo a hacer una sesión.</p>

      <h2 class="cs-title">Presupuestar sin echar la tarde</h2>
      <p class="cs-sub">Diseñé y construí una herramienta para que un instalador de ventanas de Madrid prepare en unos 10 minutos lo que antes le llevaba cerca de una hora. Con su marca, su margen y sin que el PDF salga de su dispositivo.</p>

      <h3>El problema</h3>
      <p>Cada presupuesto empezaba con otro: el PDF de su fabricante, con ventanas, medidas, planos y precios de coste. Para enviárselo al cliente, borraba el logo y cambiaba los precios uno a uno, sentado al ordenador. A veces quedaba algún dato que revelaba quién fabricaba las ventanas.</p>

      <h3>Qué hace</h3>
      <p>Abre el PDF y la herramienta extrae las ventanas, sus medidas, descripciones y planos. Aplica un margen general o por ventana y permite corregir textos, precios y medidas sobre el propio documento, también desde el móvil, en la obra.</p>
      <p>De ese trabajo salen dos archivos:</p>
      ${fig("08-pdf-generado", "El PDF que recibe el cliente", "El PDF para el cliente: marca propia, precios de venta y planos, sin datos del fabricante.")}
      ${fig("09-copia-excel", "La copia en Excel con costes y márgenes", "El Excel del instalador: costes, márgenes y lo que gana.")}
      <p>El Excel, junto con el PDF original, permite recuperar el presupuesto otro día y seguir donde lo dejó.</p>

      <h3>Cómo se decidió</h3>
      <p>No le prometí que leyera bien todos los PDF del mundo. Le prometí que <strong>nunca le daría un presupuesto mal sin avisarle</strong>.</p>
      <p>La herramienta suma los importes extraídos y los compara con la base imponible del fabricante. Si coinciden, muestra «Cuentas comprobadas». Si no, señala la diferencia y, cuando puede, qué revisar: una ventana sin precio o un salto en la numeración. Permite corregir y continuar; cuando las cuentas cuadran, el aviso pasa a verde.</p>
      <p>Esta comprobación detectó dos errores de dinero que las pruebas anteriores no habían encontrado.</p>
      <p>También descarté dos opciones:</p>
      <ul class="cs-list">
        <li><strong>Leer los PDF con una IA externa.</strong> Podía facilitar la lectura de más formatos, pero exigía enviar los documentos fuera. Y que no salgan es parte de lo que el instalador ofrece: los precios de su fabricante no los ve nadie más.</li>
        <li><strong>Detectar automáticamente todas las medidas de los planos.</strong> El prototipo encontraba un tercio de los números e interpretaba algunos incorrectamente. Lo sustituí por una corrección manual: tocar la medida y escribir la buena.</li>
      </ul>

      <h3>En uso</h3>
      <p>El instalador la utiliza desde septiembre de 2026 para todos sus presupuestos: diez o más por semana.</p>
      <p>Según sus estimaciones, ha pasado de cerca de una hora a unos 10 minutos por presupuesto. Con diez semanales, son unas ocho horas recuperadas: <strong>una jornada entera cada semana</strong>.</p>
      <p>Siete presupuestos reales de tres fabricantes y más de 370 comprobaciones automáticas ayudan a revisar cada cambio. La demo tiene además una comprobación para evitar que se publiquen datos reales.</p>

      <h3>Pruébala</h3>
      <p>Recorre la herramienta en dos minutos con un presupuesto de ejemplo. Luz Norte y Korvel Systems son nombres inventados para esta demo. No se sube ni se descarga nada: los documentos se muestran en pantalla.</p>
      ${fig("12-recorrido-margen", "El recorrido guiado señalando el margen", "Ajusta el margen y mira cuánto queda para el instalador.")}

      <div class="cs-cta-row bottom"><a class="btn" href="${DEMO}" target="_blank" rel="noopener">Abrir la demo →</a></div>
    </div>`;
}

    <div class="cs-ruler"><span class="cs-mk l"></span><span class="cs-mk r"></span></div>
    <div class="cs-paper">
      <div class="cs-cta-row"><a class="btn" href="${DEMO}" target="_blank" rel="noopener">Abrir la demo →</a></div>
      <h2 class="cs-title">Una pizzería que le gana margen a las apps de reparto</h2>
      <p class="cs-sub">Diseñé y construí el canal de pedido directo de una pizzería de barrio: una web solo para recoger y el panel del turno. El objetivo, que el local se quede con más de cada pizza en vez de regalarle el 30 % a las apps de reparto. El negocio es inventado; el problema, no.</p>
      <div class="cs-meta">Soluciones de negocio · concepto&nbsp;&nbsp;·&nbsp;&nbsp;Agosto–octubre 2026&nbsp;&nbsp;·&nbsp;&nbsp;Estrategia, UX, copy, identidad y prototipo · HTML/JS</div>

      <h3>El problema</h3>
      <p>Partí de una pizzería pequeña que conozco en Lavapiés: buena reputación, cola en la puerta y dos personas dentro. No le faltan clientes. Le falta margen, porque una parte de sus pedidos llega por las apps de reparto.</p>
      <p>Con una comisión del 30 %, una pizza de 12 € deja unos 3 € de margen si se pide por la app y unos 7 € si el cliente la recoge en el local.</p>
      <p>Vender más no era la respuesta. Con un horno y dos personas, más pedidos solo alargan la espera. La pregunta era otra: <strong>cómo ganar más con los mismos pedidos sin colapsar el horno</strong>. Y la cola daba la pista: es demanda sin programar.</p>
      <p><em>Las cifras son una simulación con comisión del 30 %, coste de producto del 30 % y envase estimado. No son las cuentas de ningún local.</em></p>

      <h3>Qué hace</h3>
      <p>Son dos pantallas sobre el mismo sistema. En la web, el cliente ve la carta del día, llena su caja, elige la hora de recogida y sigue el pedido hasta que está listo. Paga al recoger: la web no cobra nada.</p>
      ${fig("01-web", "La portada de la web de Puti Di Madre, con el indicador del horno", "La web: la voz de la marca y, desde la portada, cuánto aguanta el horno.")}
      <p>En el panel del turno, el local ve la carga del horno de los próximos cuartos de hora y mueve los pedidos. Desde ahí también marca agotados, pausa la web y cambia precios, descuentos y horario. Lo que se cambia en el panel aparece en la web al recargar.</p>
      ${fig("02-panel", "El panel del turno, con la carga del horno y los pedidos por estado", "El panel del turno: carga del horno y pedidos, sin la marca.")}

      <h3>Cómo se decidió</h3>
      <p><strong>La web solo ofrece horas que el horno puede cumplir.</strong> La capacidad del horno se reparte en franjas de quince minutos. Una pizza consume una unidad; un calzone, una y media; una bebida, un cuarto, porque alguien tiene que cogerla y meterla en la bolsa. Cada franja admite seis unidades y la web solo puede reservar una parte: tres en hora punta, para no dejar sin pizza a quien espera en la puerta.</p>
      <p>Un pedido no se parte entre franjas: si no cabe entero, se ofrece la siguiente. Por eso, además de «Horno lleno», existe «No cabe tu pedido».</p>
      <div class="cs-pair">
        ${fig("03-franjas-punta", "Selector de hora en hora punta, con franjas casi llenas y una llena", "Un viernes a las 20:40: las 22:15 están llenas y las 21:30 y 21:45, casi.")}
        ${fig("04-franjas-valle", "Selector de hora a las 18:30, con descuentos en las primeras franjas", "A las 18:30: las horas más vacías llevan descuento.")}
      </div>
      <p><strong>Las promos mueven pedidos, no bajan precios.</strong> Un descuento general llenaría el horno con menos margen, justo lo contrario de lo que busca el proyecto. Por eso toda promo lleva condición: un 10 % de 19:00 a 19:45, cuando el horno acaba de arrancar, y un 5 % hasta las 20:15. En hora punta, nada. La caja solo anuncia el descuento si queda alguna hora que lo tenga.</p>
      <p>La fidelización va en una cartilla de cartón que se sella al recoger, sin cuentas ni datos guardados. Al séptimo pedido se regala la bolsa de tela de la casa y no una pizza: regalar pizza en hora punta es regalar justo lo que falta.</p>
      <p><strong>El panel no lleva la marca.</strong> La web tiene voz, ilustraciones y tipografía de cartel. El panel es blanco y negro, sin nada de eso: es una herramienta para un viernes a las nueve, y lo que importa es ver de un vistazo qué entra al horno. Saber cuándo no aplicar la identidad también es diseñar.</p>
      <p>Dejé fuera de esta versión el pago online, las cuentas de cliente y el reparto propio. El reparto sigue en las apps, para quien vive lejos.</p>

      <h3>Hasta dónde llego</h3>
      <p>El prototipo funciona entero en el navegador y tiene más de 300 comprobaciones automáticas. Para recibir pedidos reales hace falta un servidor: base de datos, reservas de franja sin duplicados, acceso al panel con contraseña y alguien que responda si algo falla.</p>
      <p>Esa parte no la asumo sola. <strong>Hay una diferencia entre escribir código y responder de un sistema</strong> un viernes a las 21:30 con quince pedidos en marcha. La dejé documentada para un perfil de backend: entre 40 y 70 horas, unos 2.000–4.000 € orientativos.</p>
      <p>Mientras tanto, hay dos versiones que sí puedo sostener:</p>
      <ul class="cs-list">
        <li><strong>Sin servidor.</strong> La misma web, con el pedido saliendo por WhatsApp con el mensaje ya escrito. No cuesta nada, pero la disponibilidad es orientativa: si en hora punta dos personas piden la misma franja, el local lo resuelve a mano.</li>
        <li><strong>Con una plataforma de pedidos.</strong> Marca, carta y experiencia propias sobre un motor ya hecho, por algo más de un 4 % por pedido. Se pierde control sobre la lógica del horno.</li>
      </ul>
      <p>Lo sensato es empezar por una de las dos, medir unos meses y pagar el servidor con lo que se ahorre en comisiones.</p>

      <h3>Pruébala</h3>
      <p>Pide una pizza y elige hora. Después abre el panel desde la barra de arriba, cambia un precio o marca algo agotado, y recarga la web. La demo empieza un viernes por la noche; el panel de demo permite cambiar el día y la hora.</p>
      <div class="cs-pair">
        ${fig("05-confirmacion", "Pantalla de pedido confirmado con hora y dirección de recogida", "La confirmación: a qué hora y dónde.")}
        ${fig("06-seguimiento", "Pantalla de seguimiento del pedido por pasos", "El seguimiento, hasta que está lista.")}
      </div>
      <p>Puti Di Madre, sus reseñas, sus fotos y las dos personas de «Quiénes somos» son inventadas. No se envía ni se guarda nada.</p>

      <div class="cs-cta-row bottom"><a class="btn" href="${DEMO}" target="_blank" rel="noopener">Abrir la demo →</a></div>
    </div>`;
}

      <h3>Empezó en el Mac de mi tía Elvira</h3>
      <p>Antes de saber qué era un “sistema de diseño”, ya usaba uno sin enterarme. De pequeña, mi tía Elvira me sentaba delante de su Macintosh y me enseñaba a mover el ratón: clic, arrastrar, soltar. Carpetas que se abrían, una papelera que devolvía lo que tirabas, iconos que hacían justo lo que prometían. Me parecía magia, pero en realidad era orden. Creo que ahí, sin darme cuenta, empecé a querer el diseño.</p>

      <h3>Una conexión que me hizo ilusión</h3>
      <p>Leyendo sobre sistemas de diseño me topé con algo bonito: aunque el término es reciente, su raíz es antigua — las <em>Human Interface Guidelines</em> de Apple (1987), hechas para el Mac. Consistencia, componentes que se repiten, cuidar a quien lo usa. Me hizo ilusión pensar que aquello que me enseñaba mi tía y lo que intento hacer ahora vienen del mismo sitio. Así que, cuando tocó montar mi portfolio, tiré de ahí.</p>

      <h3>Por qué un escritorio</h3>
      <p>Podía hacer otra cuadrícula de proyectos, como todo el mundo. Pero me apetecía algo que se pareciera a mí y que me hiciera ilusión abrir. Un sitio para curiosear: carpetas por categoría, ventanas que abres, una papelera para tirar lo que no te guste (y recuperarlo). No sé si es lo más práctico del mundo, pero es honesto: si sabes usar un Mac, sabes usar esto.</p>

      <h3>Lo que hay por debajo</h3>
      <p>Aunque parezca un juego, intenté que por dentro fuera un sistema de verdad, no un adorno. Poco a poco fui atando lo básico: unos colores (el gris Platinum, uno por categoría), tres tipografías con su función —Chicago para titulares, Geneva para leer, Monaco para lo técnico— y piezas que se repiten (ventanas, tarjetas, botones) para que lo nuevo encaje con lo de antes.</p>

      <h3>Cositas que cuidé</h3>
      <ul>
        <li>Los case studies <strong>se abren como documentos</strong>, con su regla y su tipo de editor: leer sobre un proyecto también tenía que sentirse Mac.</li>
        <li>En móvil <strong>no quise rendirme a una lista sosa</strong>: mantuve el escritorio como pude.</li>
        <li><strong>Sin frameworks ni programas raros:</strong> es un archivo que subo tal cual. Me gusta que sea sencillo y mío.</li>
        <li>La papelera no borra nada — es un guiño, no un susto.</li>
      </ul>

      <h3>Por qué lo cuento</h3>
      <p>No es el portfolio más impresionante del mundo, pero es el más mío. Y si dice algo de cómo trabajo, es esto: me gusta partir de algo con raíz, cuidar los detalles y no perder mi voz por el camino. Empezó con mi tía enseñándome a mover un ratón. Supongo que sigo en las mismas — intentando que la tecnología se sienta un poco más cercana.</p>
      <p style="font-style:italic;color:#5a534a;">Gracias, tía Elvira.</p>

      <div class="cs-cta-row bottom"><a class="btn" href="sistema-diseno-board.html" target="_blank" rel="noopener">Ver el sistema de diseño →</a></div>

}

    return [out[0]].concat(resto);
  };
  const colocar = (el, c, id) => {
    const j = id == null ? 0 : 1;
    el.style.left = (c.x + j * (frac(id * 0.618034) * 28 - 8)) + "px";
    el.style.top = (c.y + j * (frac(id * 0.754877 + 0.3) * 24 - 6)) + "px";
  };

  let pegados = [], ghost = null, editor = null;
  const cerrarEditor = () => { if (editor) { editor.remove(); editor = null; } if (ghost) ghost.style.visibility = ""; };

  // ---- El post-it en blanco: se escribe directamente en él
  const abrirEditor = (host, celda) => {
    if (editor) return;
    const d = document.createElement("div"); d.className = "postit nuevo" + (celda ? "" : " in");
    d.style.setProperty("--pc", COLORES.amarillo);
    d.innerHTML =
      '<textarea maxlength="140" placeholder="Escribe aquí…" aria-label="Tu mensaje"></textarea>' +
      '<input type="text" maxlength="30" placeholder="tu nombre (opcional)" aria-label="Tu nombre o alias (opcional)" autocomplete="off">' +
      '<div class="pn-trap" aria-hidden="true"><input type="text" tabindex="-1" autocomplete="off" aria-hidden="true"></div>' +
      '<div class="pi-bar"><div class="dots">' +
        Object.keys(COLORES).map((c, i) => '<label title="' + c + '"><input type="radio" name="pi-c" value="' + c + '"' + (i === 0 ? " checked" : "") + '><span style="--dc:' + COLORES[c] + '"></span></label>').join("") +
      '</div><span class="pi-count">0/140</span><button type="button" class="pi-ok">Pegar</button><button type="button" class="pi-no" aria-label="Cancelar">×</button></div>' +
      '<div class="pi-err" role="status"></div>' +
      '<div class="pi-nota">Se publica al momento y lo ve todo el mundo. No guardo tu correo ni tu dirección. Sin enlaces.</div>';
    const ta = d.querySelector("textarea"), al = d.querySelector('input[type=text]'), trap = d.querySelector(".pn-trap input"), err = d.querySelector(".pi-err"), ok = d.querySelector(".pi-ok"), cnt = d.querySelector(".pi-count");
    if (celda) { colocar(d, celda, null); desktop.appendChild(d); } else host.insertBefore(d, host.firstChild);
    editor = d; if (ghost) ghost.style.visibility = "hidden";
    d.querySelectorAll("input[name=pi-c]").forEach((i) => i.addEventListener("change", () => d.style.setProperty("--pc", COLORES[i.value])));
    ta.addEventListener("input", () => { cnt.textContent = ta.value.length + "/140"; });
    d.querySelector(".pi-no").addEventListener("click", cerrarEditor);
    d.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); cerrarEditor(); } else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ok.click(); });
    d.addEventListener("mousedown", (e) => e.stopPropagation());
    ok.addEventListener("click", async () => {
      const texto = ta.value.trim(), alias = al.value.trim();
      const color = (d.querySelector("input[name=pi-c]:checked") || {}).value || "amarillo";
      if (trap.value) { cerrarEditor(); return; }                       // trampa para robots
      if (!texto) { err.textContent = "Escribe algo en el post-it."; return; }
      if (LINK.test(texto) || LINK.test(alias)) { err.textContent = "Sin enlaces, por favor."; return; }
      if (Date.now() - leer(LS_ULTIMO, 0) < 30000) { err.textContent = "Espera medio minuto para pegar otro."; return; }
      ok.disabled = true; err.textContent = "";
      try {
        const cuerpo = { mensaje: texto, color }; if (alias) cuerpo.alias = alias;
        const r = await fetch(API + "/postits", { method: "POST", headers: { ...HDR, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify(cuerpo) });
        if (r.ok) { guardar(LS_ULTIMO, Date.now()); cerrarEditor(); pintarEscritorio(); pintarMuro(); return; }
        const t = await r.text();
        err.textContent = /Demasiados/.test(t) ? "Hay mucho movimiento. Prueba en un rato." : /sin_url/.test(t) ? "Sin enlaces, por favor." : /largo/.test(t) ? "Entre 1 y 140 caracteres." : "No he podido pegarlo. Prueba otra vez.";
      } catch (e) { err.textContent = "No he podido conectar. Prueba otra vez."; }
      ok.disabled = false;
    });
    ta.focus();
  };

  // ---- Escritorio: "+" y post-its repartidos
  const pintarEscritorio = async () => {
    pegados.forEach((n) => n.remove()); pegados = [];
    if (ghost) { ghost.remove(); ghost = null; }
    if (!grande()) return;
    const cs = celdas();
    ghost = document.createElement("button"); ghost.type = "button"; ghost.className = "postit ghost";
    ghost.innerHTML = '<span class="plus" aria-hidden="true">+</span><span>Deja tu post-it</span>';
    ghost.setAttribute("aria-label", "Deja tu post-it");
    colocar(ghost, cs[0], null);
    ghost.addEventListener("click", (e) => { e.stopPropagation(); abrirEditor(null, cs[0]); });
    desktop.appendChild(ghost);
    if (editor && !editor.classList.contains("in")) ghost.style.visibility = "hidden";
    let filas; try { filas = await pedir(80); } catch (e) { return; }
    const ocultos = leer(LS_OCULTOS, []);
    filas.filter((r) => !ocultos.includes(r.id)).slice(0, cs.length - 1).forEach((r, i) => {
      const n = nota(r, false); colocar(n, cs[i + 1], r.id);
      const gp = leer(LS_POS, {})[r.id];
      if (gp) { n.style.left = Math.max(0, Math.min(gp[0], window.innerWidth - 160)) + "px"; n.style.top = Math.max(24, Math.min(gp[1], window.innerHeight - 110)) + "px"; }
      n.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".pi-x") || e.button > 0) return;
        const sx = e.clientX, sy = e.clientY, l0 = n.offsetLeft, t0 = n.offsetTop; let movido = false;
        n.setPointerCapture(e.pointerId); n.style.zIndex = Math.min(++zNota, 95); n.classList.add("arrastrando");
        const mv = (ev) => { movido = true; n.style.left = Math.max(0, Math.min(l0 + ev.clientX - sx, window.innerWidth - 60)) + "px"; n.style.top = Math.max(24, Math.min(t0 + ev.clientY - sy, window.innerHeight - 40)) + "px"; };
        const up = () => { n.removeEventListener("pointermove", mv); n.removeEventListener("pointerup", up); n.removeEventListener("pointercancel", up); n.classList.remove("arrastrando");
          if (movido) { const g = leer(LS_POS, {}); g[r.id] = [n.offsetLeft, n.offsetTop]; guardar(LS_POS, g); } };
        n.addEventListener("pointermove", mv); n.addEventListener("pointerup", up); n.addEventListener("pointercancel", up);
      });
      const x = document.createElement("button"); x.type = "button"; x.className = "pi-x"; x.textContent = "×"; x.setAttribute("aria-label", "Ocultar este post-it");
      x.addEventListener("click", (e) => { e.stopPropagation(); const o = leer(LS_OCULTOS, []); o.push(r.id); guardar(LS_OCULTOS, o); pintarEscritorio(); });
      n.appendChild(x); desktop.appendChild(n); pegados.push(n);
    });
  };

  // ---- Ventana "Muro": todos los post-its (y la única forma de escribir en móvil)
  const w = makeWindow("muro", "Muro de post-its", ICON, '<p class="intro" id="muro-intro">Cargando…</p><p><button class="btn" type="button" id="muro-nuevo">Dejar un post-it</button></p><div class="muro-grid" id="muro-grid"></div>', 150, 70, 520);
  const pintarMuro = async () => {
    const g = document.getElementById("muro-grid"), i = document.getElementById("muro-intro");
    let filas; try { filas = await pedir(200); } catch (e) { i.textContent = "No he podido cargar el muro ahora mismo."; return; }
    g.querySelectorAll(".postit:not(.nuevo)").forEach((n) => n.remove());
    filas.forEach((r) => g.appendChild(nota(r, true)));
    i.textContent = filas.length ? filas.length + (filas.length === 1 ? " post-it dejado por visitantes." : " post-its dejados por visitantes.") : "Todavía no hay ninguno. Deja el primero.";
  };
  document.getElementById("muro-nuevo").addEventListener("click", () => abrirEditor(document.getElementById("muro-grid"), null));
  new MutationObserver(() => { if (w.classList.contains("open")) pintarMuro(); }).observe(w, { attributes: true, attributeFilter: ["class"] });

  // ---- Entrada del menú: en escritorio abre el post-it en blanco; en móvil, el Muro
  const nueva = () => {
    if (grande()) { if (!editor) { const cs = celdas(); abrirEditor(null, cs[0]); } if (editor) { const t = editor.querySelector("textarea"); if (t) t.focus(); } }
    else { openWindow("muro"); setTimeout(() => abrirEditor(document.getElementById("muro-grid"), null), 150); }
  };
  let tmr; window.addEventListener("resize", () => { clearTimeout(tmr); tmr = setTimeout(() => { if (!editor) pintarEscritorio(); }, 250); });
  // ---- Enlace secreto del correo: ?quitar=<código> abre una ventana para quitar ese post-it
  (function quitarPorEnlace() {
    const m = location.search.match(/[?&]quitar=([0-9a-f-]{36})/i);
    if (!m) return;
    const token = m[1];
    const q = makeWindow("quitar", "Quitar un post-it", ICON, '<p id="q-txt">Has llegado desde el enlace de tu correo. ¿Quitas ese post-it del muro para todo el mundo?</p><p><button class="btn" type="button" id="q-si">Quitar este post-it</button> <button class="btn" type="button" id="q-no">No, dejarlo</button></p>', 120, 90, 380);
    openWindow("quitar");
    const limpiar = () => { try { history.replaceState(null, "", location.pathname); } catch (e) {} };
    document.getElementById("q-no").addEventListener("click", () => { limpiar(); q.querySelector(".close").click(); });
    document.getElementById("q-si").addEventListener("click", async () => {
      const t = document.getElementById("q-txt");
      try {
        const r = await fetch(API + "/rpc/quitar_postit", { method: "POST", headers: { ...HDR, "Content-Type": "application/json" }, body: JSON.stringify({ p_token: token }) });
        const ok = r.ok && (await r.json()) === true;
        t.textContent = ok ? "Hecho: el post-it ya no está en el muro." : "No he encontrado ese post-it: ya estaba quitado o el enlace no es válido.";
        if (ok) { pintarEscritorio(); pintarMuro(); }
      } catch (e) { t.textContent = "No he podido conectar. Prueba otra vez."; }
      document.getElementById("q-si").remove(); limpiar();
    });
  })();
  const reordenar = () => { try { localStorage.removeItem(LS_POS); } catch (e) {} pintarEscritorio(); };
  window.__postits = { pintarEscritorio, pintarMuro, nueva, reordenar };
  pintarEscritorio();
})();

/* ============================================================
   LA BOLSA: cifras reales, contadas del propio escritorio
   ============================================================ */
(function bolsa() {
  const all = [];
  DESKTOP.forEach((d) => { if (d.cards) d.cards.forEach((c) => all.push(c)); });
  Object.values(NESTED).forEach((n) => n.cards.forEach((c) => all.push(c)));
  const proyectos = all.filter((c) => c.kind === "project" && (c.caseStudy || c.href));
  const cases = proyectos.filter((c) => c.caseStudy);
  const antes = 60, ahora = 10, baja = Math.round((antes - ahora) / antes * 100);
  const spark = (seed, dir) => {
    let y = dir > 0 ? 11 : 3, pts = [];
    for (let i = 0; i < 24; i++) { seed = (seed * 9301 + 49297) % 233280; const r = seed / 233280 - 0.5; y = Math.max(2, Math.min(12, y - dir * 0.35 + r * 3)); pts.push((i * 5) + "," + y.toFixed(1)); }
    return '<svg class="spark" viewBox="0 0 115 14" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts.join(" ") + '" fill="none" stroke="#4be37a" stroke-width="1"/></svg>';
  };
  const rows = [
    { sym: "PROY", name: "Proyectos en el escritorio", val: String(proyectos.length), chg: "▲", cls: "up", dir: 1 },
    { sym: "CASE", name: "Case studies escritos", val: String(cases.length), chg: "▲", cls: "up", dir: 1 },
    { sym: "OFIC", name: "Años de oficio", val: "20+", chg: "▲", cls: "up", dir: 1 },
    { sym: "PRES", name: "Presupuestar: 1 h → 10 min", val: "−" + baja + "%", chg: "▼", cls: "down", dir: -1 },
    { sym: "CAFE", name: "Cafés", val: "∞", chg: "▲▲", cls: "joke", dir: 1 },
  ];
  const html =
    '<div class="bolsa-head"><span>MVM MAISON · BOLSA</span><span>cierre de hoy</span></div>' +
    rows.map((r, i) => '<div class="bolsa-row ' + r.cls + '"><span class="sym">' + r.sym + '</span><span>' + r.name + '</span><span class="val">' + r.val + '</span><span class="chg"><span>' + r.chg + '</span></span>' + spark(i * 977 + 31, r.dir) + '</div>').join("") +
    '<div class="bolsa-tape"><span>RESPIRA ▲ YA EN EL MERCADO &nbsp;·&nbsp; PRESUPUESTOS ▼ 1 H → 10 MIN &nbsp;·&nbsp; GATO ▲ MENÚ PRINCIPAL &nbsp;·&nbsp; PAPELERA ▬ SE RESTAURA SIEMPRE &nbsp;·&nbsp; CAFÉS ▲▲ SIN LÍMITE &nbsp;·&nbsp;</span></div>' +
    '<div class="bolsa-foot">Las cifras se cuentan solas a partir de este escritorio. Los gráficos son decorativos y los cafés, una exageración.</div>';
  const w = makeWindow("bolsa", "La Bolsa", null, html, 105, Math.max(40, Math.min(173, window.innerHeight - 400)), 340);
  if (w) w.classList.add("bolsa");
  if (window.innerWidth > 760) openWindow("bolsa");
  window.__bolsaCuadre = { proyectos: proyectos.map((c) => c.title), cases: cases.map((c) => c.title), baja };
})();

/* ============================================================
   BARRA DE MENÚS (desplegables)
   ============================================================ */
(function menus() {
  const bar = document.getElementById("menubar");
  const titles = [...bar.querySelectorAll(".mtitle")];
  const drops = {};
  const frontWindow = () => [...document.querySelectorAll(".window.open")].filter((w) => w.id !== "welcome").sort((a, b) => (+b.style.zIndex || 0) - (+a.style.zIndex || 0))[0];
  const closeWin = (w) => { const c = w && w.querySelector(".close"); if (c) c.click(); };
  const projects = [];
  DESKTOP.forEach((d) => { if (d.kind === "folder" && d.cards) d.cards.forEach((c) => { if (c.kind === "project" && (c.caseStudy || c.href)) projects.push({ folder: d.title, c }); }); });
  const openProject = (c) => { if (c.caseStudy) openWindow(c.caseStudy); else window.location.href = c.href; };
  const tidy = () => document.querySelectorAll(".icon").forEach((el) => {
    const pos = originalPos[el.dataset.id]; if (!pos || el.style.display === "none") return;
    el.style.transition = "left .25s, top .25s"; el.style.left = pos.x + "px"; el.style.top = pos.y + "px";
    setTimeout(() => { el.style.transition = ""; }, 300);
  });
  const folders = DESKTOP.filter((d) => d.kind === "folder");
  const defs = {
    gato: [
      { l: "Acerca de este escritorio…", f: () => openWindow("case-portfolio") },
      { l: "Léeme primero", f: () => openWindow("leeme") },
      "-",
      { l: "Dejar un post-it…", f: () => window.__postits.nueva() },
      { l: "Ver la bienvenida otra vez", f: () => window.showWelcome() },
    ],
    archivo: [
      { h: "Abrir" },
      ...folders.map((d) => ({ l: d.title, f: () => openWindow(d.id) })),
      { l: "Contacto", f: () => openWindow("contacto") },
      "-",
      { l: "Cerrar ventana", f: () => closeWin(frontWindow()) },
      { l: "Cerrar todas las ventanas", f: () => document.querySelectorAll(".window.open").forEach((w) => { if (w.id !== "welcome") closeWin(w); }) },
    ],
    edicion: [
      { l: "Copiar mi email", f: () => { try { navigator.clipboard.writeText("meryvillena@proton.me"); } catch (e) {} } },
      { l: "Escribirme un correo…", f: () => { window.location.href = "mailto:meryvillena@proton.me"; } },
    ],
    ver: [
      { l: "Ordenar iconos y post-its", f: () => { tidy(); window.__postits.reordenar(); } },
      { l: "Mostrar La Bolsa", f: () => openWindow("bolsa") },
      { l: "Muro de post-its", f: () => openWindow("muro") },
      { l: "Restaurar el escritorio", f: () => { restoreAll(); tidy(); window.__postits.reordenar(); } },
    ],
    proyectos: (() => { const o = []; let last = ""; projects.forEach((p) => { if (p.folder !== last) { o.push({ h: p.folder }); last = p.folder; } o.push({ l: p.c.title, f: () => openProject(p.c) }); }); return o; })(),
    ayuda: [
      { l: "Cómo se usa este escritorio", f: () => window.showWelcome() },
      { l: "Sistema de diseño", f: () => window.open("sistema-diseno-board.html", "_blank", "noopener") },
    ],
  };
  Object.keys(defs).forEach((k) => {
    const d = document.createElement("div"); d.className = "mdrop"; d.setAttribute("role", "menu"); d.dataset.for = k;
    defs[k].forEach((it) => {
      if (it === "-") { const x = document.createElement("div"); x.className = "msep"; x.setAttribute("role", "separator"); d.appendChild(x); return; }
      if (it.h) { const x = document.createElement("div"); x.className = "mhead"; x.textContent = it.h; d.appendChild(x); return; }
      const b = document.createElement("button"); b.type = "button"; b.className = "mi"; b.setAttribute("role", "menuitem"); b.textContent = it.l;
      b.addEventListener("click", (e) => { e.stopPropagation(); closeAll(); it.f(); });
      d.appendChild(b);
    });
    bar.appendChild(d); drops[k] = d;
  });
  let current = null;
  function closeAll() { current = null; titles.forEach((t) => { t.classList.remove("open"); t.setAttribute("aria-expanded", "false"); }); Object.values(drops).forEach((d) => d.classList.remove("show")); }
  function openMenu(t, focusFirst) {
    closeAll(); current = t.dataset.menu;
    t.classList.add("open"); t.setAttribute("aria-expanded", "true");
    const d = drops[current]; d.style.left = Math.max(0, Math.min(t.offsetLeft, window.innerWidth - d.offsetWidth - 4)) + "px"; d.classList.add("show");
    d.style.left = Math.max(0, Math.min(t.offsetLeft, window.innerWidth - d.offsetWidth - 6)) + "px";
    if (focusFirst) { const f = d.querySelector(".mi"); if (f) f.focus(); }
  }
  titles.forEach((t) => {
    t.addEventListener("click", (e) => { e.stopPropagation(); if (current === t.dataset.menu) closeAll(); else openMenu(t, e.detail === 0); });
    t.addEventListener("mouseenter", () => { if (current && current !== t.dataset.menu) openMenu(t, false); });
    t.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); openMenu(t, true); } });
  });
  document.addEventListener("click", (e) => { if (!bar.contains(e.target)) closeAll(); });
  desktop.addEventListener("mousedown", (e) => { if (!bar.contains(e.target)) closeAll(); });
  document.addEventListener("keydown", (e) => {
    if (!current) return;
    const items = [...drops[current].querySelectorAll(".mi")], i = items.indexOf(document.activeElement);
    const ti = titles.findIndex((t) => t.dataset.menu === current);
    const visible = titles.filter((t) => t.offsetParent);
    if (e.key === "Escape") { const t = titles[ti]; closeAll(); t.focus(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); (items[i + 1] || items[0]).focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); }
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); const vi = visible.indexOf(titles[ti]); const n = visible[(vi + (e.key === "ArrowRight" ? 1 : visible.length - 1)) % visible.length]; openMenu(n, true); }
  });
  window.addEventListener("resize", closeAll);
})();

/* ============================================================
   VERSIÓN MÓVIL / SEO (lista accesible con el mismo contenido)
   ============================================================ */
(function buildMobile() {
  const m = document.getElementById("mobile-view");
  let h = '<div class="m-head"><h1>Mery Villena</h1><p>Diseño de producto digital · no-code · operaciones</p></div>';

  const mCard = (card) => {
    if (card.kind === "folder") return ""; // las anidadas se expanden aparte
    if (!visible(card)) return "";
    const link = card.caseStudy ? '<button class="btn"' + labelAbrir(card) + ' onclick="openWindow(\'' + card.caseStudy + '\')">Abrir proyecto →</button>' : card.href ? '<a class="btn"' + labelAbrir(card) + ' href="' + card.href + '">Abrir proyecto →</a>' : '<span class="btn disabled">' + (card.disabledLabel || "Próximamente") + "</span>";
    return '<div class="m-card">' + tagsHtml(card) + "<h3>" + card.title + "</h3><p>" + card.desc + "</p>" + link + "</div>";
  };

  DESKTOP.forEach((item) => {
    if (item.kind === "folder" && item.cards) {
      h += "<section><h2>" + item.title + "</h2>";
      if (item.intro) h += '<p class="intro">' + item.intro + "</p>";
      item.cards.forEach((c) => { h += mCard(c); });
      item.cards.filter((c) => c.kind === "folder" && NESTED[c.ref] && visible(c)).forEach((c) => {
        const n = NESTED[c.ref];
        h += '<div class="m-sub">' + n.title + "</div>";
        n.cards.forEach((cc) => { h += mCard(cc); });
      });
      h += "</section>";
    } else if (item.id === "sobremi") {
      h += "<section><h2>Sobre mí</h2><p>Llevo más de 20 años trabajando en publicidad, marketing y operaciones, en agencias como Publicis, Wunderman y Havas, y desde 2018 en la gestión de varios restaurantes McDonald’s. Ahora diseño, construyo y pongo en marcha productos digitales para negocios pequeños, desde lo que ve el cliente hasta lo que necesita el equipo para trabajar.</p><p><a class=\"btn\" href=\"cv/index.html\" target=\"_blank\" rel=\"noopener\">Ver mi CV →</a></p>";
      const n = NESTED["trabajo-grafico"];
      if (visible({ kind: "folder", ref: "trabajo-grafico" })) {
        h += '<div class="m-sub">' + n.title + "</div>";
        n.cards.forEach((cc) => { h += mCard(cc); });
      }
      h += "</section>";
    } else if (item.id === "leeme") {
      h += "<section><h2>Léeme primero</h2><p>Soy una apasionada de los sistemas de diseño. Por eso este escritorio está inspirado en la interfaz de los Mac de los años 90 —un sistema de diseño antes de que existiera esa palabra. Te recomiendo empezar por Soluciones de negocio o Herramientas.</p></section>";
    } else if (item.id === "contacto") {
      h += "<section><h2>Contacto</h2>" + contactHtml("-m") + "</section>";
    }
  });

  m.innerHTML = h;
  attachContact("-m");
})();
